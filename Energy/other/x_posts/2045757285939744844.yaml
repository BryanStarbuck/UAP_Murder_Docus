text: |
  John Christie, an Australian inventor, and his partner Lou Britz, a South African engineer, developed the Lutec 1000, a device for generating free energy. Although they achieved a breakthrough in the early 1990s, neither Christie nor Britz achieved commercial success with the device.

  Britz died under mysterious circumstances, and Christie was considered missing for years before finally passing away in 2017 at the age of 82.

  How convenient that they invent a new form of energy that could revolutionize the world, only for it to be suppressed!

