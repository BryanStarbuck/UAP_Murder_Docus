  text: "FURTHER NOTES ON UFO PHYSICS!\nThe general idea is that of a “magnetic propellor”,\
    \ driven by 3 or 5-phase magnetic fields, which does not spin in open space, but\
    \ rather in a pool of liquid-metal (mercury, gallium or galinstan) that is spinning\
    \ by a Lorentz force (DC power at 12 volts, 100 amps) in the opposite direction\
    \ (see slide 1 below).\nNaively we might expect such liquid-metal to be pushed\
    \ downward as the spinning magnet rises up, just like water is pushed backward\
    \ by the spinning propellor of a motorboat? If the liquid-metal were stationary\
    \ and not spinning, that is what would happen.\nYet the fast spin of that liquid-metal\
    \ will create an induced magnetic field N’/S’ in the same sense as that of the\
    \ permanent magnet N/S, so the two objects may attract (Tesla 1901).\nAlso by\
    \ Newton’s 3rd Law, that liquid-metal might be expected to counter-spin very rapidly,\
    \ in response to the forward-spinning magnet? Yet as shown in video 2 (by someone\
    \ else), that kind of spin versus counter-spin does not show conservation of (mass)\
    \ angular momentum. \nThus when electric current flows through both the spinning\
    \ magnet, and its nearby wires (or liquid metal), Newton’s 3rd Law does not seem\
    \ to apply.\nThis is called the “Lorentz force” used in all motors or generators.\
    \ It would be interesting if we could use electric current alone to make the big\
    \ magnet spin in UFOs, just like we use electric current to make liquid-metal\
    \ spin, but there does not seem to be enough energy. \nSo we need to add 3 or\
    \ 5-phase power as an extra step. People on other planets must have worked this\
    \ out millions of years ago! Our crop-artist friends.\nHopefully I can complete\
    \ this great problem in 2025 (on Earth). Any helpful suggestions, or lab research\
    \ by other scientists, will be welcome"
