  text: 'This is the third drone video in four months to show something like "spinning
    magnetic levitation" using 3-phase, rotating magnetic fields.

    No one else but me seems to hav studied this new physics so far. Some previous
    workers studied it, but only superficially.

    If they had weighed the spinning "floater'' magnet, they would have found that
    it stays aloft  without any N-S dipole fields.

    If they had used 3-phase wire coils, they would have found that the "floater"
    magnet rises first from below three 3-phase coils, then rises again above three
    3-phase coils, likewise with no N-S dipole fields.

    Thus the source of spinning levitation is more akin to "helical" magnetic fields
    like those seen in astronomical jets.

    The possible relevance of such new physics to UFO levitation bas not escaped my
    attention. 🛸'
