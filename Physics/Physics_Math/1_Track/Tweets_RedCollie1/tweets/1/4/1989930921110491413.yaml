  text: "Time to teach everyone some \"alien\" symbols for electrical physics! \n\
    Slide 1 shows the \"Lorentz force\" as drawn in crops 1995, using alien symbols\
    \ rather than our inscrutable textbook equations. Much easier to understand. \n\
    \"B\" is a N/S magnetic field. The dashed line shows how electric current makes\
    \ a disc conductor \"turn in a circle\".\nSlide 2 shows the \"homopolar motor\"\
    , which turns in a circle (dashed central lines) due to the Lorentz force. Many\
    \ small, curved symbols just outside are \"liquid-metal brushes\". These enable\
    \ a good electrical connection between a DC battery and a spinning disc conductor,\
    \ placed over a N/S magnet. \nSlide 3 shows a \"turning\" Lorentz force, with\
    \ a big \"trident\" symbol above, which means \"3-phase power\".\nWhat happens\
    \ if we combine the two kinds of force? \nSlide 4 shows how we can place a disc\
    \ magnet (holey disc below) into a series of liquid-metal brushes, which receive\
    \ DC current from many round electrodes outside. This will cause the disc magnet\
    \ to SPIN rapidly (anti-clockwise).\nNext when we add 3-phase power (the large\
    \ \"trident\" symbol), that Lorentz-spinning disc magnet may \"lift up\" like\
    \ for a UFO! The schematic image of a \"landed UFO\" could be seen in the landscape\
    \ nearby. Just to make things clear.\nObviously then, I should try to make a disc-magnet\
    \ spin rapidly by a Lorentz force, using liquid-metal brushes, then add a 3-phase\
    \ magnetic field, to see whether it \"lifts up\" as a novel kind of \"anti-gravity\"\
    ?\nIn the first comment below, I show how a homopolar disc-magnet turns rapidly\
    \ by a Lorentz force, when we add DC current from a battery, and connect that\
    \ current to the spinning magnet, by means of a \"solid carbon brush\".\nEasy\
    \ to do! However we need to KEEP adding DC current as the disc magnet rises up\
    \ with added 3-phase power. Thus we will need liquid-metal brushes, which extend\
    \ upward, some distance from the lowest point of spin. \nIn summary, we are being\
    \ taught SO MUCH new science in alien-made crop pictures, but no one seems to\
    \ want to study what they are showing us! \nSort of like a \"tribe of monkeys\"\
    \ being shown a \"right-angled triangle\" in the grass. Most of the \"monkeys\"\
    \ just want a banana or sex. They do not care about a \"right-angled triangle\"\
    . Pythagoras is far beyond their mental faculties. \nMaybe only one or two \"\
    monkeys\" will pay attention. They may even be ridiculed by other monkeys. \n\
    So it is on planet Earth today. It is YOUR CHOICE to remain a \"dumb monkey\"\
    , or to become an \"intelligent spaceman\"? YOUR CHOICE. \nPlease see a carbon-brush,\
    \ homopolar motor in the first comment below. \U0001F412\U0001F412\U0001F412\U0001F47D\
    \U0001F47D\U0001F47D"
