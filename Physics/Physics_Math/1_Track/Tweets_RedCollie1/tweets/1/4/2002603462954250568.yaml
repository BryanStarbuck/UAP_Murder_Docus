    \ road!\nI watched it for 5-10 seconds, then it flew away silently with incredible\
    \ speed over trees to the south. \nThen I called the local military base to report\
    \ it. \nDebunkers later said, \"It must have been a helicopter or a weather baloon.\
    \ You never saw anything.\nAliens have never visited Earth, They can't get from\
    \ distant stars to here.\" \U0001F921\nThere were 10,000 similar sightings reported\
    \ that year in the USA alone. Even when there were no \"swamps\" nearby. \U0001F6F8\
    \U0001F6F8\U0001F6F8\nMy tolerance for debunkers and shills is now quite low.\n\
