  text: "I suspect that the mysterious physics of UFO-flight may be based on TWO fast-spinning\
    \ \"magnetic vortices\", one just above a fast-spinning magnetic flywheel, and\
    \ another just below.\nSlide 1 shows some \"vortex\" images drawn in crops (on\
    \ the left), plus the close-up photo of an alien drone which flew over Canada\
    \ in 2025. (The Tic-Tac UFO looks like this). Do you see those \"two vortices\"\
    ? \nMovie 2 shows the full-length video of that alien drone that flew over Canada.\
    \ There are many similar examples. Do you see a flat \"spinning flywheel\"? \n\
    Movie 3 shows a fast-spinning \"magnetic vortex\" which I made in the lab recently,\
    \ from my home-made device (based on \"plans\" drawn in crops by friendly E.T.'s).\
    \ \nA repeated TRANSITION of that central spinning magnet, between the lower vortex\
    \ and an upper vortex, quick and powerfully up-and-down (like for the fast, up-down\
    \ motion of a piston in a car), may perhaps be the KEY to understanding UFO physics.\
    \ \nI plan to investigate that hypothesis soon. \nJust like for curved spacetime\
    \ in Einstein's theory of gravity, or the Lorentz force of electromagnetism, or\
    \ the \"warp drive\" proposed by Alcubierre, it might work in an inertia-less\
    \ fashion, that does not follow Newton's classical laws of motion. \nWe will STUDY,\
    \ MEASURE and LEARN.\U0001F6F8\U0001F47D"
