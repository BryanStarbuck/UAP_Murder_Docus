  text: "THIS POST MAY UPSET SOME PEOPLE, BUT I HAVE BEEN ASKED TO TELL-INFORM THE\
    \ EARTH:\nEya Enki, Lord of the Earth, genetic creator of humans with his colleague\
    \ Ninmah. \nThey made us in their own image. \nAfter each experiment, he said\
    \ to Ninmah: \n\"Give those creatures their daily bread\". \nWhen we pray as Christ\
    \ recommended, we say:\n\"Give us our daily bread.\"\nIn Sumeria, they called\
    \ him \"Loving Father Enki\". \nWe say \"Our Father who is in heaven\". \nHe saved\
    \ Noah (Utnapishim) from the Flood, when many \"gods\" wanted humans on Earth\
    \ to perish. \n\"What right do you have to judge these people?\" he said later\
    \ to Enlil. \n\"It was not I who warned the human. He must have learned about\
    \ the Flood through a dream!\"\U0001F602\nLater he said to Moses: \n\"I am the\
    \ one called Eya. That is the name by which I wish to be remembered from generation\
    \ to generation.\" \n\"I cannot speak well,\" said Moses.\n\"What about your brother\
    \ Aaron?\"\U0001F605\nRecently we got this message (in Sumerian) from the stars:\
    \ \"nabu rakbu laraak, sanu ki!\" \nTELL-INFORM THE EARTH\U0001F30E\U0001F30D\U0001F30F\
    \nAs requested."
