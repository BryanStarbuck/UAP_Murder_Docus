  text: "Let me explain please, for all Alzheimer's sufferers and their families out\
    \ there? A recent paper in \"Nature\" shows that one of the major causes of Alzheimer's\
    \ seems to be a deficiency of lithium in the brain.\nIf you eat food with lithium,\
    \ say in the form of lithium carbonate, not much will pass through the blood-brain\
    \ barrier. And not many (or any) foods contain a substantial amount of lithium\
    \ oratate! \nBut if you consume 5 to 10 mg daily of lithium orotate  as a supplement,\
    \ where lithium is bound to a hydrophobic group, THEN lithium does seem to pass\
    \ through the blood-brain barrier (in mice or rats) to cure this serious DEFICIENCY.\
    \ Just like sailors on a ship who eat lemons to avoid scurvy. \nWarnings are given\
    \ that pregnant or breast-feeding women should NOT take lithium orotate, yet not\
    \ many of those have dementia. \U0001F921\nWe already know that lithium oratate\
    \ gets into the brain, because it is sold widely as an anti-anxiety \"mood enhancer\"\
    . No bad side-effects have been reported. \nI would suggest that anyone with early\
    \ signs of dementia take small 2 to 5 mg amounts of lithium orotate, then monitor\
    \ your progress, and report to your doctors? \nIdeally we would like a TEST to\
    \ tell whether anyone's brain is lithium-deficient, but do not know how to do\
    \ this safely and easily for humans. Does anyone out there have a good idea?\n\
    My friend Jack invented functional f-MRI in the 1980's, so new things must be\
    \ possible, although I was skeptical at the time. \U0001F600"
