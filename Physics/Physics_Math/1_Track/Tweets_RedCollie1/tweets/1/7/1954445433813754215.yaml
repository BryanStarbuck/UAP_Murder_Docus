  text: "NEW PHYSICS RELATED TO UFO LEVITATION:\nFollowing clues from certain crop\
    \ pictures (slides 1 and 2), as well as from a close UFO-contact by Edwin Fuhr\
    \ in Canada 1974 (movie 3), I made (for the first time on Earth) a \"magnetic\
    \ spinning top\" (movie 4, four examples shown).\nOrdinary tops \"precess\" in\
    \ the SAME direction as they spin, when the top begins to lose energy, and fall\
    \ to the ground.\nBut a magnetic spinning top will \"precess\" in an OPPOSITE\
    \ direction to how it spins, as the top gains energy, and rises in the air!\n\
    No one has ever done or seen that before. It is new physics, not predicted by\
    \ any theory. And it agrees so closely with slides 1, 2 and movie 3, that it is\
    \ very possibly related to UFO levitation. Just look at movies 3 and 4, then YOU\
    \ decide? \nI used three, 3-phase wire coils to make a central magnet spin, around\
    \ a central aluminum rod. Yet the key advance was to fix that aluminum rod to\
    \ a stainless-steel ball joint. That allows us to see how the spinning magnetic\
    \ flywheel PRECESSES, in an opposite direction to how it spins!\nThe ball joints\
    \ which I am using now have a little friction, and they would work even better,\
    \ if that friction could be removed?\nWe saw that \"opposite precession\" in three\
    \ UFO-instructional crop pictures from 2011, 2012 or 2016 (not shown here), but\
    \ nobody knew what it meant until now. Thus the problem is somewhat over-determined.\n\
    When I get some free time, I will do more in the lab, confident of being on the\
    \ right track. Others can help it they wish? \U0001F6F8\U0001F603To the stars."
