  text: "Avi Loeb pointed out today that 3I/ATLAS spins around its long axis once\
    \ every 16 hours, yet the six \"jets\" or \"thrusters\" which are coming from\
    \ its rear exhaust do not seem to be spinning at all. There are two possibilities\
    \ here. \nFirstly, those six \"jets\" are all firing off just once (in a brief\
    \ time) over 16 hours repeatedly. This seems unlikely.\nSecondly, the forward\
    \ part of that craft may be spinning once every 16 hours, like an \"O'Neill cylinder\"\
    \ (see below), while there is some kind of flexible joint between its forward\
    \ and reverse parts, allowing its six rear \"thrusters\" not to spin at all.\n\
    As we receive more detailed images of 3I/ATLAS, hopefully not \"all\" censored,\
    \ we may be able to say more? Only a fool in our modern world would not believe\
    \ in a general UFO/alien cover-up."
