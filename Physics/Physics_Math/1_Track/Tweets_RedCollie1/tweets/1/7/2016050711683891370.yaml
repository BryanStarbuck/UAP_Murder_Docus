    \ flux, when given three-phase power as U-V-W-U-V-W-U-V-W etc.\nI showed yesterday\
    \ and today how that works for 6 coils. When we go to 12 or 18 coils, it might\
    \ work even better! Please see slides 3 and 4 as drawn in crops. Each ring of\
    \ small circles there represents 18 or 15 wire coils, which make something SPIN\
    \ in the center. Once I test this simple system with 12 coils, I should be able\
    \ to learn more. \nTO THE STARS.\nAnti-gravity would be much better than rockets."
