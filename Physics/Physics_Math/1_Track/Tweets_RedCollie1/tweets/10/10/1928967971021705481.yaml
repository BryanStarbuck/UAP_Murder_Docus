note_tweet:
  text: "One of the greatest crop pictures in history appeared mysteriously near Barbury\
    \ Castle in July 1991 (slide 1). For many years, nobody knew what it was trying\
    \ to say! Later I figured out that it describes the horizontal-spin, then rise-precession,\
    \ of a \"spinning top\" (slide 2), using 3-phase power. \nRecently I have reproduced\
    \ that novel effect in the lab, using 6 wire coils given 3-phase power, and a\
    \ central spinning magnet (movie 3). \nIn this new movie, I zoomed in, so that\
    \ you can see details of how it spins and rises around a central aluminum pole,\
    \ while pressing up on a silicone bead, placed just above.\nWhy did friendly aliens\
    \ show us such novel physics on Earth in 1991, rather than many other images which\
    \ could be drawn for our education?\nPersonally I think it describes the underlying\
    \ physics behind UFO levitation, although that remains to be proven in our own\
    \ laboratories.\nDoes anyone, among 7 billion people on Earth, wish to study this\
    \ interesting effect further? Are there any Great Learned Professors of Physics\
    \ who might be interested?\nWait until you find out who has been \"talking\" with\
    \ us in the fields. \U0001F601\U0001F47D\U0001F6F8"
