  text: "And here is the rest. \"Spin\" is not just a mathematical construct but something\
    \ real. It never \"collapses\". \nTwo different spin-states may be two different\
    \ topologies for two linked rotations in 4-D xyzt, say (++, --) versus (+-, -+).\n\
    We see a similar effect when studying rings of DNA (plasmids) that can have widely-different\
    \ 3-D geometries, but well-defined and discrete topologies (called \"linking numbers\"\
    ).\nThe various \"orbitals\" may likewise represent various circular linking-numbers\
    \ of a closed electron path s, p, d, f, etc. The 3-D geometries will be probabilistic,\
    \ like for rings of DNA, but their TOPOLOGIES will be well-defined.\nPersonally\
    \ I think the mainstream quantum physics is just \"mathematical trick-playing\"\
    \ like with \"epicycles\" and \"deferents\". \n\"Wave-particle duality\" REALLY?"
