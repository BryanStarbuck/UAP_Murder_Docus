  text: "\"UFO physics\" as drawn in alien-made crop pictures: \na concise summary!\
    \ \U0001F6F8\nOutside we have fast-rotating, 3-phase magnetism.\nInside we have\
    \ an electrically-charged \"Corbino disc\".\nWhen we add a N/S magnet below (or\
    \ in the center), any liquid metal in that Corbino disc may spin anti-clockwise.\n\
    Then when we add 3-phase power from the outside, any central magnet may spin clockwise\
    \ (except at the Bloch wall). \nSuch \"counter-rotation\" of 3-phase and Lorentz\
    \ forces is supposed to create UFO levitation, bypassing Newtons 3rd Law.\nMany\
    \ UFO contactees have said that UFOs fly by means of two \"magnetic flywheels\"\
    , which spin in opposite directions. \nThe alien crop-artists also suggest that\
    \ spin and counter-spin are necessary, yet only one of those spins will be \"\
    magnetic\", while the other will be \"electromagnetic\". Maybe the UFO contactees\
    \ did not quite understand? \nI will try to build and test this kind of model\
    \ soon. \nI am still not certain whether to use one or two magnets in the center,\
    \ and whether the central spinning magnet should be placed above, or rather in-plane\
    \ with, liquid metal from the outer spinning Corbino disc? \nSpin of liquid metal\
    \ in a Corbino disc does not follow Newton's 3rd Law. \U0001F6F8 Think \"Maury\
    \ Island 1947\".\nIt has to work SOMETHING like this.\nThe world sleeps."
