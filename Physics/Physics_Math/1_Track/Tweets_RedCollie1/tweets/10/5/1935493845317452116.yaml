  text: "Quantum mechanics agrees completely with special relativity. How could it\
    \ NOT agree? The problem is all inside your heads, not in nature.\nhf (light with\
    \ spin 1) = mc2. \nhf (particle at rest with spin 1/2) = 2 x mc2. \nhf (particle\
