    \ mc2 + mv2 = 2 x mc2 (1 + v2/(2 x c2) by special relativity. \nThis is a low-speed\
    \ approximation for simplicity.\nAll particles at rest have an \"unseen\" periodicity\
    \ of motion through time (like for a Mobius strip) which gives them great energy\
    \ at rest!\nWhen a particle is in relative motion to an observer, we \"see\" some\
    \ of that internal periodicity by the de Broglie waves.\nAnd also by a right-hand\
    \ rule for magnetism, which derives from a right-handed twist in its Mobius-strip,\
    \ subatomic topology. \nThere is also a subtle reason why the speed of light is\
    \ finite, that comes from its spin 1/2 periodicity.\nSTUDY EVERYTHING IN FOUR\
    \ DIMENSIONS X-Y-Z-T.\nDo not be a \"Flatland\" physicist! Ignore what they teach\
    \ in the schools. \nHigher-dimensional particles, when they pass through our 3-D\
    \ space with different random orientations, will of course appear \"probabilistic\"\
    \ as we see them. \nThat does not mean they are \"probabilistic\" in higher dimensions.\
    \ Consider the many ways by which we can \"see\" a 4-dimensional cube in just\
