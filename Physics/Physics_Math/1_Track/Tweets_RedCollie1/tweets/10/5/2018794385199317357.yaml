  text: "On July 5, 2009, a large crop picture called the \"Quetzalcoatl Headdress\"\
    \ appeared silently between Silbury Hill and West Kennett Long Barrow at 3 or\
    \ 4 AM.\nTwo members of a film crew, visiting from California to make a documentary,\
    \ were watching that field constantly during the night with binoculars and cameras.\
    \ They saw or heard NOTHING until 4 AM when it became light, and they could see\
    \ this new crop picture faintly at dawn.\nNO ONE ELSE WAS THERE. \"Hoax\" would\
    \ have been impossible. I spoke with them two weeks later. \nThen on the early\
    \ morning of July 6, 2009, a Wiltshire policeman was driving along the road (from\
    \ where he could see the new crop picture) at 5 AM. He saw three tall, blond men\
    \ with white coats inspecting the fallen crops. He thought at first they were\
    \ British military.\nSo he stopped his car and parked, and walked across the road\
    \ to ask what they were doing? As he grew closer, both the three tall men and\
    \ policeman saw one another. They rushed away and somehow \"disappeared\". The\
    \ policeman drew a sketch of his encounter later. \nA famous UFO encounter in\
    \ Nebraska 1967, between a landed UFO and policeman there called Herbert Schirmer,\
    \ involved him walking inside the ship and seeing the occupants. Their uniforms\
    \ all had the symbols of a \"feathered serpent\" or \"flying serpent\", which\
    \ is the well-known symbol for \"Quetzalcoatl\". \nUFO contactee Billy Meier in\
    \ Switzerland likewise claimed to have met an alien called \"Quetzal\" many times.\
    \ \nOnly a \"retard\" at this point would insist on a \"hoax\" theory for ALL\
    \ crop pictures! They seem to be a lot of them. Is A.I. also mentally retarded?\
    \ \U0001F605"
