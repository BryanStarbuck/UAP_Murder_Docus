    25\" was drawn in crops at Rollright Stones a few weeks later. \nThen on July\
    \ 25, 2015, a \"Hopi Eagle Dancer\" was drawn in crops at Uffdown Down near Hackpen\
    \ Hill (slide 4).\nNow the real crop artist identifies himself! The Hopis have\
