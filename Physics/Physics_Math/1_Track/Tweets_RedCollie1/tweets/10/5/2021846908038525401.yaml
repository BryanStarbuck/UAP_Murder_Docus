    \ shown in a true photo from his Facebook page at the time (slide 1). \U0001F921\
    \U0001F921\U0001F921\nTurin at that time was in lockdown due to the Pope's visit.\
    \ Twenty young men would not have been able to descend en masse on some unsuspecting\
    \ farmer's field, from dark to dawn, without being noticed and arrested for vandalism.\n\
    Furthermore, that crop picture appeared directly under the end of an airport runway,\
    \ so no drones could fly to photograph it! \nAfter one week, a great Italian photographer\
    \ (Valeria) and her friend (Silvio) flew in his private plane to photograph it\
    \ (slide 2). \nOne of Valeria's \"airplane\" photos is shown in slide 3.\nIn summary,\
    \ Grassi is a big \"fat\" clown (pun intended) who works for the skeptics organization\
    \ CICAP as an Italian intel front. \nHe did not \"make\" it, and had no idea what\
    \ it meant, until he read my posts on the CCC website. \nIncidentally, two of\
    \ the 128 binary symbols outside were drawn as small triangles, not small circles.\n\
