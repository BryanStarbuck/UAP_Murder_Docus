  text: "Another lab movie is coming soon! Full instructions on how to build the new\
    \ spin / counter-spin device, for anyone skilled at electrical engineering. \n\
    This brief trailer just shows \"slow counter-spin\" by a series of 16 small magnets\
    \ N-N-S-S etc., caused by 3-phase power from a ring of 6 wire coils U-V-W-U-V-W.\n\
    We used a large-bore (90 mm), non-magnetic bearing to get counter-spin of this\
    \ kind in a small model. Yet for a large UFO, nobody could make a ball bearing\
    \ of many meters in diameter! \nThus it seems likely that large UFOs may use high-voltage\
    \ DC power to ionize a heavy gas (say xenon) in a tube around the outer perimeter.\
    \ \nSuch high-voltage plasma can then be made to counter-spin very rapidly, using\
    \ DC current and magnetism (like in a Corbino disc).\nThis may be why large UFOs\
    \ show high-voltage coronas around their outer edges? If so, then high DC voltage\
    \ per se is NOT making the UFO move through space! \nInstead, it may be needed\
    \ to ionize and spin a heavy gas, located in a ring around the outside, in order\
    \ to provide \"counter-spin\" for a central upward propulsion drive. Most UFOlogists\
    \ seem not to understand this important distinction.\U0001F6F8"
