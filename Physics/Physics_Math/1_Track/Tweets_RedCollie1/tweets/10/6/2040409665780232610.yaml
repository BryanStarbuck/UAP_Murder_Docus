note_tweet:
  text: "Here in this new video, we can see clear instructions on how to make a \"\
    spin / counter-spin\" device, needed to study UFO-levitation physics. I describe\
    \ in many places how alien-made crop pictures show the steps needed to construct\
    \ it.\nI used a large-bore, 90 mm ball bearing to get effective counter-spin for\
    \ this small model. Yet for a large UFO, we might get counter-spin from a round\
    \ tube of heavy ionizable gas, rather than from a ring of magnets spinning on\
    \ a ball bearing. \nSome crop pictures actually suggest a second method of getting\
    \ \"counter-spin\": by using high-voltage plasma, accelerated by DC current and\
    \ a strong magnetic field. \nPlasma-based counter-spin may explain why large UFOs\
    \ often seem to produce a high-voltage, DC corona around their perimeters.\U0001F6F8"
