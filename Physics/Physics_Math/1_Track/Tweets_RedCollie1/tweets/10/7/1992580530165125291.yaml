  text: "These two crop pictures, drawn at almost the same time in May 1999, show\
    \ how UFO levitation works in part due to the Lorentz spin of liquid metal in\
    \ a magnetic field.\nSlide 1 shows the flow of liquid metal with DC current alone,\
    \ and NO magnetic field.\nSlide 2 shows (at its center) how liquid metal SPINS\
    \ when given both DC current (plus/minus), and also a magnet \"m1\" placed just\
    \ below.\nMovie 3 shows how liquid metal spins in the lab exactly as was drawn\
    \ in crops (slide 2). \nALIEN SCIENCE but we can reverse-engineer! \nThe world\
    \ sleeps."
