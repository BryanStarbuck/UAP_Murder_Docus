note_tweet:
  text: "Quick physics lesson!\nMovie 1 shows how Newton's 3rd Law causes a spinning\
    \ disc to create counter-spin in another part of the device to which it is attached.\n\
    Okay, now let's ask: what if we spin two discs (or magnetic flywheels) in opposite\
    \ directions at the same time?\nThat is what we were shown in some famous crop\
    \ pictures from 2002 (slide 2). Somehow that makes a UFO \"rise up\". \nTry to\
    \ calculate the effects from classical physics if you can! Why do two counter-spinning\
    \ discs \"rise up\", under certain circumstances? \U0001F6F8\nI am not really\
    \ sure, so I am building small-scale physical models for detailed study."
