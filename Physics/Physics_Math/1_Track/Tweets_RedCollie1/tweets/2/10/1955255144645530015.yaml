note_tweet:
  text: "These are my four favorite clips from Eric Laithwaite's 1974 talk about \"\
    gyroscopes\". They show two general principles.\nFirstly, a fast spinning-motion\
    \ can turn a downward gravity force by 90-degrees sideways, just like for the\
    \ Lorentz force of electromagnetism.\nSecondly, there is a close relation between\
    \ off-axis precession and anti-gravity. Indeed, off-axis precession is CAUSED\
    \ by a combination of spin and downward gravity! \nThis is not UFO levitation\
    \ per se, but is still worth studying as background information. \nThe physicists\
    \ of his time completely failed to understand what he was doing (like the biologists\
    \ who ignored Gregor Mendel for 40 years). \U0001F921\nOf course, they completely\
    \ denied that real UFOs might exist. It was a heresy. Their science was/is just\
    \ a narrow-minded religion."
