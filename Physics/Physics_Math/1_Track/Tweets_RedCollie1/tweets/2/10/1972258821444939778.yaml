  text: "LATEST PROGRESS ON UFO PHYSICS!\nVideo 1 shows that we can closely simulate\
    \ \"UFO physics\", by spinning a permanent magnet on a rod using 3-phase power.\
    \ Many lines of evidence suggest this. \nThe problem is that such a strong, apparent,\
    \ \"rising\" force of the fast-spinning magnet (which pushes against space) produces\
    \ no-zero loss of total weight on a scale. \nThis is because that \"spinning and\
    \ rising\" force creates an equal and opposite \"downward\" force by Newton's\
    \ 3rd Law. \nTo get around this problem, we can try to push against some OTHER\
    \ spinning substance, which is not bound by Newton's 3rd Law. Say a spinning vortex\
    \ of liquid metal (galinstan) as shown in video 2. \nBecause that heavy, liquid\
    \ metal spins by a Lorentz force, and does no \"work\", we may be able to push\
    \ against it, without creating any unwanted downward force by Newton's 3rd Law?\
    \ \nMany ET-drawn crop pictures, for example shown in slide 3, suggest that we\
    \ will need to create some specific, counter-spinning force to get real, UFO-style\
    \ levitation.\nThat 2011 crop picture looks almost exactly like the liquid-metal\
    \ / magnet model shown in video 2, for the case of \"counter-rotation\". A big\
    \ \"disc magnet\" in the center, with liquid-metal spinning just outside of its\
    \ perimeter (lower part). \nWhen we add 3-phase power to that central disc magnet,\
    \ it begins to spin in the OPPOSITE direction (upper part), and \"rises\" (drawn\
    \ in crops nearby). \nI was there in 2011 when all of those UFO-instructional\
    \ diagrams came down. One appeared in early morning daylight. There is no doubt\
    \ of their alien reality. \nWe will know for sure, as soon as I can build a suitable\
    \ working model, and look for significant losses of total weight on a scale? Waiting\
    \ for needed parts to arrive. \U0001F6F8\U0001F606"
