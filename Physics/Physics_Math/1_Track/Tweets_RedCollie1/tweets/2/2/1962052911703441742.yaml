  text: "Nickel-carbonyl (slide 1) decays to nickel and carbon monoxide gas. Yet they\
    \ see an increase of nickel with cyanide gas being released, as 3I/ATLAS approaches\
    \ the Sun! \nThus we seem to see nickel-cyanate being released, (slide 2), rather\
    \ than nickel-carbonyl (slide 1). That is a well-known compound used for coating\
    \ iron or steel to prevent corrosion. \nThis might be called a \"techno-signature\"\
    . It would also help 3I/ATLAS to reflect sunlight brightly like a \"convex mirror\"\
    . \nMost comets actually show BOTH iron and nickel gases, even far from the Sun.\
    \ \nhttps://t.co/zwY3w4LvgO\nYet 3I/ATLAS shows only nickel and not iron. \nSo\
    \ it is not a typical comet. The astronomers do not seem to have studied inorganic\
    \ chemistry."
