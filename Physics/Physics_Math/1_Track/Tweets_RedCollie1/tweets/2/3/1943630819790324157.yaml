  text: "Now that I have had time to study the data, I tend to think that the \"Manu\"\
    \ beach-spider image is just a Photoshop overlay, made to fool gullible English\
    \ people?\nThe debunkers have been making LOTS of Photoshop overlays this year,\
    \ as a means of deception, using new tools provided by A.I. \nZoom into slide\
    \ 2, and you will NOT see any sand-graininess as for most real beach-art pictures.\
    \ If there is an authentic drone video, I may think differently?\nThis new crop\
    \ picture at Cerne Abbas was based stylistically on an Italian crop picture from\
    \ 2010. That is certain. None of the scammers or debunkers would have known that.\
    \ \nSomeone took a drone video of the real crop picture, them spread its image\
    \ to various debunkers, and perhaps our beach artist friend. \nRelease of the\
    \ real drone video was delayed until the fakery was set into place. There is another\
    \ \"fake\" image of Cerne Abbas going around (on paper), which I have not posted\
    \ here.\nDo not believe in ANYTHING without real, reliable evidence. There is\
    \ no real evidence (at present) that the \"beach spider\" was real, and made when\
    \ the artist said.\n\"Epstein never did sex trafficking\" LOL."
