    \ spin, most likely of a spinning magnetic flywheel or single magnet. \nSecondly,\
    \ we have close up videos of four drone UFOs which all shown SPIN. One of those\
    \ crashed recently in Columbia, and is being studied by Jaime and Fernando in\
    \ Mexico City (see video).\nThirdly, we have at least two dozen ET-made crop pictures\
    \ which show UFO physics diagrams in an abstract fashion.\nThree kinds of force\
    \ seem to be involved.  Firstly we have the strong upward force of a spinning\
    \ magnetic flywheel, which can be captured using a silicone bead.\nSecondly we\
    \ have the reverse spin of some 3- phase wire coils, which react to that spinning\
    \ magnet by Newton’s Third Law .\nFinally we have some kind of downward reaction\
    \ to an upward spinning magnet, which may not affect the wire coils, but which\
    \ lifts a complete UFO off the ground.\nI have solved for force 1, should produce\
    \ force 2 in the lab next week, and intend to study force 3. \nTO THE STARS \U0001F6F8\
