note_tweet:
  text: "The basic problem with trying to produce \"anti-gravity\" by spinning-vortex\
    \ magnetism is explained in video 1.\nThere we can see that a 3-phase magnetic\
    \ field can make a permanent disc-magnet RISE UP at low frequencies of 10 Hertz.\
    \ Yet when we go even faster, say 30 Hz, an overall weight on the scale does not\
    \ change. Thus we see a large increase of gravitational potential energy (due\
    \ to spin), but little to no change of overall weight (a force pressing down to\
    \ the ground). \nWe seemingly cannot lift those 3-phase wire coils ALONG WITH\
    \ the fast-spinning magnet in a DIRECT fashion, as would be expected for \"UFO\
    \ levitation\". But let's not give up yet!  \nAs shown in slides 2 and 3 (a crop\
    \ picture from 2018), if we place a big wire coil slightly below those 3-phase\
    \ wire coils and the fast-spinning magnet, and if that DC-rectified wire coil\
    \ ATTRACTS the spinning magnet by dipole forces (say N/S to N/S), then that large\
    \ wire coil should be lifted up as the spinning magnet RISES. \nAnd since that\
    \ large wire coil lies BELOW those three, 3-phase wire coils, they should be lifted\
    \ up as well. Like for a UFO. \nIt is something like for a man climbing a mountain.\
    \ He hammers in a piton slightly above his current position, then climbs up to\
    \ that piton. Next he hammers in another piton, slightly above his new position,\
    \ and climbs up to the second piton. Thus he can keep going up-and-up in a stepwise\
    \ fashion. \nThose inscrutable aliens! Any good physicist on Earth might say that\
    \ this clever solution could possibly work. But how do we know what our alien\
    \ friends are thinking, with their super-advanced intelligences, compared to ours?\
    \ \nAnyway, I will try to test this plausible method for producing \"anti-gravity\"\
    \ soon. If other people wish to test the idea as well, by all means feel free.\
    \ \U0001F6F8\nIn summary, we will be trying to use increased potential energy\
    \ of the spinning magnet to \"lift\" another part of the system, by standard attractive\
    \ magnetism. The distance between that fast-spinning magnet, and the large wire\
    \ coil, will try to remain constant as the magnet rises (see video 1). \U0001F600"
