  text: "Legends of Quetzalcoatl from central America. He always promised to return,\
    \ five years after the new Mayan calendar began in 2012. \nAs Donald Trump says,\
    \ it will soon be a \"Golden Age\" for the USA. Please read this ancient prophecy\
    \ to the very end, to understand why he used that phrase? \n\"Man was lifted beyond\
    \ the Earth. No longer He saw the Age of Destruction. Gone was the Age of Warfare.\
    \ \nWalk with me through this Age of the Future. Tula shines in all its glory,\
    \ but the metals are types we know not. Loving hands have rebuilt the parkways,\
    \ have paved the streets, have rebuilt the temples. There is a great building\
    \ where books are kept for scholars, and many are those who come to read them.\
    \ Tula is a great Center of Culture.\nCome with me to New Colula. Shining again\
    \ is My Father's Temple! Once more the city is filled with fountains, and the\
    \ parkways are wire-netted for birds of rare plumage, who sing to enchant the\
    \ listener. Cross through the parkway to My Father’s Temple. You will see again\
    \ the inscriptions which today your eyes are seeing, but now all people can read\
    \ them.\nCome to this city of the future. Here are buildings unlike those we build,\
    \ yet they have a breathless beauty. Here people dress in materials we know not,\
    \ and travel in manners beyond our knowledge.\nBut more important than all of\
    \ these differences are the faces of the people. Gone is the shadow of fear and\
    \ suffering, for man no longer sacrifices, and he has outgrown the wars of his\
    \ childhood. \nNow he walks in full stature towards his destiny, into the Golden\
    \ Age of Learning.\nCarry this vision on through the ages, and remember Quetzal\
    \ the prophet.\" 1⃣7⃣\nhttps://t.co/hwfUjxBLqK"
