note_tweet:
  text: 'Here is a wonderful, astronomical "puzzle" if someone wants to become famous,
    or just likes solving puzzles?

    This crop picture from July 10, 2005 predicted the outburst of comet 17P Holmes,
    more than two years later on October 24-25, 2007. It outburst somewhere near RA
    3 hours, 52 min and Dec +50 37 degrees (in Perseus near Mirfak).

    The numbers of "stars" in each white, flattened area (see below) may be read clockwise
    as 3 hours, 46 minutes, 45.5 seconds, or anti-clockwise as 3 hours, 55 minutes,
    46.4 seconds. Both values are fairly close to where comet Holmes suddenly became
    very bright.

    By using a computerized, high-resolution star map, at either of those two RA values,
    and following the declination path of comet Holmes through our night sky, can
    anyone match ALL of the stars which were drawn around it in crops? The solution
    to this problem has eluded us for 20 years. GOOD LUCK'
