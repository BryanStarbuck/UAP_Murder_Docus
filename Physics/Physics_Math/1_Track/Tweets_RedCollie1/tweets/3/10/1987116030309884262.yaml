  text: "This is perhaps the most important message ever given from aliens to humans\
    \ on Earth, yet most people seem unable to understand. \nThey play video games\
    \ or watch sports on TV. They follow ancient and bizarre \"religions\". \nThe\
    \ advanced Emerthers, who lead a \"Council of Five\" (Q's \"Council of Wizards\
    \ and Warlocks\"), made an emergency journey to Earth in 2015, across a distance\
    \ of 12 light years.\nThey wanted to warn us that enemy grey aliens from Orion\
    \ and Z Reticuli had sent a \"space vessel threat\" toward Earth, with the intentions\
    \ of planetary takeover.\nThose alien craft were seen and videotaped widely at\
    \ the time. They chose a special envoy from the US military to receive their messages\
    \ (via a neural chip like Elon has developed since).\nA time-travel source also\
    \ seems to be involved, since the first line of their message matches the town\
    \ center of Nuremberg, Germany. \nYou can see capital-letter codes for \"EISENHOWER\"\
    \ and \"MAJESTIC 12\", as well as a warning of \"CHECK ALL A.I.\" (back in 2015).\n\
    Now in 2025, the mysterious 3I/ATLAS is passing through our solar system, and\
    \ many people are discussing it as an \"alien threat\". \nA US military man who\
    \ met the Emerthers, and received these messages. may appear on a major UFO podcast\
    \ soon. Maybe that will help, I don't know? \n2026/2027 indicated."
