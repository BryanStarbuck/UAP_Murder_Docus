  text: "This new video explains how to make \"Prototype One\" of a simple device,\
    \ which may recreate UFO physics. \nIt generates a special kind of magnetic spin\
    \ and counter-spin, that has never been seen before, but which is supposedly the\
    \ underlying source of UFO physics, according to many different lines of evidence.\
    \ \nIf you watch the full video of 7 minutes, you will learn a lot and be amazed.\U0001F6F8\
    Nothing has been hidden, and I am NOT asking for any money! I have been guided\
    \ in the construction of Prototype One by two general sources of information.\
    \ \nFirstly, the eyewitness testimonies of contactees such as Norman Paulsen or\
    \ Edwin Fuhr, who were able to see close-up how UFOs fly. \nSecondly, by dozens\
    \ of \"blueprints\" drawn in crops worldwide from 1991 to 2025. I have been building\
    \ many small-scale models from such \"plans\", like Jodie Foster did in the movie\
    \ \"Contact\". \nI have not yet tried to measure the propulsion and/or gravity\
    \ physics of this new device, but plan to do so soon. Mainly in this post, I am\
    \ making its means of construction available to other inventors or space scientists\
    \ worldwide. \nThe evidence for this device being related to UFO physics is truly\
    \ compelling. Please watch and learn.\n\U0001F4AFTO THE STARS\U0001F47D\U0001F6F8"
