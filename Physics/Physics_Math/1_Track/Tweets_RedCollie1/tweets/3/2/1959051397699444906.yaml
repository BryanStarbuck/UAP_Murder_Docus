    \ EBENs. \n12. Once it became clear that an EBEN takeover attempt was inevitable,\
    \ \"Q\" (a human from the stars) joined with other human-friendly alien races,\
    \ to help us prepare for the STORM.\n13. So he met DJT in the White House, then\
    \ went on-line to start a Great Awakening. They will need DJT to be in charge\
    \ when the STORM happens.\n\"Trump, US military and Patriots will save the world\"\
    .\n14. Finally let us go forward to 2025. A large space rock is flying toward\
