    \ us that an alien spaceship is headed for Earth. But that will be a lie\".\n\
    15. Half of the human population have been so dumbed-down by alcohol, drugs and\
    \ Covid that they can no longer think clearly. When we need to defend our  planet,\
    \ they will still be talking about \"fake invasion\" scenarios. \n16. As Joseph\
    \ Goebbels said, \"If you tell a lie big enough, and keep repeating it, people\
    \ will believe it.\" Our governments have lied to us about UFOs, aliens and crop\
    \ pictures since 1960-1990, and are still lying today. If you watch TV, all you\
    \ can see are lies. If you listen to UFOlogists, mostly you hear lies. \n17. Alien\
    \ reconnaissance drones can fly en masse over New Jersey from the ocean, or over\
    \ our military bases worldwide, and most people still cannot understand. What\
    \ do you think they might be, Santa and his reindeer?\n18. We may be in a very\
