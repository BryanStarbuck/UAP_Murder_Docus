  text: "Most people in our world today seem to believe that \"aliens are not real\"\
    , and that our government will stage a \"fake alien invasion\" to bring in dictatorship.\n\
    Wow, that is just like believing that 90% of crop circles were made by \"men with\
    \ rope and boards\"! \nI have studied those subjects for 60 (sixty) years now.\
    \ What would I know? \U0001F921 I will briefly summarize the real facts, which\
    \ you can take on if you wish.\n1. Humans on Earth have been under the protection\
