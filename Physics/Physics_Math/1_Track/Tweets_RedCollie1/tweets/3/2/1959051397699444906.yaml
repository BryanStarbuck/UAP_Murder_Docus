    \ evolution by genetic engineering and/or cross-breeding. Just read your Bibles.\
    \ \n2. Two alien races are unfriendly, and want our planet for racial expansion.\
    \ Just like white Europeans took continental America away from the native tribes.\
    \ \n3. The US Government (some of them) met with both friendly and unfriendly\
    \ aliens in the 1950's, and made an (unwise) deal with the unfriendly ones. Because\
    \ they promised new weapons to use against Russia (that never worked).\n4. It\
    \ was all a deception, so that those unfriendly aliens (called EBENs) could establish\
    \ secret research facilities (underground) on Earth. \n5. Meanwhile the friendly\
    \ aliens, having been rejected by Eisenhower, began to make beautiful \"crop circles\"\
    \ around 1990, to spiritually improve humans here through exposure to advanced\
    \ and clever forms of art.\n6. In 2002, they drew in crops the image of an EBEN\
    \ and said, \"Beware the bearers of false gifts (weapons) and their broken promises.\
    \ Much PAIN but still time. Believe. There is GOOD out there.\" \n7. Later in\
    \ 2015, the friendly aliens became aware that those EBENs had sent a large \"\
    colonization\" space-vessel toward Earth. This could be 3I/ATLAS? \n8. So they\
    \ gave us further warnings about the EBENs, and how they were planning a Trojan\
    \ Horse takeover of Earth. \"Imminent threat soon to Earth's leaders and civilizations.\
    \ EBENs have sent a space-vessel threat.\" \n9. Some of those messages were given\
