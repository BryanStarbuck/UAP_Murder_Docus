  text: "Shepherds were living out in the fields near Bethlehem, keeping watch over\
    \ their flocks of sheep at night. \nAn angel of the Lord suddenly appeared to\
    \ them, and the glory of the Lord shone around them. They were terrified! \nThen\
    \ the angel said, “Do not be afraid. I bring you good news, that will give great\
    \ joy to all people.\nToday in the town of David, a Savior has been born to you.\
    \ He will be the Messiah, the Lord. \nThis will be a sign: you will find a baby\
    \ wrapped in cloth, and lying in a manger.”\nSuddenly a great company of heavenly\
    \ host appeared along with that angel, praising God and saying: \n“Glory to God\
    \ in the highest heaven,\n and on Earth, peace to those on whom his favor rests.”\n\
    After those angels left, and flew back into the night sky, the shepherds said\
    \ to one another, “Let’s go down into Bethlehem, to see what has happened?\" ✡️✝️"
