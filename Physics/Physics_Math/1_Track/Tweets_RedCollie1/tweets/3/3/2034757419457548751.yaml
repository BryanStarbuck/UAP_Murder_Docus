note_tweet:
  text: "The E.T. crop artists fly through space using a \"magnetic space propeller\"\
    , as shown in slides 1 and 2 below. That general concept seems beyond question.\n\
    It is something like the force which lifts a \"spinning top\" or \"spinning gyroscope\"\
    , as it presses against the vacuum of space (like for a pitched-propellor pressing\
    \ against water or air). \nIn addition, they say that we need a counter-spinning\
    \ motion just outside, as shown in slides 3 and 4. \nIt looks like a \"ball bearing\"\
    , doesn't it? That is why I ordered two large-bore (90 mm) ball-bearings, made\
    \ of non-paramagnetic ZrO2 or Si3N4. \nHaving built a small working model (please\
    \ see other videos on this page), we need to test whether \"spin and counter-spin\
    \ combined\" can produce any net total-thrust against the vacuum of space, which\
    \ could be used to replace \"rockets\" and/or \"ion drives\".\U0001F6F8"
