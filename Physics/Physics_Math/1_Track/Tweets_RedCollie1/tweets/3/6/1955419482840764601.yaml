  text: "As a third teaching exercise (today), please watch two brief videos below,\
    \ which show the SAME physics. \nWhen we add external force to a slowly-turning,\
    \ fast-spinning disc, to make it turn more rapidly, then that fast-spinning disc\
    \ RISES against the downward force of gravity! \nWhy does it do this? Because\
    \ the fast-spinning disc changes its nearby \"vacuum of space\" into a viscous\
    \ substance like water. That is called \"gyroscopic inertia\". \nBy making that\
    \ fast-spinning disc turn more rapidly, we are causing it to PUSH against an unseen\
    \ (and viscous) vacuum of space. Something like for boat propeller which is turning\
    \ at very slow speeds.\nHere is the GREAT PUZZLE: how can we extend that simple,\
    \ \"push-vacuum\" physics to make a large device for UFO levitation, as we see\
    \ in UFOs or orb-spheres flying around us? \U0001F6F8\nDrawn many places in ET-made\
    \ crop pictures. They use \"3-phase power\" rather than a \"string\"."
