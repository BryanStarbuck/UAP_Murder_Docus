  text: "I finally solved the hidden message from Crabwood 2002: \n\"25 years, then\
    \ we meet grey aliens from Zeta Reticuli\"\n2002 + 25 = 2027. \nThat ugly alien\
    \ you can see in slide 1.\nA \"compact disc\", drawn overlapping, gave the ASCII-coded\
    \ message shown in slide 2. \nWhen we create a 5 x 5 matrix as shown in slide\
    \ 3, we can see a \"star map\" picture.\nIt matches fairly well a star-map of\
    \ Reticulum near the binary system Zeta 1, Zeta 2, home of the enemy grey aliens.\n\
    \"Much pain but still time\" (25 years) \nPlease feel to share as you wish? \n\
    Now we know why they drew \"26\" and \"27\" numbered rings at Torino in 2015.\n\
    I did not learn about “textpic” computer format (needed to solve this hidden code)\
    \ until 2019, from a long alien message sent through “CJ”. Thanks to Rodney for\
    \ making things clear. \nThe time has come, and the world is about to change forever.\
    \ \nTen-year delta from \"Q\" in 2017. They came here for a reason. \n\"Q\" wrote\
    \ \"PAIN\" several times, as a clear reference to the coded message shown in slide\
    \ 2.\nStudy carefully, \U0001F9D0"
