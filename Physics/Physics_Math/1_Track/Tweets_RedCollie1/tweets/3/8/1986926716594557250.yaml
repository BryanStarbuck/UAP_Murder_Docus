note_tweet:
  text: 'Mercury spins in a magnetic field due to what is called a "Lorentz force".

    Basically we apply a strong DC current from in-to-out or vice-versa.

    The "force" of that electric field gets turned by 90 degrees, to make the mercury
    spins, because all of the nuclear and electron spin motions "line up" north-south,
    parallel to an applied magnetic field.

    Such fast spin motions turn the electric force by 90 degree, just like for blowing
    air onto a spinning top.'
