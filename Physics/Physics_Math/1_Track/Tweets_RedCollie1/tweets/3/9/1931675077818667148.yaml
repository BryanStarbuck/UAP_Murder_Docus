  text: "Today I wanted to study the gravity-physics of a permanent magnet which spins\
    \ either above or below a ring of six 3-phase wire coils (wired as U-U-V-V-W-W).\n\
    One of my new lab videos is shown below. Here are the experimental findings (never\
    \ done before on Earth):\n(1) The spinning permanent magnet (70 mm, 14 mm hole,\
    \ 3 mm thick) always goes UP against the downward force of gravity (like for a\
    \ spinning top).\n(2) Those 3-phase wire coils always go DOWN with a force precisely\
    \ equal to the upward force of that spinning magnet. \n(3) The overall gravity-weight\
    \ of both magnet and coils together therefore remains zero, since F-up = F-down.\n\
    (4) The permanent magnet can be placed either above or below those 3-phase wire\
    \ coils to give similar effects.\n(5) These spinning-magnetic forces have NOTHING\
    \ TO DO with the North or South poles taught in textbooks, since both orientations\
    \ of the permanent magnet as N-up or S-up give identical results.\n(6) Both spin\
    \ directions of the 3-phase magnetic field likewise give identical results.\n\
    (7) Those 3-phase wire coils create a HELICAL magnetic field, through which a\
    \ permanent magnet can rise as it spins, always upward against the force of gravity.\n\
    (8) Such 3-phase wire coils also go downward as a back-reaction to the rising\
    \ magnet, with an equal and opposite force, leaving the overall gravity-weight\
    \ of magnet plus wire coils unchanged.\n(9) To conclude, a spinning magnet plus\
    \ 3-phase wire cannot create a \"UFO drive\" by themselves, even when the upward\
    \ force of a spinning magnet reaches 1-2 kg. \nSo we will need to add a \"third\
    \ component\" to this system, which can use the upward force of a spinning magnet\
    \ in a more productive way.\nFurther experiments will soon be underway.\nTO THE\
    \ STARS \U0001F6F8\nP.S. I saw a silver saucer at close range in daylight 1965,\
    \ which hovered by anti-gravity, then flew off at incredible speed from a complete\
    \ stop. Please do not believe ANYTHING which our governments and news media say.\
    \ \U0001F921"
