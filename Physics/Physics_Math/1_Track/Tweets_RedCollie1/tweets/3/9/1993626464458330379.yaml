  text: "While we wait for another picture of 3I/ATLAS, I will show you the most amazing\
    \ crop picture of 2025, and explain what it means.\nSlide 1 shows a \"comet exploding\
    \ in space\". It appeared in 2005, and referred to the unexpected outburst of\
    \ comet 17P Holmes in late October of 2007. \nSlide 2 shows another \"comet or\
    \ star\" exploding in space. It appeared in Germany 2025, exactly 20 years after\
    \ the image shown in slide 1.\nAround the outside, we can see 20 Mayan symbols\
    \ for time, namely \"calendar years\". \nBy analogy to their 2005 crop picture,\
    \ perhaps we can expect another \"exploding star or comet\" in 2027, two years\
    \ later! \nWhy was that 2025 crop picture (slide 2) drawn in Germany? We can see\
    \ the answer in slide 3.\nThere we can see a DOUBLE MEANING, as a powerful mace\
    \ used for warfare in medieval times. It was called \"Morning Star\".\nNow the\
    \ term \"morning star\" was also used for Quetzalcoatl in ancient central America,\
    \ because of a Sun-Venus calendar which he taught to the Mayans. And we see 20\
    \ Mayan symbols for \"time\" around the outside in 2025. What a \"coincidence\"\
    .\nOther crop pictures likewise suggest that Quetzalcoatl will \"return\" to Earth\
    \ in 2027. He may be the first \"white horse\" of Revelation, who \"comes to conquer\"\
    . That is why many crop pictures point toward \"white horses\" in southern England.\n\
    Most of you already know a man called \"Q\", who met Donald Trump at the White\
    \ House in September 2017, and told him about a near-future STORM. \nJust to connect\
    \ the dots, I would like to suggest that \"Q\" is \"Quetzalcoatl\". \nWhile the\
    \ STORM will take place in 2026 or 2027. \n3I/ATLAS is some kind of prelude to\
    \ the STORM. \nGod versus Satan. God wins.✝️"
