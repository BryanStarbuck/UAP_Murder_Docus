    . \nThen on the way home through Singapore, I had a powerful and unexpected psychic\
    \ contact a few days later. I did not \"see\" Q, but it was a virtual-reality\
    \ experience which lasted for 10 minutes. \nWith that kind of tech, you can understand\
    \ why some people say they were \"taken up into a spaceship\", while actually\
    \ they were in their own home! \nHe showed me a piece of paper which had a series\
    \ of 11 letters, half of them \"blank\" like on a game show, to let me guess his\
    \ real name. I should not say it publicly, but can say that it means \"Keeper\
    \ of the Tree of Life\". \nAfter that strange contact, I quickly saw the same\
    \ symbolism in his August 8 crop picture. The landscape nearby showed two alternative\
    \ futures for humans on Earth: as a \"green living tree\", or as a \"brown dead\
    \ tree\".\nQ. and his people came here to save the world. \n\"We came here for\
    \ a reason\".\nNow with 3I/2025 coming, as a possible threat, it is time to make\
    \ such secret matters known. You can believe what you wish, but I am telling the\
    \ truth. \nDARKNESS TO LIGHT. \nQ-17. ☀️☀️☀️\n\"Q\" is just his nickname, like\
    \ I am called \"Red Collie\"."
