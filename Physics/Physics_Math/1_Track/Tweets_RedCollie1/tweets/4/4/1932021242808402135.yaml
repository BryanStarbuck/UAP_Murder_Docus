  text: "Interested people are making all kinds of suggestion, about how to make that\
    \ spinning magnet and its 3-phase wire coils RISE LIKE A UFO. Perhaps they might\
    \ wish to read my summary of currently-understood physics, and also some UFO-physics\
    \ crop diagrams, so we might go further?\n>>> When a permanent magnet spins within\
    \ a 3-phase (helical) magnetic field, it will always RISE AGAINST the force of\
    \ gravity. Both North and South poles of a permanent magnet spin and rise with\
    \ the same force, and in the same direction. \nThis is a TRUE “anti-gravity” force,\
    \ that may reach 1-2 kg in a small model system. By using a silicone-ball adapter,\
    \ we can even make that spinning magnet “lift up” non-spinning objects of weight\
    \ 1-2 kg.\nSuch a RISE against the downward force of gravity, however, produces\
    \ NO change of weight on a scale! This is because a complete system of spinning\
    \ magnet, and 3-phase wire coils, seems to induce a DOWNWARD force of equal magnitude.\
    \ By analogy, we can think of the rising force of a spinning top, which presses\
    \ down onto a tabletop with precisely the same force as by which it rises.\nHow\
    \ can we extract useful force and/or energy from such a fast-spinning, force-compensated\
    \ system? It seems easy to make a spinning magnet “lift heavy objects off the\
    \ ground”, when that magnet rises from 3-phase wire coils which are in contact\
    \ with the ground. But how can we make the complete system “lift up into the air”\
    \ like a UFO? <<<\nAs you can see from some interesting, alien-made crop pictures\
    \ shown below, we have not yet added a big, flat, round plate which partly covers\
    \ the 6 outer wire coils. \nSlides 1, 2 and 3 show the same device from a direct\
    \ overhead view (6 wire coils arranged into a ring shape, with a spinning magnet\
    \ in the center).\nSlide 4 shows the device from a perpendicular sideways view,\
    \ where we can see a long pole on which a disc magnet sits, plus a small round\
    \ ball just above to help stabilize spin, as well as wavy lines all around to\
    \ symbolize a rotating magnetic field.\nThe answer may lie in a careful study\
    \ of the data presented here. Dozens of crop pictures show various aspects of\
    \ UFO physics, and they are all worth careful study. Not being an \"alien\" myself,\
    \ sometimes their messages remain hard to figure out! \U0001F6F8\nOh, sure, these\
    \ were made by some \"old drunk men with boards\". They are trying to hide the\
    \ truth from you. They want you to remain poor and uninformed."
