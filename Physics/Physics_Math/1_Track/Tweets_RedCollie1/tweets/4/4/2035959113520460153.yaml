    \ and one 3-phase power supply (rather than 9 wire coils and two power supplies).\
    \ \nVarious dimensions have been optimized, and now the two sets of magnets (outer\
    \ versus inner) have been moved further apart, so that they do not attract or\
    \ repel one another.\nThe angular momentum due to counter-spin will always be\
    \ greater than that due to spin.\nLikewise the angular reaction by Newton's Third\
    \ Law to counter-spin will always be greater than that due to spin.\nThe visual\
    \ match of this new, simplified, 6-wire-coil model to various crop-drawn blueprints\
    \ is astonishing, as may be seen by a comparison of movie 1 with slide 2! \nMany\
    \ further technical details and comparisons will be shown in a full 10-minute\
    \ movie, to be posted soon.\nNo one has ever done this before. We may learn a\
    \ lot.\nThe 10-minute movie will show everyone exactly how to build the same device\
    \ in their own labs. \nEverything has to be open, reproducible, and easily understood.\
    \ \nPlease watch, download, copy and share. \nTeach your Professors well.\U0001F600\
