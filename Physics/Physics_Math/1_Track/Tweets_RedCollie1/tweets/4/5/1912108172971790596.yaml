note_tweet:
  text: 'Here we can see further studies of the "upward pole" force described in previous
    videos (posted below).

    When using a 100 mm permanent-magnet (13 mm hole, 8 mm rod) as a spinning object
    in a 3-phase magnetic field, we see "upward pole" forces only for the blue "South"
    orientation of that permanent magnet, and not for the red "North" orientation.

    Also in every case, the "upward pole" spin-motion for "blue-up" permanent magnets
    is always opposite to spin-motion in the magnet below.

    Edwin Fuhr in Canada saw that the top of each UFO rotated opposite to a spinning
    force below, consistent with our small-scale model.

    Given such promising early results, we will continue to investigate further! 🛸🛸🛸'
