note_tweet:
  text: "Here is my new, 10-minute video of a simplified model by which to study \"\
    UFO physics\". \U0001F6F8\nThe new model (video 1) uses just 6 wire coils and\
    \ one 3-phase power supply. It also matches well what has been drawn in crops\
    \ recently (slides 2, 3, 4). \nMany other close comparisons will be shown in second\
    \ half of the movie. We certainly seem to be on the \"right track\"! \nWhat is\
    \ truly remarkable here, is that we can get fast, powerful, clockwise spin, as\
    \ well as fast, powerful, anti-clockwise counter-spin, from the SAME 3-phase,\
    \ clockwise rotating magnetic field! \nNow we might expect two, counter-rotating,\
    \ magnetic discs to have strong and novel effects on Newton's Third Law of action-reaction,\
    \ and will study such effects soon.\U0001F600"
