  text: "The basic idea behind \"UFO physics\" is very simple.\nWe can get a strong\
    \ \"upward\" force from a fast-spinning magnet (or magnetic flywheel), because\
    \ it \"pushes against space\" like a spinning gyroscope. \nVery easy, if we apply\
    \ a rotating magnetic field (3 or 5-phase) to that magnet! \nThe problem is that\
    \ such an \"upward\" force is accompanied by an equal and opposite \"downward\"\
    \ force by Newton's 3rd Law. \nSo we see an increase of gravitational potential,\
    \ but no loss of total weight (\"up\" plus \"down\"), unless that spinning magnet\
    \ goes into \"free fall\". \nHow to solve this great problem? The E.T. crop artists\
    \ have suggested (many times) that we should try to change that \"downward\" force\
    \ into another kind of force, which does NOT follow Newton's 3rd Law: namely the\
    \ Lorentz force of electromagnetism.\nAs shown in a video below, added DC current\
    \ makes a disc magnet spin rapidly in one direction (by the Lorentz force), while\
    \ other thin wires which supply that DC current spin in an opposite direction.\n\
    We can see right away, that the mass of that disc magnet is perhaps 100 times\
    \ more than the mass of many thin wires which surround it below.\nYet they spin\
    \ in opposite directions at approximately the same speeds! This shows that spin\
    \ angular momentum (m x v x r) is NOT conserved, due to a peculiar sideways action\
    \ of the Lorentz force. \nDoes everyone understand so far?\nIn summary, if we\
    \ can change the \"downward\" force, for an upward spinning-magnet, into a Lorentz\
    \ force, then we should have NO real \"downward\" force, but only a force that\
    \ goes \"up\"! \nSo that will be my next experiment. I have had to order some\
    \ specialized parts to make the trial apparatus correctly, but will try to do\
    \ it in October, after all needed parts arrive. \n\"The simple is great\" (Lao\
    \ Tzu) \U0001F6F8"
