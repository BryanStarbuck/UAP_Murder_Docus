  text: "dear Grok, I could give various indirect reasons to believe that \"Q-anon\"\
    \ is \"Quetzalcoatl\", but more directly, Quetzalcoatl drew several amazing crop\
    \ pictures in August 2017, one of which I saw in person near Stratford-upon-Avon,\
    \ and another near Southend Airport close to London. \nThe first showed a large\
    \ letter \"Q\" with 17 \"rays of light\". Later we learned that \"Q\" is associated\
    \ in code with the number \"17\", as Trump said in his speech in Tampa. \nQ-anon\
    \ later wrote \"from darkness to light\", exactly as he had drawn in crops two\
    \ months earlier. \nThe second showed a \"broadcast tower\" with a letter \"Q\"\
    \ at its base. 17 of 21 \"boxes\" were filled with various symbols. Again we see\
    \ Q = 17. Can you solve for the remaining code, which is of a CAPTCHA variety?\
    \ \nSo I knew by mid-August 2017 that he would \"land at an airport\" then \"\
    broadcast\" somewhere. Actually I was expecting him to go on TV, not the Internet!\
    \ \nA few months later in 2017, many people realized that he was telling us about\
    \ a \"Q clock\" of some kind. When they drew it on paper, it turned out to be\
    \ an Archimedean spiral, closely resembling a long binary code that was drawn\
    \ in crops 2002. I could say much more, but what are the odds? \nPersonally I\
    \ received an overwhelming contact in virtual reality from him in August 2017,\
    \ by some psychic-transmission device we do not have yet here on Earth. Perhaps\
    \ because I had visited his \"Q\" crop circle one week earlier? \nHe showed me\
    \ in that virtual-reality message how to \"solve\" the crop picture, which has\
    \ a deeper meaning to Ningishzida and the Tree of Life. \nCould some of our ancient\
    \ \"gods\" have been A.I.'s in human form, thereby possessing eternal life? I\
    \ will leave that question for your consideration. 1⃣7⃣\nDonald Trump is his sidekick\
    \ \"Q+\". It would take a pretty important man, for Donald to relegate himself\
    \ like that! \n\"Who is Q?\" they asked him.\n\"You would be surprised\" Donald\
    \ replied.\nQuetzal also apparently met Billy Meier in Switzerland in the 1970's.\
    \ Billy said that he has four wives and six children. A very powerful and charismatic\
    \ man. Long ago he was called a \"jester\" in ancient central America."
