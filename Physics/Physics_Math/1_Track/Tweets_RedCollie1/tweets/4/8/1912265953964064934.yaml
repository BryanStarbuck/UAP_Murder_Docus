note_tweet:
  text: "I do not have any precise theory yet, to explain the strong and unexpected\
    \ \"rising of a central pole\" during spinning magnetic levitation.\nUsually the\
    \ spinning magnet rises (like a top).\nWhen that spinning magnet gets bound strongly\
    \ to a nearby 3-phase magnetic field, so that it cannot rise, then the pole rises\
    \ instead!\nThe upward force of that \"pole rising\" is MUCH greater than that\
    \ of a \"spinning magnet rising\".\nSince this kind of physics has been repeatedly\
    \ emphasized, as the source of UFO levitation, should we investigate further?\
    \ \nWe know that a UFO rises, because something inside is rapidly spinning, but\
    \ we do not yet know all of the details needed to build one ourselves. \nWhat\
    \ if we could find out? \U0001F604\U0001F6F8"
