    \ (for hot steam) go back and forth, over and over again, so that big wheel could\
    \ turn continuously! \nNow we measure \"power\" in \"watts\". Trains, ships and\
    \ many other industries soon became possible. \nArchimedes invented the \"lever\"\
    .\nTesla invented \"AC\" and \"3-phase\" electric power.\nIf we can do the same\
    \ thing for \"anti-gravity\", that will likewise revolutionize the world.\U0001F601\
