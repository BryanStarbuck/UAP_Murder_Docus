  text: "Suppose we have a world whose entire electrical power supply is DC. We would\
    \ consider them to be rather primitive, since we know now that AC power offers\
    \ many advantages for long-range power transmission, electromagnetic generation,\
    \ and control of current using capacitors rather than (hot) resistors. \nNext\
    \ let us suppose we have a world whose entire computer system is based on 2 symbols\
    \ (bits). Aliens would consider us to be rather primitive, since they know that\
    \ 4 symbols (quads) offer many advantages for parallel-stream coding, speed of\
    \ transmission and nearly-unbreakable encryption (by the ECR). \nWE are that primitive\
    \ 2-symbol world. Our A.I.'s will never gain the intelligence envisaged (optimistically)\
    \ by Elon Musk using just 2 symbols. Our military communications will be easily\
    \ broken by enemy aliens in any conflict (just like off San Diego in 2005).\n\
    DUMB, DUMB, DUMB.\nWe have been shown 4-symbol computing methods by friendly aliens\
    \ (the Council of Five), but refuse to use them. Our computer \"experts\" are\
    \ like primitive humans who use an abacus. \U0001F921\U0001F921\U0001F921"
