  text: "\"MORNING STAR\" Do you understand yet?\nQuetzalcoatl spent a night with\
    \ a Huiteca family. They fed him and played music. The father, an Indian farmer,\
    \ showed him a stone carving and said, \"This carving tells of the coming of the\
    \ Lord of the Dawn. It says he will come in a Year One Reed. It says he will build\
    \ a city and change the world.\"\nThe farmer had no idea who he was talking to.\
    \ He continued: \"Now many people say he will not come. Many people say it is\
    \ a long time from now that he will come. Some people say he will come from the\
    \ east, and will bring a great book of words and numbers. What do you think about\
    \ this?\"\nQuetzalcoatl grew gray with the depth of his answer. \"If I told you\
    \ of what I think, you would laugh and think me crazy. So I will say only this.\
    \ One day a race shall walk upon this earth, a race of men whose spirits are so\
    \ great, whose wisdom is so complete, whose powers to commune with the Creator\
    \ are so keen, they will dwarf the doings of the Lord of the Dawn of our day.\"\
    \ \nWhen he departed, Quetzalcoatl vowed to destroy the man-made gods. He said,\
    \ \"I shall return. I shall come from the east like the Morning Star, and I will\
    \ fulfill that part of the prophecy.\"\n MORNING STAR / GERMAN MACE"
