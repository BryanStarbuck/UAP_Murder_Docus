  text: "Today I measured how much upward force we can get, when a spinning magnet\
    \ (somewhat mysteriously) drives a central aluminum pole upward.\nThere are no\
    \ \"mechanical screws\", just a bare aluminum rod, and a spinning magnet with\
    \ a thin plastic centre.\nThe upward force against a board reaches 1000 grams\
    \ (1 kg) by a 3-phase frequency of 17 Hertz!\nThis is not \"UFO-propulsion\" per\
    \ se, but still very interesting and possibly related. \nOne kilogram upward at\
    \ 80 volts, 3 amps of 17 Hertz, 3-phase AC power! \nNever done before. They don't\
    \ have a clue. I will continue. \U0001F920\U0001F920\U0001F920"
