  text: "These slides show the first UFO-related case I worked on in 1999, prior to\
    \ studying crop pictures.\nA blue-eyed, blond-hair woman from \"somewhere else\"\
    \ made a visit in 1992 (along with her friend) to a young man in Sydney, for the\
    \ purpose of cross-breeding with a suitable human on Earth. I know of several\
    \ other cases of that kind, from Brazil or China. \nShe was/is quite a large women\
    \ by Earth standards, over six feet tall and 100 kg. After the morning encounter,\
    \ she left a long albino-type head hair (and scalp root) suitable for DNA forensic\
    \ analysis.\nI found some top DNA guys to help me, and we typed her mitochondrial\
    \ DNA region HVI to a rare lineage from the British Isles. \nHere is where the\
    \ \"strangeness\" began! Just before Christmas of 1998, I brought home some films\
    \ from our private lab, which showed her genetic DNA profile, along with various\
    \ other \"controls\". \nI was studying the film in bed, just before midnight,\
    \ making red ink-marks wherever her \"alien\" DNA differed from normal human over\
    \ 200 bp (in about 8 places).\nThen I went to sleep, and within say 30 minutes,\
    \ knew someone was in the room with us, placing an implant into my right ear (like\
    \ in Star Trek \"Wrath of Khan\").\nIt took me a while to wake up, and they were\
    \ gone, while the whole right side of my face was numb in some way (like by procaine).\
    \ My right eardrum was broken.\nI realized by morning that it was a \"tracking\
    \ implant\", Every night at 2 AM, it would vibrate due to a tracking signal sent\
    \ from the sky (other \"tracked\" people in each time zone?).\nOne night I received\
    \ electromagnetic telepathy (tingling like an electrical wire attached to your\
    \ head) with dozens of pictures shown in fast order. The transmission repeated\
    \ 3 times over say 5 minutes.\nI could not remember much, but the first slide\
    \ showed a \"Celtic illustrated manuscript\" in old-fashioned type, with three\
    \ big capital letters \"T\", \"de\" and \"D\" easily seen. I realized soon that\
    \ it was about when the Tuatha de Danaan went into Ireland 1500 BC. She wanted\
    \ me to know that the T de D were HER people! \nOther strange things happened,\
    \ for example \"seeing\" her by something I would call \"psychic Skype\". I felt\
    \ she was like a princess, while I was an aboriginal. \nIn summary, the whole\
    \ series of events was quite real. Another of them later healed my father in April\
    \ 1999, when he was dying of a stroke.\n\"My name is Sarana (Sirona), and I have\
    \ come here to help you.\"\nExpand your thinking. There must be other humans many\
    \ places in the stars. I trust some of them more than I trust our governments.\
    \ \n\"Believe, there is good out there.\"\U0001F6F8"
