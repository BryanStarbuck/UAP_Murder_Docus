  text: "\"Q\" was/is real, while DJT is his friend \"Q+\". 1⃣7⃣\n\"We came here (to\
    \ Earth) for a reason.\"\n\"Trump, US military and Patriots will save humanity.\"\
    \n\"Infiltration not invasion\".\nMy own view: two different groups of E.T.'s\
    \ met Eisenhower in the 1950's. \nOne group, led by \"Q\" or \"Quetzal\", offered\
    \ to help with our spiritual development, energy and medicine, but refused to\
    \ give us advanced weapons, to fight against Russia in the Cold War.\nThe other\
    \ group, led by a grey-alien EBEN general, did offer to give us advanced weapons\
    \ to fight against Russia in the Cold War,\n\"Q\" then met with Eisenhower again,\
    \ and WARNED him about the EBENs, but to no avail. The USA signed a secret deal\
    \ with the EBENs.\nWe then let them have secret bases on Earth, but the promised\
    \ weapons never worked. It was a \"Trojan Horse\" operation, so that they could\
    \ \"get inside of our city gates\".\n\"Q\" and his people then began making \"\
    crop circles\" in the 1990's, as a way to help our spiritual development. Some\
    \ of those crop circles warned clearly against the grey alien EBENs, and that\
    \ we had been deceived.\n\"Beware the bearers of false gifts (weapons) and their\
    \ broken promises (which never worked).\nMuch PAIN but still time (in 2002).\n\
    We oppose deception (like they deceived Eisenhower).\nBelieve. There is GOOD out\
    \ there.\" (in space, not just EVIL like for the EBENs)\n\"timeo E.T. ferentes!\"\
    \ (2015)\n\"Beware of E.T. bearing gifts!\" (the Trojan Horse).\nAlso in 2015,\
    \ a US military veteran called \"CJ\" was contacted by another friendly alien\
    \ group called the \"Council of Five\". They gave him very similar messages, which\
    \ I was asked by Linda Howe to translate.\nWhen \"Q\" (Quetzal) went onto 4chan\
    \ in 2017, he called them a \"Council of Wizards and Warlocks, who cannot be defeated\"\
    . \nSome of you at this point will ask Grok, whether any of this could be true?\
    \ Grok seems to be just a propaganda machine, meant to deceive. Grok calls me\
    \ a \"conspiracy theorist\" \U0001F605\U0001F602\U0001F923\nWhat you should really\
    \ ask Grok, is whether any human beings, at any place or time, have proved themselves\
    \ capable of making such spectacular crop pictures like those shown in slides\
    \ 1, 2, and 3, in the middle of the night, on unpaid farmer's land, when no one\
    \ else sees them, in just an hour or less? \U0001F921\nSome debunkers have of\
    \ course made fake A.I. images days or weeks later, which are easily detectable.\
    \ \nThey also told us in 2015 that the EBENs had sent a \"space-vessel threat\"\
    \ towards Earth. \nNow ten years later in 2025, we see the mysterious 3I/ATLAS\
    \ moving through our solar system. It is a credible, but yet unproven, candidate\
