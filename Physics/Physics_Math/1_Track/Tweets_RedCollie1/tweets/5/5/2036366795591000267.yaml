  text: "\"UFO levitation and Newton's Third Law\" \U0001F6F8\nWhen a spinning top\
    \ rises up (see movie 1), that upward action may be opposed by two different downward\
    \ reactions: (1) against the tabletop, and (2) against an invisible, resistive\
    \ vacuum.\nIf we could somehow eliminate downward force (1), then downward force\
    \ (2) would make it appear that the spinning top is rising \"magically\" like\
    \ a UFO (see movie 2). \nHow might we eliminate downward reaction force (1)?\n\
    Well, Edwin Fuhr and other contactees have noticed that a low-hovering UFO shows\
    \ not only \"spin\" but also \"counter-spin\" (see movie 3). \nMany descriptions\
    \ of a UFO-drive likewise feature two sets of magnets, which spin in opposite\
    \ directions to one another (see slide 4). \nI have made a new and simple model\
    \ to study UFO physics, as shown in many other recent posts on this page. \nIn\
    \ my new model (suggested by friendly E.T. visitors), we can use a \"ring\" of\
    \ 6 wire coils, wired as U-V-W-U-V-W, to make two different sets of magnets spin\
    \ either clockwise (at the center) or anti-clockwise (outside). \nIn this case,\
    \ Newton's Third Law will produce two opposing forces of reaction on the same\
    \ set of 6 wire coils: whether anti-clockwise (due to the central spinning magnet),\
    \ or clockwise (due to an outer spinning magnetic flywheel).\nThus in this particular\
    \ case, that ring of 6 wire coils may experience NO \"net\" reactive force from\
    \ Newton's Third Law at all, because two opposing vectors CANCEL.\nMight this\
    \ get rid of an unwanted downward force of reaction (1), between those two sets\
    \ of spinning magnets, and the 6 wire coils themselves? \nIf so, then we may be\
    \ left only with a downward force of reaction (2), between the spinning magnets\
    \ and an invisible vacuum. \nThose spinning magnets might thereby \"push\" the\
    \ entire device (or UFO) upward, just as the propellor on a boat (or airplane)\
    \ pushes the entire craft through the water (or air).\nNewton's Third Law may\
    \ still be working, but we can't SEE it work on any physical part of the UFO,\
    \ because it is only pushing downward against an invisible vacuum. There might\
    \ not be any \"inertial\" effects at all! \nI will study all of those theoretical\
    \ possibilities soon, using my new and simple but well-constructed model. Any\
    \ interested scientists are welcome to join in!\nDo you have something \"better\"\
    \ to do? \U0001F605\nP.S. Half of my Ph.D. thesis at Caltech was on left-handed\
    \ DNA, which many learned scholars and Nobel Prize-winners assured me could not\
    \ exist. \U0001F921"
