  text: "While we study the physics of \"spin\" and \"counter-spin\" as used for UFO\
    \ levitation, we may wish to review current knowledge of \"spin\" and \"counter-spin\"\
    \ in more well-known systems, say those used in hoverboards!\nIn this (old) video,\
    \ you can see how the fast spin of a lower flywheel with 6 N-S-N-S-N-S magnets\
    \ (similar to what we have found for the lower flywheel of our UFO model) produces\
    \ Lenz-inductive spin and/or rise of an aluminum disc placed above. \nIf we use\
    \ a drive-motor to \"spin\" that aluminum disc in one direction, while we \"counter-spin\"\
    \ those N-S-N-S-N-S magnets in the other direction, then we get greatly enhanced\
    \ repulsions due to fast RELATIVE motions! \nSuch physics may be relevant to UFO\
    \ flight, so we can study it and contemplate possibilities.\U0001F6F8"
