note_tweet:
  text: "Two crop pictures from 2012 (slide 1) purport to tell us how UFOs \"rise\
    \ up\". \nThe (blue) spinning motion of a magnet on the inside creates a force\
    \ that goes UP a pole. \nWhereas the (red) counter-spinning motion of an outer\
    \ flywheel (with 4 magnets) seems to create a force that goes down a pole.  \n\
    Some kind of interaction between those two forces supposedly causes a UFO to rise\
    \ up. \nThe red circle starts in the same place as the blue circle, then rises\
    \ by \"lift\" (green arrows), so that red lies above blue! \nYou can see a close\
    \ match of those crop pictures shown in slide 1 to my new lab video 2.  \nA great\
    \ problem is waiting here to be solved. Can YOU solve it? \nFriendly but inscrutable\
    \ aliens!\U0001F47DWhat are they trying to teach us? \nMEOW (slide 3) \U0001F4F7"
