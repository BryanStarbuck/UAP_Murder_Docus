    and took along some scissors, to cut some hair off the tail of a horse he would
    see on the way.

    That afternoon he put the horse-hair in an x-ray beam, and by the next morning
    had proven that Pauling''s proposal was right!

    Later that year, Max saw in an MRC Annual Report the famous "Photograph 51" taken
    by Rosalind Franklin of "B" DNA. He showed the photo to his students Watson and
    Crick, to help them discover the "double helix", while not taking credit for anything
    at all.

    We do not see many scientists of such a high caliber today. Max would say "example
    is not the MAIN thing for influencing others, it is the ONLY thing.

    I hope you have learned something here, and will apply such simple principles
    in your own lives. 😀'
