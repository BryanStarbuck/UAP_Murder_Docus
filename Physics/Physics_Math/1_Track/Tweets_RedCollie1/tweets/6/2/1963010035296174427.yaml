  text: "Here is a physics-discovery which I made several years ago, called the \"\
    ion rocket\". Mainstream physics does not know or understand this yet.\nIf we\
    \ go to very-high frequencies of 500 kHz from a solid-state Tesla coil, and excite\
    \ argon gas, then it can be repelled outward in a \"Lenz\" sense, whereas exciting\
    \ argon at a standard 50 Hz does not work. \nThis might in principle drive a space\
    \ -ocket by Lenz repulsion, but my homemade Tesla coil was not powerful enough\
    \ to do anything really forceful! \nTHEY DON'T KNOW. RIGHT IN FRONT OF YOUR EYES."
