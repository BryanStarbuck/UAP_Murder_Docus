  text: "A VORTEX in water, caused by a fast-spinning stir magnet (shown upside-down).\
    \ \nA VORTEX in spacetime, caused by the fast-spinning disc-mass of a gyroscope.\
    \ It allows that disc-mass to remain high off the ground (due to a loss of \"\
    downward\" gravity), and also causes spontaneous precession as the gyroscope falls,\
    \ but does not change the scale-weight below. \nA VORTEX in spacetime, caused\
    \ by a fast-rotating magnetic field (above on a Dremel). It causes a magnet (200\
    \ mm below) to spin high on a pole, without falling (due to a loss of \"downward\"\
    \ gravity), but does not change the scale-weight below. \nHow are those three\
    \ kinds of vortex propagated? \nHow do they reduce the \"downward\" force of gravity\
    \ in a local sense, while affected objects remain inside of each vortex? \nHow\
    \ can overall weight on a scale below remain unchanged? \U0001F9D0\nOur common\
    \ notions of Newtonian gravity, or General Relativity, will NOT explain these\
    \ interesting and unambiguous observations. \nOverall weight seems to be conserved,\
    \ whether a \"vortex\" is formed far above a scale or not. \nWithin any \"vortex\"\
    , a heavy gyroscope (or spinning magnet) may feel \"incredibly light\", since\
    \ they are not affected there in a local sense by \"downward\" gravity. \nWe can\
    \ see now why Newton was worried about \"water spinning in a bucket\"! \nPerhaps\
    \ we should study how large planetary masses, or small fast-spinning objects,\
    \ affect the underlying structure of spacetime, by curvature and/or twist?"
