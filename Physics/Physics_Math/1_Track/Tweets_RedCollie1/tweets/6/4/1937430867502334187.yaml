note_tweet:
  text: "To understand what this new crop picture from Italy 2025 is telling us, we\
    \ need to combine that new image with a closely-related crop image from 2011 (slides\
    \ 1 and 2 respectively). \nThen we get the big \"blue\" image shown in slide 3.\n\
    It describes how a \"wheel of stars\" is turning clockwise, something like what\
    \ we saw drawn in England last week at Hackpen Hill. \nMovie 4 shows an actual\
    \ rotation of stars in our night sky.\nWhy would the crop artist show us this?\
    \ Because his 2011 crop picture read \"Ea Enki space\". \nEnki was known in Babylon\
    \ both for genetics (the creation of Earth humans by hybridization), and also\
    \ for astronomy. \nAll of the stars in our southern night sky were once called\
    \ the \"stars of Ea\"! \nExpand your thinking. They are coming."
