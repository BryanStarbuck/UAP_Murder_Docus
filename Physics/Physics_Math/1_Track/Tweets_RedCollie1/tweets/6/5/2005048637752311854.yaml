note_tweet:
  text: "The angel Gabriel (Jibreel) has never asked anyone to kill anyone else, and\
    \ does not deliver his messages in a dark cave. Does everyone understand? \n\"\
    The angel Gabriel is a messenger, who was entrusted to deliver several important\
    \ messages on God’s behalf. Gabriel has appeared to at least three people: first\
    \ to the prophet Daniel (Daniel 8:16); next to the priest Zechariah, to foretell\
    \ and announce the miraculous birth of John the Baptist (Luke 1:19); and finally\
    \ to the virgin Mary, to tell her that she would conceive and bear a son (Luke\
    \ 1:26–38).\"\nGabriel’s name means “God is great,” and as the angel of annunciation,\
    \ he is the one who revealed that the Savior was to be called “Jesus” (Luke 1:31).\""
