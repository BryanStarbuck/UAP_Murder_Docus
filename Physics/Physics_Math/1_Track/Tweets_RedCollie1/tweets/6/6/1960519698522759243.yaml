  text: "People who do not understand a long-standing cover-up of all things \"alien\"\
    \ (for example UFOs, mystery drones, crop pictures, cattle harvesting, human abductions\
    \ and military contactees) may not be able to understand what just happened, during\
    \ high-resolution imaging of 3I/ATLAS by the James Webb Space Telescope. \nJWST\
    \ has an angular resolution close to that of Hubble, which gave us a nice, high-resolution\
    \ image of 3I/ATLAS a few weeks ago.\nYet when they FINALLY released the images\
    \ taken by JWST, a few days ago, they showed very-low-resolution images of 3I/ATLAS,\
    \ fuzzier even than images taken by SPHERE-X, which has a resolution 100 times\
    \ less than Hubble or JWST! \nIn other words, those JWST images of 3I/ATLAS, which\
    \ have been spread over many \"science\" websites, have seemingly been \"doctored\"\
    \ to show a low resolution of 200 to 300 times less than expected, for the known\
    \ capabilities of JWST. \nEach pixel in the image (shown below) may extend say\
    \ for 10 or 20 km, whereas JWST at that distance should produce one pixel for\
    \ every 100 to 200 meters. This seems to be strong evidence in favor of a COVER-UP,\
    \ of whatever non-natural features might have been seen in the original high-resolution\
    \ images? Or else JWST is broken? I don't think so! \nIf 3I/ATLAS ever comes within\
    \ the range of amateur telescopes, then the cover-up will end. Otherwise they\
    \ will enforce it ferociously, as I have experienced several times in past years.\
    \ Trump has no control. The security clearance goes ABOVE the US Presidency."
