note_tweet:
  text: "Let's calculate and compare! Very important. \nHubble resolution 0.04 arcseconds\
    \ per pixel (slide 1). \nSPHERE-X resolution 6.2 arcseconds per pixel (slide 2).\n\
    James Webb \"expected\" resolution 0.07 arcseconds per pixel (slide 3). \nWe can\
    \ do various calculations, but the orange coma in slide 3 is about 350,000 kilometers\
    \ wide. If we count the number of pixels (25 or 30) which show that coma, then\
    \ divide, we find about 12,000 km per pixel.\nNext, based on an expected resolution\
    \ of 0.07 arcseconds for JWST, and a distance of 350 million miles from Earth,\
    \ we would EXPECT a pixel width near 120 km. Please repeat these calculations\
    \ if you wish? I tried to use Grok 4 but it was hopeless!\nThus the resolution\
    \ which we SEE in slide 3 (JWST) is only about 1/100 of what we would EXPECT from\
    \ the JWST cameras, even those of \"low resolution\". \nThe effective resolution\
    \ which we see in the JWST image of 3I/ATLAS would be about 7 arcseconds per pixel.\
    \ \nThat is why slide 2 (SPHERE X) looks similar to slide 3 (JWST), because its\
    \ angular resolution is 6 arcseconds per pixel. A good check on the calculations!\
    \ \nThe Hubble image of slide 1 has a resolution of 0.04 arcseconds per pixel,\
    \ or 150 to 200 times better than slides 2 or 3, so the pixels there are very\
    \ small (tiny) by comparison. \nPlease calculate for yourselves if you wish to\
    \ learn more? I could not get a sensible answer from Grok 4. It seems unable to\
    \ solve such a problem (despite what Elon says). Whenever we calculate something,\
    \ we should actually LOOK at the data, to see whether we are doing it correctly?\
    \ A.I. cannot do that. \nIn summary, JWST is the \"big outlier\", with an effective\
    \ resolution close to 100 times less than expected, even when using its low-resolution,\
    \ spectral imaging cameras. \U0001F600\U0001F920\nIt SHOULD look like Hubble,\
    \ but instead it looks like SPHERE-X. And that is the \"bottom line\". I doubt\
    \ whether the loss of resolution was accidental."
