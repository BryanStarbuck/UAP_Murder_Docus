note_tweet:
  text: "CT scan of the orb-sphere being studied by Jamie Maussan. It looks just like\
    \ a crop picture from 2014 near Avebury, which I went to see in person! \nWavy\
    \ symbols around the outside represent a \"rotating magnetic field\".\nA tall\
    \ shape inside represents a \"spinning magnet on a pole\", which spins rapidly\
    \ due to the added 3-phase power. \nA third part was also drawn in crops nearby,\
    \ needed to make the device \"fly like a UFO\".\nJamie Maussan was there with\
    \ Fernando Correa and others! \nIf I learned more about the inner construction\
    \ of that sphere, I might be able to reproduce its physics in my private lab."
