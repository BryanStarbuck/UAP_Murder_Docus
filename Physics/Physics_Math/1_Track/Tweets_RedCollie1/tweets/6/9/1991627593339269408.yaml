  text: "Here we can see the gaseous coma of 3I/ATLAS (slide 1, amateur photography\
    \ from Earth), before NASA faked and manipulated the image to \"cover something\
    \ up\" (slide 2, Hi-Res image near Mars). \nThat coma certainly does NOT cover\
    \ the entire photographic field, as NASA claim on their website! The image shown\
    \ in slide 2 is a small, enlarged portion from the center of a large image.\n\
    What I find particularly troubling is that we can see many \"little boxes\" of\
    \ dotted particles in the empty space outside of that \"coma\" in slide 2. \n\
    Those cannot possibly be part of the original experimental image. but only a side\
    \ effect of data manipulation on a computer. \nNASA lied to the world. Plain to\
    \ see."
