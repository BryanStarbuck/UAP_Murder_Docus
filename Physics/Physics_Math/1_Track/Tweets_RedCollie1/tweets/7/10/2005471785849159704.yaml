  text: "Mohammed met an entity in a cave 610 AD. \nThat entity called itself \"Gabriel\"\
    \ or \"Jibreel\", and gave him the message: \n\"Read in the name of your Lord,\
    \ who created man from a clot of congealed blood!\" \nI can believe that he met\
    \ someone or something. \nBut was it the real \"angel Gabriel\"? \nOur creator\
    \ certainly did not make humans on Earth from a \"clot of congealed blood\"! \U0001F605\
    \U0001F602\U0001F923\nLike what was used in evidence during the O.J. Simpson trial.\
    \ \nFor one thing, the creation of a new species requires a combination of sperm\
    \ and egg cells, rather than just a single tissue fragment, like that used to\
    \ clone Dolly the sheep. \U0001F921\nFor another thing, his meeting with that\
    \ entity does not resemble in any way how the real angel Gabriel has interacted\
    \ with humans all through history. \nAs an example, please read an account of\
    \ how the angel Gabriel behaved, 600 years earlier, when he appeared to the father\
    \ of John the Baptist, and told him \"good news\": \nAn angel of the Lord appeared,\
    \ standing at the right side of the altar. When Zechariah saw him, he was gripped\
    \ with fear. But the angel said: “Do not be afraid, Zechariah; your prayer has\
    \ been heard. Your wife Elizabeth will bear you a son, and you are to call him\
    \ John. He will be a joy and delight, and many will rejoice because of his birth, for\
    \ he will be great in the sight of the Lord. He is never to take wine or other\
    \ fermented drink, and he will be filled with the Holy Spirit, even before he\
    \ is born. He will bring back many of the people of Israel to the Lord their God.\
    \ And he will go on before the Lord, in the spirit and power of Elijah, to turn\
    \ the hearts of the parents to their children, and the disobedient to the wisdom\
    \ of the righteous, to make ready a people prepared for the Lord (Jesus Christ).\"\
    \nZechariah asked the angel, “How can I be sure of this? I am an old man, and\
    \ my wife is well along in years.”\nThe angel said, “I am Gabriel. I stand in\
    \ the presence of God, and have been sent to speak to you and to tell you this\
    \ good news.\"\nThis is certainly not the same angel or entity who appeared to\
    \ Mohammed in a cave, 600 years later. Then asked him to kill unbelievers and\
    \ Jews. \nThe real angel of God brings love and good news. That other entity brings\
    \ hatred and death. \nNow we understand Islam 2000 years later. It does not come\
    \ from the same divine source as Judaism, Christianity or Hinduism. It comes from\
    \ another source.\nHumans on Earth were a divine creation, and did not come from\
    \ a \"clot of congealed blood\". Whichever entity said that, truly hates humanity,\
    \ and wants us all enslaved or dead."
