  text: "A legend concerning Q-uetzalcoatl, whom many of you know under other names:\
    \ \n\"These bearded strangers are the children of war. They speak my precepts,\
    \ but their ears do not listen. They have but one love and that is for weapons.\
    \ \nEver more horrible are these weapons, until they reach for one which is the\
    \ ultimate. Should they use that, there will be no forgiveness, and no turning.\
    \ \nUsing such a weapon is like reaching into the heavens for God. These things\
    \ are not man's decision, nor should man presume to think for all things, and\
    \ mock the Almighty. \nThere are lamps beyond which you are burning; roads beyond\
    \ which you are treading; and worlds beyond the one you are seeing. \nBe humble\
    \ before a Great Hand which guides the stars within their places. There are many\
    \ lodges in my Father’s Kingdom, for it is more vast than time, and more eternal.\"\
    \ ✝️"
