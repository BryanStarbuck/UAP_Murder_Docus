note_tweet:
  text: "The entry of 3I/ATLAS into our solar system, on what might be a \"planned\
    \ orbit\" past Mars, Venus and Jupiter (with access to Earth), could be one of\
    \ the most important events in modern human history. \nSo we need to investigate\
    \ further, as Avi Loeb has been doing! We have been warned many times about an\
    \ \"imminent\" alien threat to humans on Earth.\nAll was going well, with good\
    \ images by Hubble and SPHERE-X space telescopes, until the guys running James\
    \ Webb Space Telescope released (after a long delay) a highly-pixelated image\
    \ of 3I/ATLAS at very-low resolution, effectively less than for SPHERE-X (6 arcseconds\
    \ per pixel). \nEveryone was expecting those high-resolution cameras on JWST (0.07\
    \ arcseconds per pixel) to produce something \"excellent\". Instead we got the\
    \ highly-pixelated image shown in slide 1 (thanks to M.D.)\nDoes JWST possess\
    \ any spectral cameras with very-low, 10 arcseconds per pixel resolution? Probably\
    \ not, but I cannot get a straight answer on this. IF they have them, why use\
    \ your WORST cameras to image such an IMPORTANT space object? \U0001F921\nOr did\
    \ they collect a high-resolution image as expected, then added \"big pixels\"\
    \ to HIDE something, like we can do with many on-line programs or Photoshop?\n\
    The current situation remains very unsatisfactory. What is the hard kernel of\
    \ rock (or other substance) which lies at the center of a huge, carbon-dioxide\
    \ coma for 3I/ATLAS? That is what everyone wants to know! No one believes that\
    \ it is an \"icy water comet\".\nOne of my friends on this platform removed those\
    \ \"fake pixels\" from the JWST image graphically, as shown in slide 2. Well,\
    \ that is somewhat better. At least now we can \"see\" something! \nThen as an\
    \ early attempt to find out what hard, central object might underlie 3I/ATLAS,\
    \ I inverted the image graphically, so that we can see its \"bright\" center more\
    \ clearly (slide 3). \nThere is clearly SOMETHING THERE. Yet given so many prior\
    \ steps of data manipulation by JWST, and then by my friend, we can't be sure\
    \ what it is, natural or artificial? \nWould it be too much, at this point, to\
    \ ask for real, uncensored, high-resolution photographs of 3I/ATLAS by both Hubble\
    \ and JWST, so that the whole world will know what we are dealing with? \U0001F9D0\
    \U0001F978\U0001F60E"
