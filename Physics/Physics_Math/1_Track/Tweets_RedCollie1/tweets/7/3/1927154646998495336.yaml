  text: "TEACHING EXERCISE: The friendly crop artists drew two pictures in a row in\
    \ 2012, namely a \"cube\", and then a \"cube passing through a 2-D plane\". \n\
    They were trying to tell us that we live in 3-D \"Flatland\", and that reality\
    \ is four or five-dimensional!\nThat is where our physics has gone wrong. If we\
    \ reformulate special relativity and quantum mechanics in terms of a four (4)-dimensional\
    \ spacetime, everything makes much more sense. \nWe see discrete 4-dimensional\
    \ particles passing through our 3-D space in many random orientations, hence they\
    \ appear \"probabilistic\".\nWe KNOW they must be well-defined, otherwise many\
    \ of the constants in physics say for electron magnetic moment (1.0011596) or\
    \ fine-structure constant (137.035999) would not be precise to ten digits! \n\
    Our physics on Earth is like in the book \"Flatland\". \nPlease watch \"Crossovers\
    \ from another dimension\" the great movie about crop circles by Terje Toftenes\n\
    https://t.co/GoJBJXc1L6"
