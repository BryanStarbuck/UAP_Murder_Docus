    \ a bright, high-resolution image.\nAll NASA had to do was take 50 to 100 brief\
    \ (0.5 second) exposures, then \"stack\" those frames on top of one another, using\
    \ computer alignment, just as amateur astronomers are doing all over the world.\n\
    The resolution at its Mars speed of 30 km/sec would then have been 15 km for 0.5\
    \ second exposures. \nFor a series of 1-second exposures, the resolution would\
    \ have been 30 km. All in less than a minute! \nNASA are spreading bullshit, faster\
    \ than a farmer spreads cow manure."
