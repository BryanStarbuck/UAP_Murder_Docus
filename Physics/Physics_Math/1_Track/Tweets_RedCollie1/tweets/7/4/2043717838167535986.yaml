  text: "This brief movie and three slides show the precise physics of what I saw\
    \ today in the lab. A spinning magnet (blue) goes up-and-down in quick cycles,\
    \ relative to a stationary flywheel (red) just above, with four attractive magnets\
    \ (movie 1). \nThat up-and-down oscillation was drawn similarly in crops 2012,\
    \ as a periodic transition between low-spin and high-spin geometries (slides 2\
    \ and 3).\nThe nearby landscape suggested that is how UFOs fly (slide 4). Right\
    \ out of a friendly alien's mind!\U0001F47D\nHence this transition may represent\
    \ some clever mechanism, for capturing then releasing gravitational potential\
    \ energy.\U0001F6F8Like the two-step piston in a car?\nGiven all of these promising\
    \ clues, I intend to study it further soon. \U0001F600"
