  text: "I am testing three different models now with 6 x 90 mm, 9 x 60 mm, or 12\
    \ x 60 mm wire coils. \n3-phase linear induction drives a magnetic field with\
    \ 8 x 30 mm magnets arranged N-S-N-S-N-S-N-S, around (or just above) the outer\
    \ set of 6 x 90 mm wire coils, as shown in slide 1. I am still testing for the\
    \ best magnets to use in those other two cases.\nOne further concern is shown\
    \ in slide 2. Three-phase power as given to those 6 x 90 mm outer wire coils needs\
    \ to make an outer magnetic flywheel \"counter-spin\" nicely, while not interfering\
    \ with a central \"power spin\", produced by three other wire coils below! \n\
    Those 6 outer coils are wired as U-V-W-U-V-W, rather than as U-V-W for the 3 lower\
    \ coils. All of the U-V-W-U-V-W magnetic torque cancels close to the center of\
    \ this device, but can still inhibit the power-spin of a large central magnet\
    \ at high frequencies (say above 20 or 30 Hertz). \nHopefully this technical problem\
    \ will go away when we test 9 x 60 or 12 x 60 outer wire coils instead! Wired\
    \ as U-V-W-U-V-W-U-V-W or U-V-W-U-V-W-U-V-W-U-V-W. More cancellation of unwanted\
    \ torques near the center? \nPlease see slide 3 for how this UFO drive is \"supposed\"\
    \ to work! There is a power-spin upward at the very center driven by 3 lower wire\
    \ coils (the \"trident\" shape). Meanwhile another flywheel with 14 or 15 small\
    \ magnets spins in the opposite direction, surrounding that power-spin. \nYou\
    \ should be able to understand now, what I am trying reverse-engineer? Slide 4\
    \ shows our \"alien friend\" LOL. along with 16 small magnets outside, and a big\
    \ upward \"power spin\". They must think we are idiots! \U0001F605\U0001F602\U0001F923"
