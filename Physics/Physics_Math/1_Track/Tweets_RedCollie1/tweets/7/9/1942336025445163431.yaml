  text: "Littleton of July 6, 2025 showed a clever \"puzzle\" which I will explain\
    \ here. \nLooking first at slide 1, we can see that its \"basket weave\" (impossible\
    \ for humans to make) was drawn close to a \"chip-like\" building of similar appearance\
    \ as seen from above (dashed yellow line).  \nWas this a coincidence? NO. We can\
    \ be SURE, because the \"basket weave\" was drawn in crops, with exactly the same\
    \ rotational orientation of the chip-like building nearby (see slide 2) (dashed\
    \ red lines).  \nFirst part of the \"puzzle\" solved! Now we just have to figure\
    \ out, why the crop artists, looking down from space, wished to draw our attention\
    \ to that \"chip-like\" building? \nWhen we ZOOM OUT on Google Earth, we can see\
    \ the schematic image of a \"man's head\" with a \"chip\" in his ear, wearing\
    \ an \"earphone\" of some kind, and possibly talking with his mouth open (slide\
    \ 3). What are they trying to tell us? \nFinally let us look at slide 4. There\
    \ is a big \"T\" shape in the landscape next to that \"talking man\" with an \"\
    earphone\". The man is an airplane (or spaceplane) pilot. He is coming down to\
    \ LAND. I do not think it will be long.  woof to all"
