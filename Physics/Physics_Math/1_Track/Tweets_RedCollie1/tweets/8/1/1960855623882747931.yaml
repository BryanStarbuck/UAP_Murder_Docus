  text: "I will explain something here about \"science\". It has to be open and reproducible.\
    \ \nWhen I did the first x-ray crystal structures of right and left-handed DNA\
    \ as a graduate student at Caltech, I not only had to publish papers after peer\
    \ review, but also had to deposit all of the raw data with the Protein Data Bank,\
    \ so that others could reproduce my analyses if they wished. \nThis process may\
    \ lead to some controversies, other people may disagree with you on some details,\
    \ but that is \"real science\".\nWhen astronomers take pixelated photos of some\
    \ important object (namely 3I/ATLAS), and refuse to make the real original data\
    \ available, then you should NOT trust anything they might conclude in their \"\
    papers\"! \nIt has the appearances of science, as Feynman said, but it is not\
    \ real science, just \"cargo-cult science\". \nWe saw another complete failure\
    \ of science recently with the Covid vaccines. They hid data from their clinical\
    \ trials, which showed that vaccinated monkeys could still spread the virus to\
    \ one another. Governments around the world kept unvaccinated people in their\
    \ homes for two years, while letting the vaccinated go out and party, because\
    \ they had been told lies.\nResearchers who do not make all of their original\
    \ data open for inspection are not real scientists, but something else. Feynman\
    \ also said essentially that \"public relations cannot be used to make a successful\
    \ technology, because Nature cannot be fooled.\" We see this over and over again\
    \ in recent years. \U0001F921"
