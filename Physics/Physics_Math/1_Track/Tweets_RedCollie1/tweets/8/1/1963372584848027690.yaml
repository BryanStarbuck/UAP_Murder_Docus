note_tweet:
  text: "The Buga orb-sphere: how does it fly? \nThis idea looks right, I will try\
    \ to test soon. \nLook carefully in slide 2 at a long wire (DC electrode) going\
    \ vertically down through its center. \nDC spin will not lift it up, just produce\
    \ a strong gyroscopic motion.\nBut if we add 5-phase AC magnetism from five wire\
    \ coils (\"lunar crescents\") arranged around the outside, as shown in slide 1,\
    \ that rotating magnetic field will interact with an induced DC (gyroscopic) magnetic\
    \ field, created by fast-spinning mercury (or galinstan) inside a \"large red\
    \ ball\" (slide 2). \nAnd THAT might lift it up, like for a \"space propellor\"\
    ? \nThink Indian \"vimana\" or German \"bell\". \nLet's try to re-discover the\
    \ \"wheel\". \U0001F6F8"
