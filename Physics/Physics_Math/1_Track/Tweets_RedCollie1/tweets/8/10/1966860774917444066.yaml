  text: "This was my first alien-research project in 1998.\nA man in Sydney had a\
    \ close encounter with two alien women, who were \"almost human\" but not like\
    \ us in certain ways, and also telepathic.\nThis tall, blond woman (over 6 feet\
    \ tall) took a sperm sample for interbreeding, and somehow (perhaps by intent?)\
    \ left behind one of her long, clear head hairs plus a scalp root, from which\
    \ viable DNA might be obtained. \nI put together a small team of PCR experts in\
    \ a private lab to do the analysis. Near the end of this research, she somehow\
    \ became aware that we were analyzing her hair for its \"genetics\". \nOne night\
    \ just before Christmas of 1998, she arranged for me to get an \"ear implant\"\
    \ as a location tracking device. After that, I received several long \"telepathic\"\
    \ slide shows, just like having a wire attached to your head, except the comms\
    \ were wireless. \nNot being telepathic myself, I tried to concentrate on the\
    \ messages being sent, but could not absorb it all.\nShe did show me a page from\
    \ a \"Celtic illustrated manuscript\" which told how the Tuatha de' Danaan (her\
    \ people) had once come to Ireland (about 1500 BC).\nWe now call those the \"\
    fairie\" or \"magic' people who came from the \"Otherworld\". \nShe also contacted\
    \ me another time by \"psychic Skype\". I could \"see\" her underground somewhere,\
    \ looking into a camera, while seated in a brick courtyard. She is a very tall\
    \ woman, while her eyes are very large and very blue, with no whites.\nHonestly\
    \ I felt very inferior, like an aboriginal being viewed by a princess. \nHer hybrid\
    \ child would now be about 30 years old. Her skin is so white and pale that she\
    \ would get burned by the strong sunlight here on Earth. But her child should\
    \ be more well adapted.\nThe son of that man who would be the father also received\
    \ a hand-implant following the event, so that they could track him many years\
    \ into the future. \nThere is a book about this on Amazon called \"Hair of the\
    \ Alien\" by Bill Chalker. \nThree other strange things happened while I was being\
    \ watched/contacted by those off-world people.\nFirstly, on a flight from LA to\
    \ Atlanta, they \"introduced\" me to Dr. Roger Leir who was (by chance) on the\
    \ same flight. \nSecondly, I became \"temporarily psychic\" with accurate visions\
    \ of the future. That talent later faded. \nThirdly, one of her friends called\
    \ \"Sarana\" healed by father from a stroke, on a night when he was near death.\n\
    \"My name is Sarana, and I have come here to help you.\" It was a medical miracle\
    \ witnessed by many people the next morning. She healed him just as Jesus healed\
    \ people, with life-energy. Her name means \"of the star\".\nNow that others such\
    \ as Avi Loeb are talking about scientific evidence for aliens, I can speak of\
    \ a real alien cross-breeding contact which happened 30 years ago.\nOne can only\
    \ wonder whether they intend to land and live here soon? \"Believe. There is GOOD\
    \ out there.\"\nI trust those people far more than I trust any of our governments.\
    \ You can believe whatever you wish, but I have told you the truth. There are\
    \ other humans, almost like us, out there among the stars."
