  text: "People are asking about Newton's 3rd Law for a rising and spinning \"magnetic\
    \ top\"? I have done MANY experiments which show that a \"spinning magnet\" will\
    \ rise without causing any downward back-reaction by Newton's 3rd Law! \nYet such\
    \ a rise (per se) leads only to a small reduction of gravity weight. When a spinning\
    \ magnet rises, then falls, it loses all of its weight for that half of the time\
    \ while it is falling.\nSo if we have say a spinning magnet of weight 100 grams,\
    \ its TIME-AVERAGED weight will be just 50 grams, if it spends half of its time\
    \ rising, and half of its time falling.\nThis does not explain how UFOs fly, but\
    \ it is a good start! Any 3rd Law back-reaction for a spinning magnet would create\
    \ a force perpendicular to the pole on which it is rising, so we would not expect\
    \ to see a 3rd Law reaction downward against the ground.\nAs for UFOs, they seem\
    \ to fly by \"helical magnetic fields\" like for an astronomical jet. The efficient\
    \ engineering of UFO flight will hopefully be achieved in the near future, if\
    \ we get clues say from the \"Buga orb sphere\", and also get more people working\
    \ on the problem? TO THE STARS \U0001F6F8\U0001F600"
