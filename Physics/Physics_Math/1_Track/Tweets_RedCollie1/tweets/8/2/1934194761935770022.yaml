  text: "This 7-minute video shows my second attempt to reproduce the UFO-like levitation\
    \ of that Buga orb-sphere. \nWe do see small and reproducible anti-gravity effects\
    \ of 30 to 50 grams, yet much of the upward spinning force of 500 grams (for this\
    \ small magnet at 20-30 Hertz) seems to be cancelled by a downward reaction of\
    \ some kind! \nThus we still need one more step to get upward, POWERFUL, UFO-like\
    \ levitation. I show and discuss two possible approaches near the 5-minute time.\
    \ \nIt is hard to say which approach might be best, because NONE of what you can\
    \ see here is in the current physics literature or textbooks. \nWhat do YOU think?\
    \ What should I try next?\U0001F6F8"
