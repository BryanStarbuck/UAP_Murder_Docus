note_tweet:
  text: "Detailed notes on the physics of UFO levitation (for those who can understand)!\
    \ \nWe show in movie 1 the upward force of UFO levitation, namely the upward spin\
    \ of a magnet under applied 3-phase power. Yet it does not reduce weight on a\
    \ scale, due to \"mass recoil\" and \"magnetic recoil\"\nIn movie 2, we show how\
    \ a spinning homopolar motor has no \"mass recoil\"\nIn slide 3, we show how a\
    \ spinning homopolar motor creates a new magnetic field which enhances the applied\
    \ magnetic field as a \"self excited dynamo\" (see Tesla https://t.co/NqJt5w2xS3\
    \ ). This should reduce or cancer \"magnetic recoil\", which creates an opposing\
    \ magnetic field by Lenz's Law.\nIn movie 4, we show the first small-scale tests\
    \ of combining 3-phase and homopolar forces on the same test magnet. \n3-phase\
    \ power comes from three wire coils placed below, while liquid galinstan spins\
    \ with applied DC current from a 12 volt battery, to make a liquid, self-excited\
    \ dynamo.\nIn principle, this should allow for upwards 3-phase force on a central\
    \ test magnet, with reduced (or little) downward \"mass recoil\" or \"magnetic\
    \ recoil\"? \nIn other words, inertia-less UFO flight! I will study these novel\
    \ physics in more detail soon (drawn MANY places in crops by friendly ET's for\
    \ our instruction). Seen by Edwin Fuhr in Canada 1974). It may also be how the\
    \ Buga orb-sphere flies. \nAre you \"blind\", or can you \"see\"? Please let other\
    \ skilled physicists know to help in these efforts, if they wish. It is not \"\
    rocket science\" but \"UFO science\". \U0001F605\U0001F602\U0001F923"
