  text: "I have come \"halfway\" now in reproducing \"UFO levitation\". We know from\
    \ MANY experiments that its upward force derives from the fast spin-rise of a\
    \ magnet in a 3-phase, rotating magnetic field.\nThat effect alone however only\
    \ creates an increase of gravitational potential-energy, rather than UFO-style\
    \ \"anti-gravity\" per se.\nWhat do we have to do to get totally-real \"anti-gravity\"\
    ? I suspect that we have to keep total spin angular momentum \"constant\", as\
    \ that central magnet \"spins up\". To do this, we may need to add an opposite\
    \ and equal counter-spin.\nEdwin Fuhr saw this for a nearly-landed, hovering UFO\
    \ in Canada 1974 (movie 1).\nThe classical physics of spin angular momentum is\
    \ explained in movie 2 (from \"The Action Lab\").\nSlide 3 shows a paired combination\
    \ of 2007 and 2014 crop pictures, which show a rotating magnetic field (red arrows)\
    \ being cancelled by some counter-spin (blue arrows) near its central magnet.\
    \ \nSlide 4 shows a two-phase crop picture from 2011, that again shows central\
    \ spin and outer counter-spin, with a disc magnet inside. \nOne upward spin will\
    \ be due to a 3-phase magnetic field, while the other counter-spin will be due\
    \ to an electromagnetic Lorentz force, like for the \"Corbino disc\". \nIt will\
    \ require some liquid or gaseous \"conductive\" substance plus lots of DC electricity!\n\
    I remain unsure whether we should use liquid galinstan and a DC 12-volt battery?\
    \ Or need to use some ionizable gas such as argon or xenon with high DC 10 kV\
    \ voltage for faster velocities? \nOnce we cancel TOTAL spin angular momentum,\
    \ for 3-phase spin and Lorentz counter-spin combined, then the device should lift\
    \ up by \"anti-gravity\". Newton's 3rd Law should not apply. \nThe theory seems\
    \ clear, but building such a device is hard engineering! I am working on it (one\
    \ of 7 billion on planet Earth). Others welcome to try as well. \U0001F603"
