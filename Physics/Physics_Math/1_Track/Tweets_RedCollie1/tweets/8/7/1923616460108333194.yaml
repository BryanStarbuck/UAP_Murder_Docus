  text: "Almost every aspect of the Buga orb-sphere has a matching \"crop picture\"\
    , to help tell us what it means.\nThe sphere itself may fly due to spinning magnetic\
    \ levitation (as shown in other videos on this page).\nSlide 1: At its very top,\
    \ we can see a \"chip\" or \"charging location\" around which many small \"currents\"\
    \ can be seen to flow outward. \nSlide 2: Those features match a well-known crop\
    \ picture from 1999, one of a UFO-type series meant to explain how they fly. The\
    \ outer perimeter of that 1999 crop picture shows 2 small dots, which are probably\
    \ just \"outer electrodes\" to collect DC current from whatever conductive substance\
    \ spins rapidly inside.\nSlide 3: We can see the same \"small outer electrodes\"\
    \ on the Buga sphere, 32 rather than 20 as were drawn in crops, but otherwise\
    \ with the same function.\nSlide 4: Inside at the center of the Buga sphere, we\
    \ can see 16 \"inner electrodes\". When some kind of conductive liquid or gas\
    \ spins rapidly, it will behave as a \"homopolar generator\" to make lots of DC\
    \ current at low voltage! \nI do not know what kind of conductive (magnetic) fluid\
    \ or gas is inside the Buga sphere, but I have ordered lots of galinstan and will\
    \ try that first!\nALL CLEAR? We are talking here about a kind of \"energy recovery\
    \ system\" like the \"alternator\" in your car.\nIn the first comment below, I\
    \ show the physics of a homopolar generator, and a movie which shows how mercury\
    \ spins rapidly as DC current passes from outer to inner electrodes."
