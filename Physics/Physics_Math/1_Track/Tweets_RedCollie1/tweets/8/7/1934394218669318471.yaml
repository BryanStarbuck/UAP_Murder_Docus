  text: "I will build this crop-circle design next (photo 1), to try and understand\
    \ \"UFO physics\". Three wire coils (with a clockwise spin of the 3-phase magnetic\
    \ field) are placed just over three other wire coils (with an anti-clockwise spin\
    \ of the magnetic field).\nIf we place a ring-magnet between those two sets of\
    \ wire coils, the two opposing directions of motion CANCEL, and it won't spin\
    \ at all!\nYet what if we place a ring magnet just above the upper clockwise set\
    \ of wire coils? It should still spin and rise \"clockwise\", but half of the\
    \ extended up-down, clockwise magnetic field will be cancelled, by another set\
    \ of anti-clockwise wire coils just below.\nWill that have any effect on the magnet's\
    \ spinning motion, or gravity-weight as measured on a scale? Now it can only \"\
    spin upward\", while any \"spin-downward\" force may be cancelled. \nWhat are\
    \ the E.T. crop artists trying to tell us? \U0001F6F8\nBoth spin and counter-spin\
    \ may be needed for POWERFUL upward levitation. This kind of physics has NEVER\
    \ been studied before, so we may find it hard to get an answer! \nThe world of\
    \ mainstream science \"sleeps\". We are working 20 to 30 years ahead of anything\
    \ they are currently doing or thinking. \U0001F921"
