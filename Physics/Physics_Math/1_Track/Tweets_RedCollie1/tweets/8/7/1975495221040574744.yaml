  text: "I am still doing some interesting physics experiments, while waiting for\
    \ parts to arrive from overseas.\nPart 1 of this movie shows a \"homopolar generator\"\
    \ made of a permanent disc magnet and liquid-metal galinstan. When we spin that\
    \ magnet with 3-phase power, it makes a slight DC current of 0.15 milliamps. That\
    \ is because the rotary motion of gallium in a N/S magnetic field causes some\
    \ of the electrons and gallium ions to move in-or-out by a Lorentz force.\nPart\
    \ 2 shows a famous crop picture from 2011 which I am trying to reproduce, to achieve\
    \ UFO physics. I was there on the morning when it came down with laser-sharp edges\
    \ in the green wheat! \nTwo days later, its center changed in a driving wind/rainstorm,\
    \ so I had to drive up the side of Milk Hill to get the first overhead photos.\
    \ On the next day, hundreds of French tourists arrived to see it!\nPart 3 shows\
    \ a simple device which I made, to try and reproduce the \"UFO physics\" drawn\
    \ in that 2011 crop picture. We will take it to much higher powers soon.\nPart\
    \ 4 shows another 1999 crop picture which shows the SAME instruction for \"UFO\
    \ physics\". \nSpin by 3-phase power, with counter-spin by a Lorentz force. \n\
    The light shines, but most people fail to see it. \U0001F6F8"
