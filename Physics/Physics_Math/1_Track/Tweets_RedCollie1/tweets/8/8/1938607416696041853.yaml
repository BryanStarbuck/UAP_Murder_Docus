  text: "I will tell a brief and interesting, true account, concerning the INTERNATIONAL\
    \ nature of UFO and crop-circle cover-ups by our governments.\nIn 2017, I gave\
    \ a seminar in Australia at a local UFO meeting, which was later written up in\
    \ a balanced fashion by a local reporter. She received 1000's of favorable comments\
    \ by email or text on the next day.\nMeanwhile an INTERNATIONAL cover-up was underway!\
    \ Early on the next morning, about 5 AM in Sydney, I received a phone call from\
    \ someone in Texas who had read that local news story. \nThe caller, under a fake\
    \ name, tried to get me to say something embarrassing, which he could record on\
    \ tape to discredit me.\nThen on the following morning, I learned that the same\
    \ reporter (a nice woman) had been forced to write up an interview with a retired\
    \ astronaut in Texas (again), who told everyone that \"aliens could not possibly\
    \ have visited Earth, because they had not given us a cure for cancer\".\nNext\
    \ came a third story from the same reporter, interviewing a woman who said that\
    \ we could learn about aliens by \"talking to goldfish\".\nOne year later, some\
    \ students in a film class at a nearby university decided to do a documentary\
    \ on our small UFO group. They took lots of footage and wanted to post it on YouTube,\
    \ but the film was apparently confiscated.\nAnother fellow I know claims to have\
    \ walked around a landed UFO with three others. When he agreed to make the story\
    \ public in the news, someone threatened to kill the reporter.\nFinally, when\
    \ Dr. Roger Leir visited Australia and did lots of videos for the ABC, their film\
    \ crew were very excited to show it on TV, but their lawyers said that it could\
    \ not be shown at all.\nAs John Lennon said, \"A conspiracy of silence speaks\
    \ louder than one of words.\"\nThe crop-circle cover-up typically involves fake\
    \ videos, posted 1-2 weeks AFTER a new crop picture of impressive character appears.\
    \ \nWhy some people would believe that obvious malarkey, I do not know? \nIt works\
    \ by the psychology of a \"con man\". You have \"confidence\" to begin with, that\
    \ aliens do not exist, and could not possibly be visiting Earth. \nThen even the\
    \ flimsiest arguments (or fake A.I. videos) can confirm your pre-existing beliefs.\
    \ Similar to \"cats and dogs in Olympic diving competitions\". Sure, we believe\
    \ you!\U0001F921\U0001F921\U0001F921"
