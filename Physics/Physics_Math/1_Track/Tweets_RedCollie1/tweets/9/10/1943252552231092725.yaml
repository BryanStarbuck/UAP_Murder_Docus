  text: "People ask \"why are there no crop circles in the USA?\"\nThat question is\
    \ easy enough to answer, by describing what happened when a real, ET-made crop\
    \ picture DID appear in the USA.\nNear Chualar, California in December of 2013,\
    \ the hired hand of a local farmer found a large and complex crop picture in his\
    \ fields, early in the morning.\nNeither the farmer, nor the hired hand, had any\
    \ idea of how it got there (they told a reporter later, in a story which quickly\
    \ became \"404 error\").\nBy noon on the same day, high-priced security guards\
    \ from San Francisco came in to keep the public out. \nNo one knew about that\
    \ amazing crop picture for several days, until a local real estate agent flew\
    \ in a helicopter to check on her sales properties. She saw it by chance and took\
    \ some aerial photos. \nWhen her photos appeared on the evening news in San Francisco,\
    \ everyone became very excited, and wanted to see the new crop picture in person!\
    \ But those security guards would not let anyone close.\nAfter another day or\
    \ so, they asked the farmer to cut it out. \nMeanwhile experienced debunking intel\
    \ agents were flown in from the UK to help establish a \"cover story\" (of course\
    \ I know who they were, but we cannot mention names on Twitter-X).\nOne week later,\
    \ the (Chinese) CEO of Nvidia (a computer-games company) was asked to say at a\
    \ meeting, that his company had planned and made the Chualar crop picture in secret.\
    \ He also said that he had no hint of this expensive ad campaign, until he saw\
    \ those photos on TV.\nThey even hired a team of movie people to make a \"documentary\"\
    , showing how people had \"made it\" using rope and boards. But they just showed\
    \ some guys walking around in the completed crop picture, and did not show any\
    \ actual planking, or stages of construction. \nNo one saw or heard anyone there,\
    \ on the morning before the farmer's hired hand found it.\nThe crop picture itself\
    \ showed a \"chip\" for a \"digital camera\", which was coded in Braille (for\
    \ blind people) as 1-9-2 (referring to 192 nations on Earth).\nIt also showed\
    \ a long , extended image of a \"flying serpent\", who was \"looking into the\
    \ lens of a digital camera\" (that makes you want to laugh).\nNvidia do not make\
    \ or sell digital cameras. They just provided a \"cover story\" to deceive the\
    \ American people.\nDozens of \"news articles\" soon came out in support of that\
    \ cover story (like for Russia collusion, weapons of mass destruction, etc.).\
    \ \nSo what was the real ET crop artist trying to tell us? Simply that all 192\
    \ nations on Earth would remain \"blind\", and could only read \"Braille\", until\
    \ he flew his \"flying serpent\" in front of digital cameras worldwide. Then the\
    \ \"blind\" would \"see\". When this will be, I am not certain.\nAs to the Nvidia\
    \ cover story, would any company insult their customers in such a gross way, by\
    \ saying that they were \"blind\"? What a clever way to lose sales! \U0001F921\
    \nMost American people have been so dumbed-down by TV-watching, drugs, sex and\
    \ alcohol that they will believe ANYTHING the government tells them.\nWe learned\
    \ for example this week, that Epstein never did any sex trafficking, and that\
    \ the Chinese (or Lockheed-Martin) made ALL of the strange drones or UFOs seen\
    \ in our skies. Even when they stalk our military bases, or ships at sea. Technology\
    \ which seems thousands of years ahead of our own. \nDo you believe that? \U0001F605\
    \U0001F602\U0001F923Now you know what happened when a real crop circle appeared\
    \ in the USA."
