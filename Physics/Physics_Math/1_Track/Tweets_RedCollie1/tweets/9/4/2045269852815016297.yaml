  text: "Our new, small-scale model for \"UFO physics\" shows a near-perfect match\
    \ to the most-detailed \"UFO\" crop pictures (from July 2012).  \nThere are two\
    \ possible forces which might lead to novel space propulsion. Both will shown\
    \ in this new video. \nFirstly, the rise of a spinning magnet up a pole, which\
    \ then applies its upward force to the center of a counter-spinning, magnetic\
    \ flywheel (rather than say to a stationary \"bead\"). \nCould this bypass Newton's\
    \ 3rd Law?\nSecondly, the preliminary motion of a spinning magnet downward, away\
    \ from the center of an attractive magnetic flywheel, followed by its upward force\
    \ or pulsed motion as a second step, when the flywheel spins rapidly in an opposite\
    \ direction. \nThis second mechanism seems novel, and has never been studied before\
    \ (on Earth). Further experiments should reveal more. \nTO THE STARS. \U0001F6F8"
