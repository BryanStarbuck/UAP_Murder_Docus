  text: "In 2015, a spectacular crop picture appeared mysteriously in Italy near Torino\
    \ Airport and said:\n\"timeo ET ferentes!\"\n\"I fear E.T. bearing (gifts)!\"\n\
    Think \"Trojan horse\". \nA few days later, a US military man in the USA received\
    \ a long message from friendly aliens called the \"Emerthers\", who claim to have\
    \ met Eisenhower and Majestic 12 in the past.\nNobody could translate that novel,\
    \ 4-symbol message.\nLinda Howe sent it to computer experts and DOD people ,who\
    \ seem not to have had a clue. \nThen she sent it to me, because I had translated\
    \ the Rendlesham Forest code previously.\nAfter a month, I learned how to read\
    \ the message. Two slightly-different versions are called \"Triple binary\" or\
    \ \"Textpic\" (see below, thanks to R.G.).\nThis new message read in part:\n\"\
    Royal Emerther warning\"\n\"Evolutionary advancement imperative for planetary\
    \ survival\"\n\"Imminent threat to Earth's leaders and civilizations\"\n\"Beware\
    \ of Orion 1350.3 and Z Reticuli 39.170\" \n\"EBEN(s) have SENT THREAT\"\n\"Embrace\
    \ this space-vessel threat\"\n\"Expose hidden knowledge to all citizens\"\n\"\
    Expose foreign (alien) technology to all citizens\"\n\"Now you must learn to defend\
    \ yourselves\" \n\"Disclose---Evolve\"\nThat was 10 years ago. I do not know whether\
    \ 3I/2025 is the \"space vessel threat\" to which they were referring, but it\
    \ seems to be a good candidate, not to be dismissed or ignored! \nYou can read\
    \ my 2015 article here, in case you think I am making this up? There are another\
    \ 20 pages of code not shown there: \nhttps://t.co/h8iIwCKXWo \nThe military contactee\
    \ \"CJ\" was visited twice by officials from the US DOD, and also asked to divulge\
    \ more information in a SCIF. \nWhy is it that he has not yet been asked to address/inform\
    \ Congress? \nWhy is Luis Elizondo building a survival bunker out west? \nHow\
    \ did Jeremy Corbell know about 3I/2025 back in January, if our leaders and astronomers\
    \ did not know? \nFrom whom did he hear the information?\nWhy did they ask Jeremy\
    \ to tell everyone that it would be a \"lie\"? Do you believe him? \nExpand your\
    \ thinking. \U0001F47D\U0001F6F8"
