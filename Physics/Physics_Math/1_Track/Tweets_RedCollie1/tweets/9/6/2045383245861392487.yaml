  text: "Here in a new video 1, I will show an almost-perfect match of my recent lab\
    \ work, to detailed \"crop picture instructions\" from July 2012, which seemingly\
    \ show us how to build a small device capable of UFO levitation. \nThose two crop\
    \ pictures are shown schematically in slide 2, or in full original form in slides\
    \ 3 and 4. \nIf you take the time to study ALL items of this post carefully, both\
    \ video 1 and slides 2, 3, 4, you will be well rewarded! \nLooking first at slide\
    \ 2, we can see (on the left) how a fast-spinning magnet (blue) rises up by 3-phase\
    \ power, to the central (empty) \"ring\" of a magnetic flywheel. \nThere it is\
    \ held in place by planar attraction between the central \"South\" magnet S (blue),\
    \ and four outer \"North\" flywheel magnets N-N-N-N (red). \nIf that (blue) magnet\
    \ happens to rise above the flat plane of that (red) magnetic flywheel, simple\
    \ attraction (between red and blue) will pull it back down again. \nMany large\
    \ and overlapping circles, drawn above that \"ring\" in crops (see slide 3), suggest\
    \ that there is strong potential for that central magnet (blue) to \"rise up\"\
    \ in successive steps, like for a UFO.\nNext if we examine slide 2 on its right-hand\
    \ side, we can see that both the central magnet (blue) and outer magnetic flywheel\
    \ (red) have begun to spin rapidly in opposite directions! \nThe (blue) magnet\
    \ and (red) flywheel still attract one another magnetically, as confirmed by two\
    \ up-and-down series of small circles (just like those drawn on the left). \n\
    Yet now the (blue) magnet has moved slightly BELOW the (red) flywheel, due to\
    \ its rapid spin! If you watch lab video 1 carefully, you will see that we have\
    \ reproduced that important, spin-dependent feature of novel magnetism in our\
    \ physical model. \nIt is perfectly understandable, if we study details of the\
    \  complex, magnetic interactions involved. \nNow as a consequence of that slight\
    \ downward motion, the fast-spinning (blue) magnet will always be PUSHING UP on\
    \ the counter-spinning (red) flywheel, from a short distance below. Could this\
    \ be related to UFO levitation?\nSo far, so good. We have produced a near-perfect\
    \ match, between those two spectacular crop pictures from July 2012, and our laboratory\
    \ experiment.\nThe final, important detail to examine in slide 2 (on its right-hand\
    \ side) is that BOTH the central (blue) circle AND upper (red) circle GO UP TOGETHER,\
    \ as noted using two green arrows, compared to where they were located on the\
    \ non-spinning, left-hand side of slide 2.\nThis is what we would expect for the\
    \ RISE OF A UFO. \U0001F6F8 It is NOT what we would expect from Newton's Third\
    \ Law of action-reaction. \nI have not yet tested whether our new model produces\
    \ this final prediction, made by those two highly-detailed crop pictures, but\
    \ will try to do so soon.\nNext week I have a minor medical procedure, then will\
    \ get back onto real lab work as soon as possible. \nTO THE STARS. \U0001F31F\U0001F31F\
    \U0001F31F\nFRIENDLY ALIENS WANT TO HELP US. \U0001F47D\U0001F47D\U0001F47D\n\"\
    Believe. There is good out there.\" (2002)"
