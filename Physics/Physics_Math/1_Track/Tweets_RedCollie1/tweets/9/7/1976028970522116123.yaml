    \ Trojan Horse: \"timeo ET ferentes!\" \nUnderground and/or undersea alien bases?\
    \ \nMystery drones flying over New Jersey then Europe? \nAvi Loeb calls 3I/ATLAS\
    \ a \"Trojan Horse\".\nWHEN will this possible attack by enemy aliens on humanity\
    \ take place? \nTo address that question, how many small triangles can you COUNT\
    \ (slide 3) within each of its two inner rings? 26 then 27. \nThis is the year\
    \ 20-25. Perhaps 20-26 or 20-27? \nThe EBEN grey aliens from Orion and Zeta Reticuli\
    \ 2 are our ENEMIES. They offered the US military \"gifts\" to \"enter our city\
    \ gates\" in the 1950's. It was all a \"deception\". \nI do not know yet about\
    \ 3I/ATLAS, but it seems very suspicious, so I am watching it closely. \nBy analogy,\
    \ when a radar operator sees a whole fleet of unknown airplanes approaching Pearl\
    \ Harbor, he should not dismiss it as a \"big flock or birds\"."
