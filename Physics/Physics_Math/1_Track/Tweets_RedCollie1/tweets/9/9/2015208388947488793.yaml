  text: "Teaching lesson: UFO physics 201. Let's move onto something a bit more difficult!\n\
    First, as shown in movie 1, how can we explain changes in the 3-phase, rotating\
    \ magnetic fields made by six wire coils arranged in series as U-V-W-U-V-W?\n\
    Why does a test magnet counter-spin at six locations just outside, while it does\
    \ not spin at all in the very center?\nNext consider slide 2, which shows the\
    \ first detailed blueprint for UFO physics drawn in crops, August 1998.\nThere\
    \ are 6 + 3 = 9 wire coils in total.\nThe upper 6 are just as shown in movie 1,\
    \ U-V-W-U-V-W. The lower 3 are an independent set of 3 wire coils arranged simply\
    \ as U-V-W.\nWhat will happen, if we place these upper 6 over those lower 3, and\
    \ spin the 3-phase magnetic field in opposite directions, anti-clockwise versus\
    \ clockwise? \nStudy movie 1, then think carefully!\nMovie 3 shows a schematic\
    \ of UFO counter-rotating magnetic fields, as seen by contactees Edwin Fuhr and\
    \ Normal Paulsen. \U0001F6F8"
