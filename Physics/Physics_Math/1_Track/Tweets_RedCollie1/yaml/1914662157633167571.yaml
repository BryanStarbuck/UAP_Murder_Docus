  text: "Someone asked me about Indian \"vimana\" flying machines that supposedly\
    \ used liquid mercury?\nI do not have any mercury (it is not legal in Australia).\
    \ Yet if we were to use liquid mercury (with low-voltage DC power) as the source\
    \ of \"spin\" (rather than 3-phase wire coils), and put a permanent magnet (or\
    \ magnetic flywheel) inside with the mercury, so that it would also spin, would\
    \ we see the ENTIRE DEVICE rise up a pole as an anti-gravity effect, needing only\
    \ two DC wire connections? \nYou can see in the second video how a spinning magnet\
    \ rises up into the air along a pole, when given 3-phase power. However I can't\
    \ seem to make those 3 wire coils rise up with the magnet! \nAre there any inventors\
    \ out there, who have 1000 grams of liquid mercury in a country where it is legal?\
    \ I can't do ALL of these anti-gravity experiments by myself! Seven billion people\
    \ watching TV, one doing experiments.\n\U0001F921\U0001F921\U0001F921"
