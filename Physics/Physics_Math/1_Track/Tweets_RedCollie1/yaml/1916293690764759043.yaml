  text: 'IMPORTANT! PLEASE READ AND SHARE. 🛸

    There seem to be two kinds of 3-phase, magnetic spin-force (in general). Something
    like for “chaotic” versus “laminar” flow. Might these be of interest to engineers,
    or even astronomers?

    At low rpm, say less than 20 Hertz, a disc magnet will try to move strongly downward
    (on a bare aluminum or stainless steel rod) in one orientation, but upward in
    the other orientation. I have not found any characteristic of the magnet (or magnetic
    flywheel) which might predict which way it goes, over a dozen different examples.

    Then at high rpm, say 25-30 Hertz, all of those various magnets (or magnetic flywheels)
    will go upward in a top-like fashion. Thus as frequency increases, this second
    force become stronger than the first.

    As shown in the first video attached, a low-frequency 3-phase force may cause
    strong upward forces on a pole, around which that 70 mm magnet spins (14 mm hole,
    6 to 10 mm pole). Then a second kind of force becomes even stronger at high frequency.
    It “decouples” the spinning magnet from a central pole, and a previously-large
    upward (or downward) force on the pole goes to ZERO, as that spinning magnet hovers
    in the air like GYROSCOPE.

    Such a “gyroscopic” motion has never been seen before using iron-free, 3-phase,
    copper electromagnets to create spin. We need a “pole” for stability. If we use
    small permanent magnets to create spin (as I and others have done), then para-magnetism
    confuses the issues. This may be “related” to what Eric Laithwaite saw in the
    1970s, when he made a big mechanical spinning gyroscope, but his conclusions likewise
    seem vague, and not easily amenable to further direct, small-scale experimentation.

    Now it would be of great interest if we could “harness” that high-frequency, upward
    spinning force, which does NOT cause a central pole to move upward or downward
    (because mechanical contacts seem to become very loose at high frequency). For
    example, if a low-frequency force on that pole at 20 Hertz is 300 grams, then
    an upward force at high frequency might be 500 or 1000 grams!

    As shown in a second video, I can “feel” with my hand that the spinning magnet
    at high-frequency is being pushed strongly upward, by a top-like gyroscopic force.
    In this second video, the magnet spins lower than in the first, because it is
    thicker and heavier. Yet we can’t push it down into the 3-phase field which is
    making it spin!

    There seem to be “helical” magnetic fields (as they are called in astronomy) which
    make a spinning magnet move strongly upward, like we can see in a telescope for
    a proto-stellar or galactic “jet”. This is a big field of study in astronomy!
    Yet they have never made a small-scale lab model, to try and explain their observations.
    Such “helical” fields also act on ionized air (not just magnets), although more
    weakly (videos on request).

    In summary, I can’t find any practical way to harness these strong, upward, top-like
    spinning forces for useful purposes, say “levitation” or “propulsion”. As James
    Watt did for the steam engine. Any good ideas?'
