  text: 'When a charged electron moves through a wire coil, relative to stationary
    protons and neutrons, it generates a right-handed magnetic field which wraps around
    the long axis of that wire, parallel to the direction of electron motion.

    Certain right-handed features of the electron, not seen for v = 0, rotate from
    time 4-D into space 3-D to create right-handed magnetism. It all depends on our
    point of view!

    So what about gravity for two objects in fast relative motion? We know that Mercury
    precesses forward, and that light bends around the Sun.

    But what is this extra feature of gravity exactly, for two masses in fast relative
    motion? Could it be right-handed like for magnetism? If not, what is it? Any answer
    we get would clarify the nature of gravity on a quantum level.

    I can''t seem to find any reliable data on the subject  Does anyone know? 👁️'
