    Me: "It hovered silently, then flew off instantly at 2000 mph."

    Them: "How would you possibly know how to make such a thing?"

    Me: "The aliens who fly in those UFOs have drawn many schematic plans in the fields."

    Them: "What are you talking about?"

    Me: "Thousands of crop circles have been appearing worldwide since 1990."

    Them: "I thought those had all been explained by two old men with rope and boards?"

    Me: "Not quite. The majority were made by space-travelling aliens."

    Them: "If what you are saying is true, why isn''t it on TV?"

    Me: "All of the real news about UFOs, aliens or crop pictures is strictly censored
    worldwide."

    Them: "I don''t believe you! Is that because of Donald Trump?"

    Me: "No, it has been going on since 1950."

    Them: "So how then do UFOs fly?"

    Me: "By some kind of spinning magnetic levitation. Plans have been drawn many
    places in crops. Some people have also been taken aboard UFOs, and have described
    what they saw."

    Them: "It all sounds CRAZY to me! Something like that crazy idiot Donald Trump
    would say. How are we going to get rid of him?"

    🤡🤡🤡🛸🛸🛸'
