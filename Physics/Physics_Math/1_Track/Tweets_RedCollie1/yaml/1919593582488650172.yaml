  text: "I just did a control experiment related to \"spinning magnetic levitation\"\
    \ as found by Hamdi Ucar in 2021.\nWe really HAVE to use 3-phase, copper-wire-coil\
    \ electromagnets to study this new physics, rather than permanent magnets, because\
    \ of tight (unwanted) paramagnetic attraction between the spinning Dremel magnet\
    \ and a small \"floater\" magnet (over short distances). \nAlso we definitely\
    \ have to include a \"pole\" for spin stability. I seem to be the ONLY scientist\
    \ on Earth doing it in the correct way now, so let's continue!\n\"Follow where\
    \ Nature leads, or else you will learn nothing\" ---Thomas Huxley"
