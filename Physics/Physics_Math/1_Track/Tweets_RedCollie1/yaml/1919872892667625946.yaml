  text: "Here is an important \"thought experiment\" which everyone should be able\
    \ to understand.\nConsider the rising of a spinning top from a tabletop due to\
    \ SPIN.\nSuch rising depends both on a downward force of gravity towards the Earth,\
    \ and also enough friction to hold the bottom of that top in place. \nLike for\
    \ a wife who holds the bottom of a tall ladder, when her husband climbs up, to\
    \ fix something on the roof!\nNOW HERE IS THE \"THOUGHT EXPERIMENT\": \nWHAT HAPPENS\
    \ OUT IN SPACE, WHERE THERE IS NO GRAVITY?\nYou can watch videos of a \"top spinning\"\
    \ on the Space Shuttle to compare.\nOkay, it won't rise out in space. So what\
    \ could we do there to MAKE it rise, in the absence of downward gravity? \n\U0001F601\
    \U0001F6F8\U0001F47D"
