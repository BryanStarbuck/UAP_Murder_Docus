  text: "I have long been puzzled why friendly aliens drew this particular crop picture\
    \ in the Czech Republic 2018, to tell us how UFOs fly?\nWe can see a disc magnet\
    \ which is spinning rapidly inside of three, 3-phase wire coils. But why did they\
    \ draw another large wire coil, some distance below? \nToday I learned (this may\
    \ not have been known before) that a large ring magnet (or wire coil) creates\
    \ a \"focal point\", somewhat above (or below) its central hole, where outward\
    \ repulsions and inward attractions balance out.\nLike for a \"Lagrange point\"\
    \ in astronomy.\nThe spinning magnet sits stably in that focal point, maybe 100\
    \ mm above the large wire coil, while 3-phase coils are added to make it \"spin\
    \ like a top\".\nWhen that magnetic top rises, it will create a new focal point,\
    \ somewhat further from the lower wire coil, and thus we may have a theoretical\
    \ basis for forward space travel (thrust) where there is no gravity. \nThose friendly\
    \ aliens may not have expected any humans on the ground below to figure it out!\
    \ \nSee slide 3.\U0001F605\U0001F602\U0001F923\nAlmost all of the other \"scientists\"\
    \ here seem to be narrow-minded, uncurious idiots. \n\"What is your IQ?\" asked\
    \ the friendly alien. \nI will investigate this promising lead further. New lab\
    \ videos in the next few days to show details. Others may wish to join in, please\
    \ free free. \nwoof \U0001F436"
