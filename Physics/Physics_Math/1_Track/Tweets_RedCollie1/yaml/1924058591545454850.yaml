  text: "Let me summarize the current anti-gravity science, briefly for any interested\
    \ (and/or crazy) people here?\nI saw a silver saucer close in daylight 1965, after\
    \ a dog began barking at it. It hovered silently maybe 50 meters in the air, while\
    \ I watched for maybe 10 seconds, then it flew off incredibly fast toward the\
    \ south, at an instant 1000-2000 mph, with no noise or exhaust.\nThus I know that\
    \ anti-gravity tech is real, and I also regard most mainstream scientists who\
    \ do not believe, as unintelligent book-learners.\nNext we have schematic diagrams\
    \ from 2-3 dozen crop pictures over the years, trying to tell us how they fly.\
    \ It works by spinning magnetic levitation, something like for the anti-gravity\
    \ rise of a spinning top. Helical magnetic fields like in an astronomical jet.\n\
    Recently we have good videos of at least three mystery \"UFO drones\" which seem\
    \ to also show spinning magnetic levitation, apparently using 3-phase power.\n\
    So I have been working on this in the lab for many months, and have taken 500\
    \ good lab videos so far. We have to use 3-phase electromagnets to apply the spin\
    \ force, not permanent magnets.\nIncidentally I have been given five lucid \"\
    physics dreams\" from unknown sources, encouraging me to develop this new technology,\
    \ and offering hints as to how it works. They call it \"transitional magnetism\"\
    , and it requires a high angular velocity for whatever is spinning. They also\
    \ confirm that personal antigrav devices are possible, as described in the CARET\
    \ studies.\nNow we have yet another small UFO drone which fell in Columbia, and\
    \ I would of course like to study it firsthand, and have made some private enquires\
    \ to do so. None of those other researchers would have a clue. The goal here is\
    \ to discover \"anti-gravity physics\" in such a way that many other researchers\
    \ will be able to reproduce it right away, and also understand how it works in\
    \ terms of textbook science (so far as possible). \nEven if Jamie does not send\
    \ me any info, I still have a very good clue from what he has already shown publicly,\
    \ and will try some experiments along those lines soon.\nFinally, let me remind\
    \ everyone please that small UFO orbs of the kind that crashed in Columbia (I\
    \ tend to describe them as \"metallic cricket balls\") have been seen or photographed\
    \ many, many times over new crop pictures since 1990. British military helicopters\
    \ have chased them. \nThey also make many crop pictures in South America, as well\
    \ as England or Europe. Thus if we had to guess who made and flew the new \"Buga\
    \ sphere\", one likely possibility would be the mystery E.T. crop artists! \n\
    Just to conclude, if you still think in 2025 that all crop pictures have been\
    \ made by \"unseen men with rope and boards\", then you are really a \"dumb bunny\"\
    . John Locke noted way back in 1690 that some animals are smarter than some humans.\
    \ My patience for super-dumb people has worn out. \nThe E.T. crop artists will\
    \ come, whether you choose to be an ignorant skeptic or not. It is just a matter\
    \ of time. Think \"Q-17\". Best wishes to all. \U0001F436\U0001F436\U0001F436"
