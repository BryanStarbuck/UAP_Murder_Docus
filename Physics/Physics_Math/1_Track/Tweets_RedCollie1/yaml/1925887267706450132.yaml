  text: "TEACHING EXERCISE: consider the electron moving vertically forward through\
    \ time in movie 1, then moving horizontally forward through space (along x, y,\
    \ or z) in movie 2. \nIf the electron has a right-handed spin motion through time\
    \ (movie 1), then when it moves relative to any observer through space (movie\
    \ 2), we will see a \"right-hand rule\" (for magnetism). \nThe rotary motion of\
    \ an electron is actually more complicated than shown in movie 1 (more like a\
    \ Mobius strip). Yet this simple and clear derivation of right-handed \"magnetism\"\
    \ holds true regardless.\nNow you know where \"magnetism\" comes from. Your Professors\
    \ do not have a clue. They just do \"chicken scratching\" (as Einstein said).\U0001F604\
    \U0001F436"
