  text: "A UFO contactee from the 1970's (Norman Paulsen) said that their propulsion\
    \ drive worked by two magnetic flywheels, which spin in opposite directions.\n\
    And that they could harvest electricity from each of those two spinning magnetic\
    \ flywheels, using wire contacts on each end, with the central hub or axle on\
    \ which the discs spin.\nThis sounds like Tesla's \"two-spinning-disc\" homopolar\
    \ generator! \nI have made a lot of progress at making magnetic flywheels spin\
    \ rapidly using 3-phase AC power. But I have not yet collected electricity from\
    \ each spinning magnetic flywheel, as Norman Paulsen saw while a passenger on\
    \ a real UFO. \nTo do that, we would have to make \"brush\" connections between\
    \ two spinning discs on their outer edges, or between the hub and outer edge of\
    \ a single spinning disc (with magnets mounted on conductive aluminum). \nThe\
    \ Buga orb-sphere also shows a symbol for \"homopolar generator\", as pictured\
    \ in the first slide below, and it is matched by two other crop pictures of similar\
    \ appearance. \nI suspect that passing electric current through the spinning magnetic\
    \ flywheel may allow us to harvest DC electricity from a \"self-excited dynamo\"\
    , and may also be needed to produce \"anti-gravity lift\"? \nBut it is a technically\
    \ difficult problem to solve without further clues. I will keep trying, and hope\
    \ that Jaime in Mexico finds out more concerning the Buga orb-sphere? One good\
    \ clue will give it to us. The most important physics problem in human history.\
    \ \U0001F6F8\U0001F6F8\U0001F6F8"
