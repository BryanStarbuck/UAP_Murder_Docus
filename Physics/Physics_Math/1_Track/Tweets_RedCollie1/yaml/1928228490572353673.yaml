  text: "Someone asked whether any OTHER plans have been drawn in crops by friendly\
    \ aliens, which might help us to advance here on Earth? \nYes, plans have also\
    \ been drawn for \"compact\" nuclear fusion to make energy. Not \"cold\" fusion,\
    \ but \"hot\" fusion on a very small scale (50 mm).\nI have already tested their\
    \ \"plans\" using argon gas to see \"ion paths\", but have not had time yet to\
    \ test properly using deuterium gas!\nIt works somewhat like a \"Farnsworth fusor\"\
    , but with an AC magnetic field surrounding the cylindrical gas chamber (given\
    \ 40 kV DC power), to create \"two-way head-on collisions\" of deuterium nuclei.\n\
    You can see my preliminary results with argon gas below, for DC power (40 kV)\
    \ and a surrounding DC versus AC electromagnet. Also a video using 40 kV DC power\
    \ inward, and a surrounding AC electromagnet. \nSuch head-on collisions take place\
    \ \"off-electrode\", and create a lot of heat due to argon-argon collisions, but\
    \ do not involve unproductive collisions with the inner electrode itself. Mainly\
    \ gas-gas collisions at an effective 40 + 40 = 80 kV. \nLook at the big \"white\"\
    \ area to see where argon nuclei are colliding with AC magnetism! Deuterium nuclei\
    \ should do exactly the same. \nSome of the \"plans\" which were drawn in crops\
    \ to facilitate this discovery are shown in the first comment below. How to misinterpret\
    \ \"E = MC^2\"?\nOf course they mean \"nuclear fusion\"! \U0001F605\U0001F602\U0001F923\
    \nIn 2013, they also drew \"plans\" for a more complex kind of fusion S-32 + 3\
    \ x (H-1 +D-2) > K-41 which they use on their spacecraft. If anyone wants to make\
    \ lots of free energy for the world, please feel free.\U0001F436"
