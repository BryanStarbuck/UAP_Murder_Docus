  text: "It certainly seems as if I MIGHT have solved the physics of UFO levitation?\
    \ The E.T. crop artists fly through space using a \"magnetic spinning propellor\"\
    . \nEasy to get 1 kg (1000 grams) of upward spinning force, with no apparent downward\
    \ force due to a possible 3rd Law reaction.\nThree-phase AC power, six wire coils\
    \ (0.5 mm copper wire), a central 70 mm magnet with a 14 mm hole, 3 mm thick,\
    \ placed on a 6.3 mm aluminum rod, with a 20 mm silicone-bead transmitting the\
    \ upward spin-force of that magnet to the aluminum pole, which does NOT spin after\
    \ it rises. \nWe can see only an upward force, in both N or S orientations of\
    \ the central spinning magnet, and do not see any Newtonian downward force.\n\
    Two long videos will be posted soon to show technical details. \nPlease note:\
    \ the central aluminum rod has to be narrow enough (6.3 mm diameter for a 14 mm\
    \ magnetic hole) to avoid unwanted mechanical effects. \nThose can be easily assessed\
    \ by flipping the central magnet about its N-S poles, and making sure that it\
    \ behaves the same in both orientations.\nAlso a \"elastic silicone bead\" is\
    \ needed to capture the upward force from that spinning magnet, without causing\
    \ the aluminum rod to counter-rotate by unwanted mechanical friction. \nFinally,\
    \ I learned everything you see here (and in other related videos) by studying\
    \ many \"technical diagrams\" drawn in crops, by friendly extra-terrestrials,\
    \ which are meant to teach us a more advanced kind of physics than what our top\
    \ scientists know today on Earth. \nThink \"Jodie Foster, Contact\". \nI would\
    \ encourage other skilled inventors to reproduce the lab results shown in this\
    \ and subsequent videos, and likewise share them freely with the world. \nTO THE\
    \ STARS. \U0001F6F8\U0001F31F"
