    \ who try to lift heavy gyroscopes over their heads, and find it easy, because\
    \ there is no downward 3rd Law reaction!\nThink \"Eric Laithwaite, London, 1974\"\
    .  \nWe have not yet constructed an actual UFO, but we have measured a 1 kg upward\
    \ force (for both N and S orientations of the central magnet) with almost no downward\
    \ force. \nMany thanks to Hamdi Ucar for making the first discovery concerning\
