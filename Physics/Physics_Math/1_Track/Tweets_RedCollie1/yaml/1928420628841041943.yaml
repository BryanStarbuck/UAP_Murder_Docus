  text: "Just so everyone can understand, UFOs seem to fly by means of a \"helical\
    \ magnetic field\", as seen often in astronomy (slide 1), and also drawn in crops\
    \ by friendly aliens (slide 2).\nIf we arrange six wire coils into the shape of\
    \ a hexagon, and give 3-phase power, we can create a helical magnetic field, within\
    \ which a central magnet will SPIN and RISE (slide 3). \nThat matches almost exactly\
    \ the shape and spin of a \"hexagonal\" UFO seen over California last month (movie\
    \ 4). \nSo I am trying to reverse-engineer how \"alien drones\" like that fly.\
    \ \nA similar \"hexagonal UFO\" was drawn in crops near Ipuacu, Brazil during\
    \ October 2024."
