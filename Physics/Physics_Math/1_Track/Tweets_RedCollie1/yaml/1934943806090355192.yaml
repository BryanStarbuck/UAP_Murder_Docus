  text: "As the Israel-Iran war moves into a serious phase, I would like to remind\
    \ everyone that US military contactee \"C.J.\" received a long message from humans\
    \ in the future in our (his) year 2016.\nIt was (will be) sent back in time by\
    \ French particle physicists, who were (will be) living in Jerusalem after its\
    \ \"topside destruction\" by a missile from the east.\nThe Dome of the Rock has\
    \ been (will be) destroyed. They are planning to build a Third Temple on the site.\
    \ \nMeanwhile they are (will be) living under the Mount of Olives, in burial vaults\
    \ there, because the surface remains toxic. \nI suspect that we will make contact\
    \ with friendly aliens in the near-future, when that message will be \"sent back\"\
    , and that they used advanced alien tech to send it? \n\"Your creator is displeased\"\
    \n\"Arrogant belief must allow ALL\"\nThen a lat-long for Dome of the Rock as\
    \ shown below.\nThey call it \"Solomon's Temple\".\nWhether this is the actual\
    \ future for OUR timeline remains to be seen? \nYet the message was real, and\
    \ written in an advanced 4-symbol code that no one except me could seemingly interpret.\n\
    The physicists who sent it back in time are desperate people, and hope that their\
    \ communication of this message, to others of our time, will prevent such terrible\
    \ events from taking place? \nYet no one in 2019 to 2025 seems to be interested.\
    \ \nThey also sent steganographic codes for a lat-long where the missile will\
    \ be launched, which I should not say here. \nDJT says they are \"very close\"\
    \ to having a nuclear warhead. \nOnce again, I do not know whether that message\
    \ relates to our present timeline, or to another timeline in a separate reality.\
    \ The US DOD have visited \"C.J.\" twice."
