  text: "Here is a crop-circle contact-story which some of you may not believe, but\
    \ it was all true.\nIn June of 2008, Jack Sullivan from Wiltshire went to see\
    \ a new crop circle, as shown in slide 1.\nIt resembled a \"magnetic flux tube'\
    \ as shown in slide 2.\nWhile he was there, the windshield of his car became imprinted\
    \ with that same shape in the glass! \nActually with two such shapes: one for\
    \ when small aliens went into his locked car, and another for when small aliens\
    \ came out!\nWhen he returned from the crop circle, Jack noticed that certain\
    \ items within his car had been \"moved around\".\nOnly later did he see\U0001F9D0\
    two \"flux tubes\" imprinted in the glass. \nMaybe those small aliens were just\
    \ curious as to how humans drive around? Expand your thinking!"
