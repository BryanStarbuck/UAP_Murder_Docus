  text: "While we are waiting to see what Iran does next, I would like to show you\
    \ something from 2017 that was quite remarkable. It may change completely the\
    \ way in which you perceive world events! \nI went with Matthew and his dog Angel\
    \ to see a new crop circle on August 8, 2017 near Stratford-upon-Avon.\nAs shown\
    \ in photo 1, it was a big letter \"Q\", with a long \"tail\" that curved toward\
    \ a green tree. \nLooking at photo 2, we can see that the \"tail\" of that letter\
    \ \"Q\" could have gone toward either of two trees nearby: one green and healthy,\
    \ but the other brown and dead. I walked past the dead tree through standing wheat\
    \ to reach the living tree.\nLooking at photo 3, we can see a raised \"Sun shape\"\
    \ inside of the letter \"Q\", that could not possibly have been made using \"\
    rope and boards\".\nFinally I walked around, inside of that letter \"Q\", to count\
    \ how many \"rays of light\" were emerging from its \"Sun shape? Please watch\
    \ video 4. \nThere were seventeen (17) \"rays of light\" in total, to match the\
    \ year 20-17, and also the letter \"Q\" in our modern alphabet. \nOur friend \"\
    Q\" or \"Quetzal\", now known as \"Q-anon\", came down from space on the solar\
    \ eclipse of August 17, 2017. Just as predicted by the \"Quetzalcoatl Headdress\"\
    \ in 2009. \nAfter a few weeks, he somehow reached Donald Trump, and told him\
    \ about an upcoming \"STORM\". Then he went on 4chan or 8chan to talk to millions\
    \ of people worldwide. \nHe is a military strategist from the Pleiades (Plejaren).\
    \ He and his people came here to save us, and create a \"new dawn\" for humans\
    \ on Earth. That is why he drew a \"rising Sun\" with 17 \"rays of light\". \n\
    \"We will show you a new world\" he said later on-line.\nOne week later, on my\
    \ way home through Singapore, I had a virtual-reality psychic contact with \"\
    Q\", perhaps because I had gone to see his crop picture? \nThey have some kind\
    \ of remarkable technology to make contact by psychic means, just as if you had\
    \ been transported through all of your senses to another place or time.\nNow as\
    \ the Israel-Iran war continues, it may be that the STORM is about to begin? \n\
    \"We have the world's great generals\" DJT said on October 6, 2017, not long after\
    \ he had met \"Q\". \nThen he traced a letter \"Q\" in the air, and asked the\
    \ media \"Do you know what this means?\"\n\"No, Mr. President.\"\nTo which DJT\
    \ replied \"You'll find out.\" \nPlease try to understand this deeper conception\
    \ of reality, as we enter a very difficult time? \n\"Mr Pool\", one of Q's people,\
    \ says it will be THE END of a long-term cycle of history. \nIn summary, we seem\
    \ to be already-allied with a friendly, spiritually-advanced race of humans from\
    \ the stars. Even through the existence of UFOs is still denied by mainstream\
    \ sources and authorities. \U0001F921\nThey will be coming openly soon, probably\
    \ to South America. 1⃣7⃣"
