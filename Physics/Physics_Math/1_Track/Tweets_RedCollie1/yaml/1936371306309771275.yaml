note_tweet:
  text: "Here I will show the experiment I am doing next, to try and understand how\
    \ UFOs, drones or orbs fly? \nLooking first at movie 1, we can see \"fast spin\"\
    \ by a beaded, magnetic flywheel of some kind.\nLooking next at slide 2, we can\
    \ see two sets of 3-phase wire coils, which make that magnetic flywheel spin,\
    \ three above and three below.\nLooking at slide 3, we can see the same device\
    \ from another angle. There are three small, 3-phase wire coils both above and\
    \ below, which cause a central, flat, magnetic flywheel to spin.\nNow it turns\
    \ out that fast spin of that large, flat magnetic flywheel by itself does NOT\
    \ produce a \"strong\" anti-gravity effect (only \"weak\" ones). What might we\
    \ have missed? \nPerhaps if we place a large, flat wire coil just under the spinning\
    \ magnetic flywheel (see a \"double layer\" in photo 3), and give that wire coil\
    \ lots of AC power, to produce upward Lenz levitation, then it might be possible\
    \ to produce a \"strong\" anti-gravity effect?\nLooking at slide 4, we can see\
    \ essentially the same structure for a famous UFO filmed off San Diego.\nThat\
    \ will be my next experiment. I call it \"Lenz levitation unbalanced by spin\"\
    . \U0001F6F8 STUDY NATURE"
