note_tweet:
  text: "We can't be sure (yet) whether this new crop picture from Italy on June 22,\
    \ 2025 is REAL? Yet we can say that it shows essentially the SAME codes as another\
    \ crop picture in Italy on June 20, 2011 that read \"Ea Enki space\" in 8-bit\
    \ ASCII.\nIn order to align the two crop pictures, we need to \"count the number\
    \ of stars\" as 3-3, 4-4-4-4, 5 clockwise in each case for \"Ea\" (two sets of\
    \ 3 stars), \"Enki\" (four set of four stars) and \"space\" (one set of five stars).\
    \ \nThere is a \"little circle\" drawn in each crop picture at upper right (just\
    \ before the first set of three stars) telling where to begin reading. \nWill\
    \ we see another ASCII code as Phase 2? \nThe Sumerian god \"Ea Enki\" was known\
    \ for astronomy, because all of the stars in Earth's southern hemisphere were\
    \ called the \"stars of Ea\". \nHe was also known for genetics, as the joint creator\
    \ of humans on Earth with his lab partner Ninmah. \nI solved the 2011 code in\
    \ a coffee shop in Paddington, London on the back of a paper napkin, having arrived\
    \ from Hong Kong early in the morning. \nI asked a young English woman sitting\
    \ next to me, \"What do you think this word 'space' means?\" She said nothing,\
    \ and just pointed up to the sky. \nIf this new crop picture in 2025 Italy was\
    \ somehow made by local humans, then it was very well-done! \nThe farmer where\
    \ that 2011 crop picture appeared (unseen near his house-barn) set up a \"shrine\"\
    \ in  honor on Enki shortly afterward. \nEA ENKI SPACE \n\"I am the one called\
    \ Ehyah. That is the name by which I wish to be remembered, from generation to\
    \ generation.\""
