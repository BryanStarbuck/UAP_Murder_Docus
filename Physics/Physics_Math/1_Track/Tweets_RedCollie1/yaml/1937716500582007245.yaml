  text: "I know what it means! Ea Enki is showing us an amazing PUZZLE in Earth's\
    \ night-sky astronomy. \nThe Babylonians classified bright stars in the sky as\
    \ the \"path of Enlil\" (higher than 17 N declination), the \"path of Anu\" (between\
    \ 17 N and 17 S declination), or the \"path of Ea\" (lower than 17 S declination).\n\
    Ea Enki therefore drew two crop pictures in Italy, in 2011 and 2025 (drawn in\
    \ black and white below, slides 1 and 2), showing two different \"paths of stars\"\
    , superimposed onto a \"World Map of Babylon\". \nThe star paths of \"Enlil and\
    \ Ea\"? \nSlide 3 shows a conventional star-map of Earth's southern hemisphere\
    \ by declination. Look at the thin circles of declination, centered on -90 degrees.\
    \ \nA transparent overlay of those two crop pictures is shown in BLUE (slide 4).\
    \ \nI am not sure how to solve this GREAT PUZZLE, one of the greatest in human\
    \ history. \nCould someone skilled at Earth-sky astronomy please try to solve\
    \ it for us? \nYou would need to program each kind of crop-drawn star-pattern\
    \ (or their overlap) into a computer, then do a \"rotation search\", to look for\
    \ a match to real star maps, from Earth's northern or southern hemispheres, at\
    \ more than 17 N or less than 17 S declination.\n(In x-ray crystallography, they\
    \ call this a \"rotation-translation search\".) \nEA ENKI SPACE. Cleverest of\
    \ the Annunaki. \nPlease share and ask your friends to solve? Ask the Great Astronomy\
    \ Professors in our Schools? \nDoes everyone understand now? Thank you.\nTO THE\
    \ STARS. We have to show that we are worthy.\n\"We will show you many puzzles\"\
    \ they told Betty Andreasson.\U0001F31F\U0001F31F\U0001F31F"
