  text: "Just to review the facts, this crop picture appeared on June 23, but was\
    \ not well photographed until June 29, by Valeria and Silvio, because it was in\
    \ a no-fly zone at the end of an airport runway. I provided the first and correct\
    \ decoding a a few days later:\n\"timeo ET ferentes!\" \nSome weeks later, a debunking\
    \ team led by Mr. Grassi decoded it as \"vimeo\" rather than \"timeo\", and claimed\
    \ that it was an advertisement for the \"Vimeo\" movie posting site. \U0001F921\
    \ \nHis photos were not as good as those taken by Valeria. So he also missed two\
    \ \"small triangles\" instead of \"small circles\" in the binary code at positions\
    \ 1 and 25.\nWe did not learn what that \"25\" code might mean, until another\
    \ crop picture appeared a few weeks later at Rollright Stones, with a number \"\
    25\" drawn in standing crop nearby.\nThen on July 25, 2015, we saw the \"Hopi\
    \ Eagle Dancer\" at Uffcott. Its date had been predicted by certain details of\
    \ both the Italian and Rollright crop circles a few weeks before. \nOne would\
    \ have to be a daft idiot to believe anything the \"debunkers\" say. There seem\
    \ to be a lot of them! \nJust as an aside, that \"Eagle\" was \"looking at\" another\
    \ crop picture in the distance below, namely a \"rose of sympathy\" they had drawn\
    \ for the farmer at Hackpen Hill, because his wife had sadly passed away of cancer.\
    \ \nAnd those are the facts. Study Hopi prophecy to learn about their \"Eagle\
    \ Dancer\" and the \"blue star Kachina\", and how that may be relevant here."
