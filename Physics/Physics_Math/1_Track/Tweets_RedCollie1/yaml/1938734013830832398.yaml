  text: "It has been 6 days now, and no one has posted a drone video of the new Italian\
    \ crop picture, which shows the \"Stars of Ea\". A very similar Italian crop picture\
    \ from 2011 showed \"Ea Enki space\" in binary code. \nIf you look closely at\
    \ slide 1, you can see that \"no one walked there\", which would have left obvious\
    \ traces in nearby standing crop. \nCertainly not \"20 people\", whom debunkers\
    \ later claimed to have made the 2011 version. They would have left a complete\
    \ mess! \nAlso if you look in the very center, you cannot see any \"hole made\
    \ by pole\". \nThe debunkers say that it is easy to make a crop picture, by placing\
    \ a pole in the ground, and using a long rope to help flatten crop in a \"circular\
    \ shape\". That clearly did not happen here! \nIts seven-fold symmetry is also\
    \ nearly impossible to draw in crops with many 51.4 degree precise angles.\nIf\
    \ you still are not convinced, then please zoom in closely, and look at the lay\
    \ of fallen wheat in its outer \"white star\" regions? It looks nothing like what\
    \ would be made using a \"board\". \nThey would have carefully had to make 3,\
    \ 3, 4, 4, 4, 4, 5 standing tufts of wheat going around clockwise, all of different\
    \ and precise diameters. In the dark at night when no one was looking!\nThose\
    \ numbers in 2025 match the number of letters in  that 2011 crop-picture message\
    \ as \"Ea\" (3-3), \"Enki\" (4-4-4-4), \"space\" (5). \nThe new version appeared\
    \ 2 x 7 = 14 years after the first, with seven-fold symmetry, on almost the same\
    \ day of the same month.\nTypically the intel debunkers come out with some kind\
    \ of fake photos or videos, one week after any spectacular new crop picture appears.\n\
    So be prepared: use logic, study facts, and do not be fooled by their obvious\
    \ A.I. DECEPTIONS. That is their \"job\". They get paid by Earth governments to\
    \ debunk. \nJust like for debunking of UFOs, or fakery in the 2020 Presidential\
    \ election, when Joe got \"81 million votes\".\nFollow the Buddha, and make important\
    \ judgments for yourself, based on logic and reason. Take no one's word for anything.\
    \ Expand your thinking.\U0001F549️\U0001F549️\U0001F549️"
