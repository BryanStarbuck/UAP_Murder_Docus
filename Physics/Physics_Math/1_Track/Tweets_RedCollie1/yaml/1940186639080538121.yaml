note_tweet:
  text: "Many people are wondering whether plasmid DNA, as a contaminant of Pfizer\
    \ vaccines, can integrate into human chromosomes, and perhaps cause cancer?\n\
    I did some experiments on that subject when I was working on gene therapy in CSIRO.\
    \ They were looking for a \"safe\" form of DNA integration for anti-cancer viruses.\n\
    The answer is that, if the contaminant plasmid contains any sequences which match\
    \ repetitive DNA in human chromosomes, then it can integrate with 10X to 100X\
    \ efficiency more than if it does not, using natural enzymes in our body that\
    \ promote \"homologous recombination\" (as by recA in E. coli).\nIt is an easy\
    \ experiment to confirm.\nWe inquired of Pfizer, way back in 2020, asking through\
    \ our top scientist here, whether their mRNA vaccines could integrate into human\
    \ chromosomes? But they assured us it was \"impossible\", because that would require\
    \ a \"reverse transcriptase\" enzyme.\nNo one knew then, that Pfizer had failed\
    \ to remove all plasmid DNA from their commercial products. \nIn the latter case,\
    \ it can integrate fairly easily through \"homologous recombination\". \nMolecular\
    \ biology 101. \U0001F921"
