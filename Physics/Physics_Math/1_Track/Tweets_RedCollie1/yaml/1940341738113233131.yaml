note_tweet:
  text: "After some study, I have no choice but to conclude, that if we place a wire\
    \ coil with DC or AC power beneath a spinning gyroscope/top, we may re-create\
    \ \"UFO physics\" on a small scale. \nA force of gravity pulls the spinning gyroscope\
    \ down (see video 1). Then either a \"pole\" and/or \"wire coil\" pushes the gyroscope\
    \ up. \nNormally F (gravity down) = F (pole up).\nBut with a wire coil, perhaps\
    \ F (gravity down) < F (pole up) + F (wire coil up)? \nIf the spinning gyroscope\
    \ is a permanent magnet, the wire coil would use DC repulsion upward.\nIf the\
    \ spinning gyroscope is an aluminum disc, the wire coil would use AC Lenz repulsion\
    \ upward.\nA friendly E.T. drew slide 2 for us, so we should take it seriously!\
    \ Many other crop pictures look very similar. \nThere is no sense in doing more\
    \ complex experiments, until I (we) figure this out. I have ordered two small\
    \ gyroscopes for test studies. Others can try if they are interested? \nNOT IN\
    \ PHYSICS TEXTBOOKS. \U0001F6F8"
