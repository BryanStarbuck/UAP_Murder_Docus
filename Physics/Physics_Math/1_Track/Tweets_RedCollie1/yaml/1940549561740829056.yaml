  text: "As this young man (from Sydney Uni) tries to lift a heavy, spinning gyroscope\
    \ over his head, using just one hand, he says \"it feels incredibly light\".\n\
    I understand SOME of the physics to explain this, which I will state briefly here.\
    \ Others may wish to comment, or study this subject in greater detail?\nA downward\
    \ force of gravity acts on the far end of that heavy spinning gyroscope, thereby\
    \ making it very difficult to lift when NOT spinning,\nYet when it spins, the\
    \ downward vector-force for gravity gets \"transferred\" 90-degrees sideways into\
    \ a horizontal vector-force for rotary precessional motion.\nThus the heavy spinning\
    \ gyroscope wants to turn \"naturally\" around his body and head, due to the force\
    \ of downward-to-horizontal \"converted\" gravity!\nJust like for the sideways\
    \ motion of a spinning top, when we spray it with compressed air.\nOr for the\
    \ sideways motion of spinning electrons in a N-S magnetic field, when we apply\
    \ an electric force perpendicular to the N-S axis. \nThat is called the \"Lorentz\
    \ force\", and it underlies all electromagnetic motors or generators on Earth.\
    \ \nI would like to suggest that we call this a \"Lorentz kind of force for gravity\"\
    . \nPHYSICS PEOPLE CAN MEMORIZE, BUT THEY CAN'T SEE DEEPER CONNECTIONS. \nThis\
    \ unusual effect was first discovered by Eric Laithwaite in 1974 London (see https://t.co/GkGisFzvAC).\
    \ He was despised by the other academics in England for it.\nThus we have all\
    \ been \"blind\", but now can \"see\". \nAcademics tend to reject new ideas, until\
    \ they see how those new ideas fit in with the old ideas. \U0001F441️\U0001F441\
    ️\nThis \"Lorentz force for gravity\" may relate in some way to how UFOs or orb-spheres\
    \ fly, and we should work in that direction next."
