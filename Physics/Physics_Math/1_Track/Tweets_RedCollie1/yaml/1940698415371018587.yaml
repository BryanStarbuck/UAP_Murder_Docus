  text: "TEACHING EXERCISE: If you study the three examples shown in this video, for\
    \ a spinning top, spinning electrons, or spinning gyroscope, you will learn a\
    \ general principle of physics which underlies all of our modern electromagnetic\
    \ devices, and also how fast-spinning UFOs may negate a downward force of gravity.\n\
    Example 1: when a jet of air blows on a spinning top, it does not move away from\
    \ the jet, but rather 90 degrees in another direction.\nExample 2: when ions of\
    \ nitrogen and oxygen (or electrons) pass over a N or S magnetic field, due to\
    \ a strong electric force from plus to minus, they never reach the opposite electrode,\
    \ but curve 90 degrees in another direction (the \"Lorentz\" force).\nExample\
    \ 3: when we spin a heavy gyroscope, the downward force of gravity becomes greatly\
    \ lessened, because most of that downward force gets re-directed 90 degrees in\
    \ another direction.\nThis causes a heavy, spinning gyroscope to become amazingly\
    \ light, then rise by rotary precession over a man's head! \nMight even faster\
    \ spin-rates produce a re-directed force of gravity by 180 degrees as \"anti-gravity\"\
    ? \U0001F6F8\nThis new movie shows ALL of the important experiments in ONE PLACE,\
    \ right in front of your eyes, in such a simple way that you can be certain of\
    \ the truth, without needing any \"equations\" or \"mathematics\". \nVery simple,\
    \ but no one (on Earth) seems to have understood these ideas previously.\U0001F921\
    \nI will try to find some way to apply these new ideas in the lab soon, after\
    \ some experiments with small gyroscopes. \nThank you to the physicists at Sydney\
    \ Uni for a clip from their long movie as video 3. \nMeasurements of weight on\
    \ a scale will be addressed as a separate issue in the future. \U0001F600"
