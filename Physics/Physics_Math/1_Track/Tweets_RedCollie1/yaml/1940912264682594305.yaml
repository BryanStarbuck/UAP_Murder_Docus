  text: "WHAT WILL HAPPEN to a spinning gyroscope, if we apply a magnetic force from\
    \ a wire coil placed just below? Might that produce some kind of anti-gravity?\
    \ \nThat is the experiment which I will TRY to do next, following the repeated\
    \ instructions of our E.T. crop-artist friends. \nPlease watch video 1 to learn\
    \ the known science (thanks to Science Online). Look at how a spinning gyroscope\
    \ converts the \"downward\" force of gravity to a \"sideways\" force, which makes\
    \ it turn in a horizontal plane. Of course it doesn't \"fall down\"! \nIt is like\
    \ having a big debt with the bank. So you borrow money from someone else, give\
    \ it to the bank, and the debt is \"paid\". Gravity no longer pulls you down.\n\
    Slides 2 and 3 show two of the many relevant crop pictures for \"UFO physics\"\
    . They show a wire coil, or related object, UNDER a spinning gyroscope. And instead\
    \ of spinning it up with a string, they spin it up using 3-phase AC power. \n\
    Some kind of magnetic force will come from the lower wire coil, when we add DC\
    \ or AC power. I will have to glue small magnets of some kind to the spinning\
    \ gyroscope to make it respond. What will happen?\nHow did Faraday discover the\
    \ \"electric motor\"? Small-scale experiments are best, until we learn the NEW\
    \ PHYSICS of UFO flight. We have to ask the RIGHT QUESTIONS, to get the RIGHT\
    \ ANSWERS.\nYou will not find the \"physics of UFO flight\" in any textbook here\
    \ on Earth today, even as many alien UFOs ir orb-spheres fly all around us. \U0001F6F8"
