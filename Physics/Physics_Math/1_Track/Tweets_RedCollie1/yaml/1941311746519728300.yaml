note_tweet:
  text: "A crop picture from Ashmore Down in 2020 suggested that we should spin a\
    \ magnet \"off axis\", using 3-phase power, to get UFO levitation (slide 1).\n\
    I tried that using a 60 mm magnet with a 20 mm hole in the middle (video 2). \n\
    It did rise up strongly, except the spin motion was very noisy and lopsided, plus\
    \ there was only an oscillating loss of weight on the scale below (when the magnet\
    \ went into free-fall).\nPerhaps we should make it spin off-axis using a \"gyroscope\"\
    \ kind of motion, as shown in movie 3?\nMore tests\U0001F6F8 soon!"
