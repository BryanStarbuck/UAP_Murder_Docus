  text: "I am pretty sure that an anti-gravity force of UFO levitation comes from\
    \ the precessional \"rise\" of a top-gyroscope, when it changes from low spin\
    \ to high spin.\n\nAt low spin, the top precesses in a horizontal plane, because\
    \ the downward force of gravity has been spin-shifted by 90 degrees from \"down\"\
    \ to \"sideways\".\n\nThen as we add more spin, by either a finger or 3-phase\
    \ power, that horizontally-precessing gyroscope has to rise AGAINST the downward\
    \ force of gravity, so that the spinning plane of its inner rotor can maintain\
    \ a constant position in space for \"gyroscopic stability\".\n\nThe first great\
    \ crop picture in 1991 near Barbury Castle (see slide 1) showed this two-step\
    \ mechanism exactly (see slide 2). Think \"Annunkai friends\". \n\nTwo brief videos\
    \ 3 and 4 show this two-step, anti-gravity force for real spinning gyroscopes.\
    \ That Buga orb-sphere may fly in the same way?\n\nI have ordered some big, heavy-duty\
    \ gyroscopes, and will test for anti-gravity physics after they arrive. \n\nIf\
    \ any skilled physicists would also like to address this problem, whether experimentally\
    \ or theoretically, they would be welcome. PER ASPERA AD ASTRA.\U0001F6F8"
