note_tweet:
  text: "This was part of my Ph.D. thesis at Caltech in 1980, where I did the first\
    \ high-resolution, x-ray crystal structure of DNA (on Earth) with my advisor Richard\
    \ Dickerson.\nA photo below shows a sequence \"AATT\" in the center of CGCGAATTCGCG\
    \ (no two-fold crystal symmetry). \nColored red or blue balls are water oxygen\
    \ atoms, bound to the base pairs. \nDick sadly passed away last month. He was\
    \ the best of US protein crystallographers in the 1970's, and wrote many excellent\
    \ science textbooks."
