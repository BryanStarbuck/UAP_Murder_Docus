    \ calendar (of 18,980 days or 20 days per month, see 20 Mayan symbols around the\
    \ outside).\nA large symbol in the very center stands for \"crescent Venus\" which\
    \ was bright in the sky at the time.\nThis crop picture PREDICTED THE FUTURE by\
    \ more than two years in advance. Once you can decode symbols into math, I will\
