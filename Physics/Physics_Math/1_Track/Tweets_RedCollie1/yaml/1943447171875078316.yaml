  text: "You are the ONLY ONE who solved step 1!\nPlease post all of this conversation\
    \ when we are finished, so others can learn? \nFor step 2, first convert 13-10-7\
    \ and 14-5-11 hexadecimal numbers into decimal numbers, by calculating 13/16 +\
    \ 10/16*2 + 7/16*3, or 14/16 + 5/16*16 + 11/16*16*16.\nYou will get two numbers\
    \ close to 0.83 or 0.87.\nSubtract one number from the other number, then multiply\
    \ by 18,980, for the number of days in one Calendar Round (52 years). \nYou will\
    \ find that, if 13-10-7 is August 9, 2005 when the crop picture appeared, then\
    \ 14-5-11 equals November 20, 2007.\nStep 3 in the next comment."
