  text: "Here is the story of \"Mothership Glass\" in 2016! It began in a very odd\
    \ way. \nThere was a woman who ran a pick-your-own farm shop in Ansty, not far\
    \ from Stonehenge. \nEvery summer she would make \"corn or wheat mazes\" in the\
    \ large field in front of her farmhouse, to try and attract the attention of friendly\
    \ aliens, who might be looking down from above! You can see some of those \"mazes\"\
    \ on Google Earth using \"Historical Imagery\".\nBy 2016 she had gotten tired\
    \ of that enterprise, because no aliens had shown up. So when August came around,\
    \ the large field where she drew her corn mazes was still intact and unharvested.\
    \ She took her family to Cornwall for a week to get some sunshine, beach, and\
    \ a little swimming.\nWhen she returned home on August 5, 2016, she saw to her\
    \ surprise, in the same field where she had been drawing \"corn mazes\" to attract\
    \ aliens, a huge and spectacular crop picture! \nAfter a few days she contacted\
    \ the CCC website, and they sent Matthew to take drone photos before the public\
    \ would be allowed in. I still have many of those photos that Matthew shared with\
    \ me.\nPlease see that huge and detailed crop picture from Ansty 2016 in slides\
    \ 1 and 2 below.\nAfter another day or so, someone recognized it as the logo of\
    \ a small company in the USA from Washington state, that makes high-priced artistic\
    \ glass bongs for dope-smoking \"collectors\"! \nMaybe $10,000 per item. Very\
    \ recently, their glass-blowing skills had dramatically improved, and by 2016\
    \ they were regarded as the \"best\" in that field. \nNobody really puts dope\
    \ into such an expensive bong and smokes it. They buy such items to keep on their\
    \ shelves, because of the high-quality glass blowing.\nThe name of that small\
    \ company was \"Mothership Glass\". You can see in slide 3 how their logo resembles\
    \ the crop picture at Ansty in 2016.\nWas it an \"advertisement\" paid for by\
    \ Mothership Glass in the USA? Not likely for two reasons.\nFirst, this crop picture\
    \ was so large and spectacular, that it would have taken a team of 12 skilled\
    \ plankers, 3 days to make. Yet many people were watching that field almost constantly\
    \ and saw nothing. \nThe people picking and paying for farm produce. People walking\
    \ their dogs on a nearby hill. Other farmers, who kept sheep on a nearby hill.\
    \ All of whom had a high, line-of-sight view to the field below.\nSecondly, this\
    \ crop picture appeared right in front of a large farmhouse (slide 4). How could\
    \ there be a big team of plankers there for 3 days, parking and making a lot of\
    \ fuss, without anyone noticing? \nThe farm owners had NOT given permission, so\
    \ anyone would have been arrested by the police for \"vandalism\". \nWhat an incredible\
    \ but true story so far! Let us go on now to Part 2, which seems even more incredible.\
    \ The relevant text and slides for Part 2 are shown in the first comment below.\
    \ \nThink \"MOTHERSHIP\"\U0001F6F8"
