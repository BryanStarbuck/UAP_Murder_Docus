  text: "Here now is Part 2 of the story of \"Mothership Glass\" in 2016. \nSlide\
    \ 1 shows an open statement by the woman who ran the Ansty farm shop, saying how\
    \ no one there knew anything, about how a huge and spectacular crop picture had\
    \ suddenly appeared, right in front of their farmhouse, without anyone seeing\
    \ or hearing anything.\nNext in slide 2, we can see a circle of 20 strange, alien-alphabet\
    \ symbols which spell the word \"MOTHERSHIP\" twice in crops, instead of English\
    \ letters as used in the company logo.\nAs shown in slide 3, we could decode which\
    \ alien-alphabet symbol stood for each English letter, by using a clue that the\
    \ word \"MOTHERSHIP\" only contains one letter twice, namely \"H\".\nWhere might\
    \ such strange, alien-alphabet symbols have come from? There is no known match\
    \ to any modern or ancient alphabet here on Earth! \n(As an aside, please note\
    \ that an alien orb-sphere, which crashed recently near Buga, Columbia, also had\
    \ a series of strange, indecipherable alphabet-symbols, inscribed as a circle\
    \ around its upper perimeter.)\nThat 2016 mystery became even deeper a few days\
    \ later, when people scrutinizing the Facebook page for \"Mothership Glass\" saw\
    \ that those same alien-alphabet symbols, drawn in crops on August 5, had been\
    \ posted on Facebook on July 29, but in such a small font that nobody had noticed\
    \ them previously (slide 4). \nWhat could be going on here? The owner of \"Mothership\
    \ Glass\" definitely posted those tiny symbols on July 29, but denied any knowledge\
    \ of a huge and spectacular crop picture, which showed those same symbols in very-large\
    \ field format, one week later in southern England.\nTo this day in 2025, we have\
    \ no certain answers to such a puzzling dilemma. But I will briefly summarize\
    \ some relevant and likely possibilities in Part 3, as a second comment below.\
    \ \U0001F600\U0001F973"
