  text: "We know that a magnet has to spin by 3-phase magnetic fields to create UFO\
    \ levitation, as shown in slide 1 (and many other crop-picture \"blueprints\"\
    ).\nThat motion is essentially as shown in movie 2 for low speeds of rotation.\n\
    Now I am building various kinds of device to match what we see drawn in crops\
    \ everywhere, as shown in my new movie 3. \nIt turns out that we CAN'T use a 3-axis\
    \ gyroscope!\nHowever an \"axial ball joint\" shows some promise.\nA preliminary\
    \ \"axial ball joint\", shown at the end of movie 3, works okay at low rpm, but\
    \ loses stability when the spinning magnet wants to RISE at high rpm (because\
    \ it is only held down by small magnets). \nNEXT I will keep that spinning-magnet\
    \ connected to the base (something like in the steering system of your car), and\
    \ see whether that is the answer? \nJames Watt took a long time to invent the\
    \ steam engine!\nTrial and error unless A.I. gets much smarter soon.\n\U0001F6F8\
    \U0001F6F8\U0001F6F8"
