  text: "TEACHING EXERCISE: We can see with our own eyes,  that a spinning top \"\
    rises up\" against downward gravity, as we increase its rate of spin (videos 1\
    \ and 2).\nWe can see a similar effect with a spinning disc-magnet (video 3).\
    \ Yet as it lifts off the ground, its connection to the lower device becomes unstable,\
    \ and it flies off.\nIf we wish to make this easily-seen, indisputable, anti-gravity\
    \ force useful for UFO or orb-sphere \"levitation\", we need to do two things\
    \ in a technical sense.\nFirstly, allow for almost-frictionless rotation about\
    \ two separate axes: namely an upper axis of magnetic spin, and a lower axis of\
    \ precession. \nSecondly, as the spinning disc-magnet rises up against gravity,\
    \ we need to somehow \"hold it down\" without much friction, thereby allowing\
    \ it to \"pull up\" the entire craft. \nBoth of those requirements were drawn\
    \ in the first great crop picture from 1991 near Barbury Castle (slide 4). \n\
    I am trying to make this great technical advance all by myself, on a somewhat\
    \ backward world, where all they can understand is \"rockets\". \U0001F680\U0001F6F8\
    \nThat can explode under your feet! Fun, fun, fun. \nIn summary, we should be\
    \ able to get a powerful anti-gravity force during the \"transition\" between\
    \ low rpm and high rpm, as the axis of precession\" becomes more vertical. \n\
    Does everyone understand? Not in textbooks. Don't waste your time looking there.\
    \ \nYOU CAN SEE IT, BUT THE GREAT \"HERR DOCTEUR PROFESSORS\" DO NOT KNOW \U0001F921\
    \n\"In science, you have to know what you are doing\" (Max Perutz)"
