  text: "Of course there are time travelers. I first learned this in early 1999, when\
    \ I flew from Australia to Florida because my father had a stroke.\nOn the plane\
    \ from LA to Atlanta, I was \"introduced\" to Dr Roger Leir under very unusual\
    \ circumstances. Later we became friends.\nAfter I arrived in Jacksonville, I\
    \ took my mother to see my father who was in a rehab center. The doctor said he\
    \ might not last the night.\nIn the morning, I called my cousin Billy who was\
    \ at the hospital, to find out if he was still alive? Billy replied, \"Come on\
    \ over, he is fine, and has something to tell you!\"\nWe got there an hour later,\
    \ to see him sitting up in bed, eating breakfast with a smile, his skin pink rather\
    \ than grey.\nHe was telling everyone that an \"angel\" had visited him during\
    \ the night. She said \"My name is Sarana (or Sirona), and I have come here to\
    \ help you.\" \nThen she held his arm, and sent a vast amount of healing life-energy\
    \ into his body. In the same way that Jesus would heal people.\nHe lived 5 more\
    \ years as a result. The doctors and nurse were nervously moving things around,\
    \ after seeing a \"miracle\".\nI asked the hospital priest whether that kind of\
    \ thing happens very often? \nThis was at a time when I was doing private scientific\
    \ research on alien DNA genetics. I had a close contact from these people just\
    \ a few months earlier in December 1998.\nLater I began to ask, \"Who is Sirona?\"\
    \nShe was known as a \"healing goddess\" when she lived in Europe around 200 AD.\
    \ The Roman Emperor Caracalla went to see her and request healing. She refused,\
    \ because he had killed his two mistresses.\nBy 2007, I again learned about time\
    \ travel by studying many examples drawn in crop pictures.\nThen in 2020, I was\
    \ exposed to time travel again, by follow some of the people on Twitter who had\
    \ been tasked to bring in cryptocurrencies.\nAlso by \"Q\" who certainly could\
    \ see into the future.\nNow by 2025, they have changed our timeline in many important\
    \ ways, which I will leave it to the reader to deduce, as an important step to\
    \ enlightenment. \nThe name \"Sirona\" means \"of the star\". She was/is a \"\
    healing star goddess\".\nThe Romans did not use the words \"deus\" and dea\" to\
    \ refer to some invisible God in the sky.\nTheir \"gods\" were advanced humans\
    \ who lived on Earth, and whom they could visit and see in person.\nTuatha de'\
    \ Danaan: \"Gods were their men of skill, and non-gods their husbandmen\". People\
    \ of the Sky."
