  text: "This amazing and incredible crop picture, which appeared close to the end\
    \ of an airport runway at Torino on June 23, 2015, said in code:\n\"timeo ET ferentes!\"\
    \ or \n\"I fear E.T. bearing (gifts)!\"\nIt was warning about a Trojan Horse kind\
    \ of event, by enemy alien E.T.'s who have been allowed \"inside of our city gates\"\
    \ here on Earth.\n\"timeo Danaos et dona ferentes\" is Latin for  \n\"I fear the\
    \ Greeks, even when they bear gifts\".\nThis phrase is used to caution against\
    \ trusting an enemy, especially when they offer something seemingly beneficial.\n\
    \"Infiltration not invasion\" (Q).\nEverything is connected. Do you understand\
    \ yet?"
