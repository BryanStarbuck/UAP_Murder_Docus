  text: "After studying all of the current data, I think there is a 50% chance that\
    \ 3I/ATLAS is an alien spaceship, and a 25% chance that its passengers intend\
    \ to re-direct their orbital path towards Earth, by a gravity-braking step near\
    \ Mars in October. In the latter case, it seems unlikely that they could be \"\
    friendly\".\nYou may recall that I was asked in 2015 to translate a long binary\
    \ message received by a veteran US serviceman (pseudonym \"CJ\"), after he and\
    \ his family saw a huge, 200-meter spacecraft at close range in northern Georgia.\n\
    That first message is shown below, with a warning that we should \"Embrace this\
    \ space vessel threat\". Also:\n\"Imminent threat soon upon Earth's leaders and\
    \ civilizations.\" Hence Luis Elizondo \"IMMINENT\" \nSince then, I have chatted\
    \ with \"CJ\" several times, and can confirm that his messages are REAL. \nWe\
    \ have also been warned many times in crop pictures, of a near-future threat from\
    \ grey aliens. \nAgain repeated in the \"CJ\" UFO messages:\n\"Beware of Orion\
    \ 1350.3 and Z Reticuli 39.170\"\nThose numbers represent \"light years from Earth\"\
    .\nIn light of all that HARD DATA (not recognized by mainstream science\U0001F921\
    ), plus a recent analysis by Avi Loeb and colleagues who are experts at orbital\
    \ mechanics, I feel that we should watch the progress of 3I/ATLAS toward Earth\
    \ very seriously, since there may be a real chance of invasion and takeover. \n\
    We should never have beamed all of those radio messages out into space! DARK FOREST.\n\
    \"Avoid [signal] messages sent\".\nWhat I have NOT told you previously, is that\
    \ \"CJ\" received not only \"codes\" from those friendly EMERTHER aliens, but\
    \ also other information which was direct.\nIn that other information, they were\
    \ assessing whether \"CJ\" as a combat-trained military man could lead people\
    \ on Earth to fight off an alien invasion, even as saucers were shooting beams\
    \ to the ground, and cities were crumbling into rubble.  \nSome aliens are our\
    \ friends and protectors. Other aliens are our deadly enemies. \"BEWARE\" of those\
    \ enemy aliens, we have been told on at least three occasions! \nThis \"alien\
    \ threat\" is far more serious than \"climate change\". If those enemy aliens\
    \ (with their advanced tech) take over planet Earth, then all will be lost. \n\
    Yet we also have friends in powerful places:\n\"Believe. There is GOOD out there.\"\
    \nThis is a time when we must be very watchful, and be able to face any hard realities\
    \ if forced on us.\n\"Fight, fight, fight\" (DJT)\n\"Do not go gentle into that\
    \ good night\" (Q)."
