note_tweet:
  text: "The Great Disclosure! People who have been thinking for years that \"aliens\
    \ do not exist\", or that \"all UFOs have a conventional explanation\", or that\
    \ \"all crop pictures were made by men with rope and boards\", do not seem to\
    \ have the intellectual skills to assess objectively now, whether 3I/ATLAS could\
    \ pose a threat to Earth?\nMost scientists, except for Avi Loeb and his collaborators,\
    \ plus the guys who study UFOs like Luis Elizondo, and the guys who study Skinwalker\
    \ Ranch, would fall into that category. \nIt is like believing that Earth is \"\
    flat\" and at the \"center of the Universe\". \nOr like the Aztecs, who imagined\
    \ that no threat could possibly come from a distant land across the vast seas,\
    \ which they had never seen. \nWe have been warned many times about an enemy alien\
    \ threat: by messages from friendly UFO occupants, as well as by many spectacular,\
    \ alien-made crop pictures, so I am studying the situation objectively, and taking\
    \ it seriously."
