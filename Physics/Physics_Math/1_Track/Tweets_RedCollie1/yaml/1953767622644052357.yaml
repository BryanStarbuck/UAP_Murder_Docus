  text: "IMPORTANT TEACHING EXERCISE, AS A PRELUDE TO UNDERSTANDING UFO LEVITATION!\
    \ \nVideo 1 shows how a spinning disc can make the vacuum around it become \"\
    viscous\" like water.\nVideo 2 shows how such a \"vacuum-resistive\" force can\
    \ make that spinning disc precess slowly in a circle.\nVideo 3 shows the same\
    \ physics as Video 2 on a much larger scale. Now someone can \"feel the weight\"\
    \ of that spinning disc as it slowly precesses. \nTwo questions: (1) why does\
    \ the spinning disc turn slowly in a circle? And (2) why does that young man say\
    \ it feels \"light\"? \nBoth questions have the same answer (not in any textbooks).\
    \ Consider the Lorentz force of electromagnetism as a useful analogy, for how\
    \ to answer those questions.\nIf you understand the Lorentz force, which underlies\
    \ all electromagnetic motors or generators on Earth, you will easily be able to\
    \ answer questions (1) and (2). \nYet if you have just memorized equations from\
    \ textbooks, then you will not have a clue.\nThis is not \"UFO levitation\" per\
    \ se, but until you answer those two questions, you will not be able to go any\
    \ further. No mathematics is required. No equations. \nYou just have to THINK.\n\
    \"Expand your thinking\" (Q).\U0001F600"
