note_tweet:
  text: "Here is a brief summary of the new \"Nature\" paper on Alzheimer's Disease\
    \ as caused by lithium deficiency in the brain. Think \"scurvy\". \nSlide 1 >\
    \ they analyzed the concentrations of 27 different elements in the brain, for\
    \ normal versus mentally-impaired older people. They found a huge loss of lithium\
    \ in MCI or AD patients.\nSlide 2 > they found that lithium carbonate as an inorganic\
    \ salt is NOT delivered well to increase lithium in a mouse model. Instead we\
    \ need to take an organic salt of lithium, such as lithium orotate, which is already\
    \ sold widely as a \"Mood Regulator\" at 5 to 20 mg daily.\nSlide 3 > they found\
    \ that a deficiency of lithium induces high levels of a protein kinase called\
    \ GSK-3-beta, which produces plaques or other nasty things in the brain. Adding\
    \ lithium orotate to the drinking water of mice represses GSK-3-beta activity,\
    \ as a possible mechanism for how it works. Good luck to you all.\n\U0001F600"
