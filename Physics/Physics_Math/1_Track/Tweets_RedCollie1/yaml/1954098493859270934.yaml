  text: "TEACHING EXERCISE 2: There is a close analogy between the sideways \"Lorentz\
    \ force\" of electromagnetism, and the sideways \"precessional\" motion of a spinning\
    \ gyroscope with downward gravity. \nVideo 1: If we ionize air with 6.6 kV DC\
    \ voltage, then place a ring magnet below, the plus (red) to minus (black) motion\
    \ of oxygen or nitrogen ions (or electrons) turns \"sideways\", when their spins\
    \ become aligned parallel to the north or south poles of that ring magnet. \n\
    This is called the \"Lorentz force\" of electromagnetism. It underlies all electromagnetic\
    \ motors or generators on Earth. \nWhat happens is that a linear force of electricity,\
    \ between plus-red and minus-black wires, gets turned by 90 degrees, when it is\
    \ applied to tiny atoms or particles that are spinning rapidly (like for air blown\
    \ onto a spinning top).\nVideo 2: now let us look to see what happens, when a\
    \ downward force of gravity is applied similarly to a fast-spinning gyroscope?\
    \ \nThat downward force likewise gets turned sideways by 90 degrees, due to rapid\
    \ spin of the gyroscope. \nIn other words, some of the downward force of gravity\
    \ becomes a \"sideways\" precessional force, as shown in the video. \nThis also\
    \ makes the \"heavy\" gyroscope feel \"amazingly light\", because so much of its\
    \ \"weight\" has turned sideways rather than vertical! \nDoes everyone understand?\
    \ RIGHT IN FRONT OF YOUR EYES. Look at one video, then look at the other video.\
    \ 2 + 2 = 4.\nThe failure of our leading physicists to understand such SIMPLE\
    \ concepts makes them believe that \"UFO propulsion violates the laws of physics\"\
    .\U0001F921\U0001F921\U0001F921 \nWell, if they understood videos 1 and 2, then\
