  text: "Regarding the new compound \"lithium orotate\", which has been proposed as\
    \ a preventative to the progress of Alzheimer's Disease, no one will EVER pay\
    \ for a human clinical trial, for two reasons! \nFirstly, the compound is very\
    \ cheap and has no patent (sold on EBay as an anti-anxiety supplement).\nSecondly,\
    \ such a clinical trial would take 10 years and require at least 1000 older people.\n\
    Thus there would be great financial loss, even if successful.\nIn China they have\
    \ a different philosophy of medicine, than in corporate USA. If doctors see that\
    \ some nearly-harmless compound is working in their patients, they will start\
    \ with small, safe doses and work their way upward. Then they may or may not find\
    \ a \"trust consensus\" that the compound (or herbal product) works.\nYou may\
    \ \"scorn\" such an informal methodology out of cultural arrogance. But please\
    \ recall how all of those dangerous, poisonous Covid vaccines were found \"safe\
    \ and effective\" by Pzifer or Astra Zeneca clinical trials?\U0001F921\U0001F921\
    \U0001F921\nMeanwhile the Chinese people made traditional vaccines against Covid,\
    \ which did not harm anyone directly. Of similar efficacy. \nThey could never\
    \ have \"made\" the final Covid virus without direction and funding by US tax\
    \ dollars. \nFauci and his friends sent both money and cloned parts of Covid to\
    \ them from the USA (they did not have the skills to do such clever molecular\
    \ designs themselves). \nIn summary, we should respect and use ALL kinds of medicine\
    \ for human health, and not be brainwashed by TV or big pharma, into thinking\
    \ that \"only the US way is right\". \nThat just makes medicine more and more\
    \ expensive, with relatively little benefit, because clinical trials paid for\
    \ by Big Pharma are \"TOO BIG TO FAIL\". \nThey produce only \"positive results\"\
    . Don't you remember all of the vaccine b.s. you heard in 2021?\n\"Lies, damned\
    \ lies, and clinical trials\"\U0001F605\U0001F602\U0001F923"
