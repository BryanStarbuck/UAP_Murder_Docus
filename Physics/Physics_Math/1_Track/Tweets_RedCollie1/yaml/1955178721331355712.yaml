    \ show a six-armed \"magnetic space propellor from 2016, followed in \"almost\"\
    \ the same field location, by a \"spinning magnet\" in 2019.\nYet those two crop\
    \ pictures were intentionally offset from one  another slightly, as you can tell\
    \ by comparing the location of a small, red-black circle in slide 3 (2016) versus\
    \ slide 4 (2019)? \nThree-year delta, while they spin that space-propeller magnet\
    \ using 3-phase power! You gotta love those E.T. technical engineers up in space.\
    \ Every detail has scientific meaning. \nTomorrow I will take some videos of ON-AXIS\
