  text: "WE HAVE TO WONDER ABOUT THIS FAMOUS PROPHECY FROM THE BOOK OF DANIEL. IF\
    \ YOU DO NOT KNOW OF IT, PLEASE READ ON: \n\"Finally there will be a fourth kingdom,\
    \ strong as iron. Just as you saw that the feet and toes of that statue were made\
    \ partly of clay, and partly of iron, so it will be a divided kingdom, partly\
    \ strong and partly brittle. \nThe people will be a mixture, and will not remain\
    \ united, any more than iron can mix with clay. \n(Comment: look at England and\
    \ Europe today!) \nIn the time of those kings, the God of heaven will set up a\
    \ new kingdom that will never be destroyed. It will crush all of those past kingdoms,\
    \ and bring them to an end, yet will itself endure forever. \nThis is the meaning\
    \ of your vision of a \"ROCK cut out of a MOUNTAIN, but NOT by human hands\".\
    \ \nThat huge \"rock\" will brake the older iron, bronze, clay, silver and gold\
    \ kingdoms into pieces. \nGod has shown the King what will take place in the distant\
    \ future. The dream is true, and my interpretation is trustworthy.\""
