  text: "Slide 1 shows a brief summary of the experimental findings by Eric Laithwaite\
    \ (1974) on gyroscopic spin, precession, downward gravity and \"anti-gravity\"\
    .\nVideos 2 and 3 show such effects so clearly, that even a high-school student\
    \ can understand.\nSlide 4 summarizes another video shown elsewhere on this page.\
    \ \nWhy did the Cambridge academics revile Eric Laithwaite for such clear, obvious\
    \ findings? \nWhy did biologists in the 19th century ignore Gregor Mendel?\nWhy\
    \ did geologists ridicule Alfred Wegener in the 1950s, before Fred Vine?\nWhy\
    \ did medical doctors ridicule Ignaz Semmelweis in the 19th century, even when\
    \ many women were dying of infections during childbirth?\nWhat is \"dogmatism\"\
    ? \nEric Laithwaite's work did not solve the problem of UFO levitation per se,\
    \ but it did draw our attention to some interesting physical correlations!\nI\
    \ only learned about this subject, after many dozens of \"instructional physics\"\
    \ crop pictures were drawn to bring it to our attention, from 1991 to 2024. \n\
    So I am working to find the solution, and build a small working model, in my private\
    \ lab at my own expense.\nThe blind will see, while those who believe they can\
    \ already see, will remain blind. \U0001F6F8\nModern physics is burying itself\
    \ in a deep grave, from which its textbook theories (which deny the existence\
    \ of UFOs) will never recover.\U0001F600"
