  text: "This video from Eric Laithwaite 1974 shows that we can have \"anti-gravity\"\
    \ effects produced by a spinning gyroscope, without there being any \"overall\
    \ change of weight\" on a scale (or table) below. \n\"Weight\" is just a downward\
    \ acceleration, due to Earth's normal field of planetary gravity. \nThis experiment\
    \ showed that spinning gyroscopes may not accelerate down toward the ground at\
    \ all, compared with a non-spinning mass, on the other end of a rod! \nPut in\
    \ another way, the \"spacetime curvature\" associated with normal gravity (by\
    \ Einstein's theory) seems to have almost NO EFFECT on a fast-spinning gyroscope.\
    \ \nPerhaps because its fast-spinning disc creates large changes of inertia, which\
    \ insulate that gyroscope from \"normal\" spacetime curvature?\nEXPAND YOUR THINKING.\
    \ We should study this subject more, not only for greater clarity as to how Einstein's\
    \ theory works, but also because it may relate to alien UFO physics.\U0001F6F8"
