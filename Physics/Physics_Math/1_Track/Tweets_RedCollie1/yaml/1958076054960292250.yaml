  text: "Ross Coulthart just did an episode on multiple UFO contacts at a nuclear-weapons\
    \ storage-base near Rendlesham Forest in 1980.\nHe did not mention its close relation\
    \ to another UFO contact near Wadley, Georgia, 35 years later in 2015. \nBoth\
    \ kinds of craft showed similar \"hieroglyphics\" on their sides. \nIn both cases,\
    \ a long, telepathic, binary (2-symbol) or quatenary (4-symbol) code was given\
    \ to a US military man (Jim Penniston in 1980, or \"CJ\" in 2015). \nThe 1980\
    \ code began with \"Exploration of Humanity\".\nThe 2015 code began with \"Continuous\
    \ Protection of Humanity\".\nThe 1980 code said they had come back in time from\
    \ the \"year 8100\", apparently from near Woodbridge in a mirror-Universe.\nThe\
    \ 2015 code said they had come back in time from a base located in Nuremberg,\
    \ Germany, sometime in the distant future (think \"1561\"). \nThe 2015 code also\
    \ warned us that EBENs (enemy grey aliens) had just sent a space-vessel THREAT\
    \ toward Earth. \nNow, ten years later, we see 3I/2025 headed for our inner solar\
    \ system at 130,000 mph. \nOne might guess, therefore, that it could perhaps be\
    \ the THREAT sent toward Earth by enemy grey aliens?\nBut what would a simple\
    \ collie dog know?\U0001F436\nhttps://t.co/HrYy4oWeD9"
