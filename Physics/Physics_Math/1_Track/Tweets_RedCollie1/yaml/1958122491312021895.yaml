note_tweet:
  text: "Let me explain please, in very simple terms, why the precise orbit of 3I/ATLAS\
    \ seems so SUSPICIOUS? \nIf an alien civilization sent a very-fast, large rock\
    \ directly toward Earth, we would try to blow it up using rocket-transported nuclear\
    \ weapons (100's of them).\nYet if they sent a very-fast, large-rock just past\
    \ Mars, to the opposite side of our Sun, we would not be able to do anything,\
    \ even make fly-by photographs.\nFurthermore, if they sent a very-fast, large-rock\
    \ to the opposite side of our Sun, in a direction OPPOSITE to Earth's orbit around\
    \ the Sun, yet in the same 2-D plane, then they would just have to \"brake\" that\
    \ large rock (or any associated spacecraft) to HALF of its (their) incoming speed,\
    \ to meet planet Earth HEAD-ON in 3 months, with no further use of fuel.\nThus\
    \ if we do see a large, alien spacecraft headed our way, we will have very little\
    \ time to respond. Maybe a few weeks. \nI guess this could all be a \"coincidence\"\
    , if thousands of very-fast, large-rocks were seen flying through our inner solar\
    \ system? One in a THOUSAND might show the same kind of \"suspicious\" orbit by\
    \ random chance.\nBut if you were playing poker, you would bet the other way.\
    \ A long-standing LIE that \"aliens do not exist\" has made it impossible for\
    \ most people to assess the scientific probabilities accurately. \nIf you were\
    \ certain (like me) that enemy aliens really do exist, and that they pose a near-future\
    \ threat to Earth, what would you think then? \nAs an aside, maybe ask Jeremy\
    \ why he made that debunking video? In poker, it would be called a \"tell\".\n\
    Let's see what happens next. \U0001F47D"
