  text: "Something to consider: if you were an alien race, wishing to make a serious\
    \ attempt at colonizing a new solar system, you would come in a really big ship\
    \ or asteroid, from which you could take off, return, land and refuel, just like\
    \ we send aircraft carriers all around the world. \nFirst close approach will\
    \ be to Mars, then the Sun, then to Jupiter and its moons. Small spaceships may\
    \ travel more widely, then return to refuel. \nThey will be able to make exploratory\
    \ missions to Earth, once they get close, if this scenario turns out to be true."
