  text: "Now that we know for certain that the guys at JWST added \"fake pixelation\"\
    \ to their August 6 image of 3I/ATLAS, the question becomes: what were they trying\
    \ to COVER UP? I can see two possibilities. \nFirstly, the central core of 3I/ATLAS\
    \ might be much larger than we currently imagine, perhaps 200 km?\nSecondly, the\
    \ central core of 3I/ATLAS might be emitting its own light, as Avi Loeb has suggested.\n\
    Two slides below show the new JWST image of 3I/ATLAS with their \"fake pixelation\"\
    \ removed (thanks to M.D.) \nSlide 1 shows their published image, while slide\
    \ 2 showed its inverted form. \nThe resolution of both images is unfortunately\
    \ low, since JWST have not released any images with high resolution. \nBut what\
    \ do you think they were trying to cover up?\nTwo possible ideas were mentioned\
    \ above. \nThe SPHERE-X image of 3I/ATLAS is shown in the header for this page,\
    \ if you wish to compare. Please feel free to comment politely and reasonably."
