  text: "Now we can see a faint \"tail\" for 3I/ATLAS, but only at long visible wavelengths\
    \ of \"red\" rather than \"blue\". \nJust as we see \"red\" sunrises or sunsets\
    \ on Earth, after the \"blue\" part of normal sunlight gets scattered away, by\
    \ its long distance of travel through DUST in our atmosphere.\nIn a similar fashion,\
    \ if we study the bright, round 3I/ATLAS at \"blue\" wavelengths (slide 1), we\
    \ cannot see any \"tail\". That is because any sunlight reflected from its long\
    \ \"tail\" of DUST gets scattered away from us, if it is \"blue\". \nYet if study\
    \ 3I/ATLAS at \"green\" or \"red\" wavelengths (slides 2, 3, 4), then we can see\
    \ a \"tail\", because \"green\" or \"red\" sunlight can be reflected from the\
    \ dust in that long \"tail\" and still be seen on Earth, with not as much \"scattering\"\
    . \nThus this strange object seems to be loosing small particles of DUST, as it\
    \ approaches the heat of our Sun. The \"tail\" appears \"green\" or \"red\" rather\
    \ than \"blue\", because it scatters blue light so strongly. \nhttps://t.co/0IgXkegiLp"
