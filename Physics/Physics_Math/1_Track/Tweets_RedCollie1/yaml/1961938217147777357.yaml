note_tweet:
  text: '3I/ATLAS seems to resemble Phobos, which is the larger of two Martian moons
    (diameter 22 km).

    Whatever you might believe, it is VERY ODD that an unknown object, the size of
    a Martian moon, is passing Mars, then behind the Sun (as seen from Earth), then
    onto Jupiter, where it could easily become "captured" as a new moon orbiting Jupiter,
    or else return to our inner solar system.

    How often might this happen? What are the odds?'
