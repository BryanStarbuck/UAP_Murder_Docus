  text: "This alien UFO-drone, which was photographed over Canada in January 2025,\
    \ shows the basic working-parts of an anti-gravity device.\nAs shown in video\
    \ 1, it has a magnetic flywheel which SPINS very quickly to hold it up.\nAs shown\
    \ in slide 2, it has three small \"balls\" on each end, which are 60-degree staggered\
    \ relative to one another. Those are almost certainly two sets of 3-phase wire\
    \ coils.\nAs shown in a slide 3, a big flat disc (or magnetic flywheel) spins\
    \ BETWEEN those two sets of wire coils.\nAs shown in slide 4, it looks like a\
    \ classic \"UFO\"! \nI can build a model with two sets of 3-phase wire coils,\
    \ so as to make that central flywheel spin very rapidly, but can't seem to generate\
    \ an anti-gravity force (yet).\nIt is easy to get increased gravitational \"potential\"\
    \ energy, but not decreased total-weight on a scale (unless the central spinning\
    \ flywheel goes into \"free fall\".\nFurthermore, I have collected half-a-dozen\
    \ examples of the same, non-Earthly physics. Another is shown in the first comment\
    \ below. But have yet to make a \"real UFO\"!\nMaybe there is something I am missing,\
    \ and do not know.\U0001F6F8Dozens of ET-made crop pictures show almost the SAME\
    \ kind of anti-gravity physics. \nWhat a farce all of those \"UFO groups\" and\
    \ \"UFO hearings before Congress\" have turned out to be! \nIt does feel like\
    \ \"Planet of the Apes\" sometimes.\U0001F921\nRIGHT IN FRONT OF YOUR EYES. \n\
    This great problem is there to be solved."
