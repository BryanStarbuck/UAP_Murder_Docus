  text: "Here we have three, 3-phase wire coils and spinning 60 mm magnet with a 20\
    \ mm hole. \nThe upward force seems very great, yet a nearly equal downward force\
    \ prevents any large loss of weight on a scale. \nWe do see a slight loss of total\
    \ weight by HALF the weight of the magnet (about 20 grams), because it goes into\
    \ \"free fall\" for HALF of the time.\nThus gravitational potential energy, created\
    \ by 3-phase spin, gets converted to downward kinetic energy. Still we have not\
    \ made a \"real UFO\"!"
