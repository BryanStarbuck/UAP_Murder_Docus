  text: "IMPORTANT TEACHING EXERCISE!\nUFOs fly by means of a \"helical\" magnetic\
    \ field.\nThis is not described in physics textbooks or journals anywhere, although\
    \ I have done hundreds of experiments to demonstrate the general principle.\n\
    For example, I show a new and simple lab video in movie 1. You may compare this\
    \ to the eyewitness account of a nearly-landed UFO in Canada 1974 (movie 2). \n\
    That \"helical\" magnetic field works the same with either North or South poles\
    \ \"up\" for a central spinning magnet, which RISES like a spinning top or gyroscope.\n\
    It works equally well for clockwise or anti-clockwise 3-phase magnetic fields,\
    \ but will collapse, if we switch the field quickly from clockwise to anti-clockwise,\
    \ or vice-versa.\nFurthermore, the quick rise of a spinning magnet by a \"helical\"\
    \ magnetic field creates no \"downward\" counter-reaction by Newton's 3rd Law.\
    \ If the upward reaction force is clockwise, then the downward counter-reaction\
    \ force will be anti-clockwise, or vice-versa.\nIn order words, the quick rise\
    \ of a spinning magnet creates almost no increase of downward force-weight on\
    \ a scale placed below, but instead creates a sideways counter-torque, as it leads\
    \ to an increase of gravitational \"potential\" energy. \nYou can see that sideways\
    \ counter-torque clearly and easily in video 2, for the illustration of a real\
    \ UFO from Canada 1974. Edwin Fuhr saw that UFO disc spin one way, while grass\
    \ below spun the other way. \nFurther studies may lead to a better understanding\
    \ of UFO levitation. There seems to be no other path to follow.\U0001F6F8"
