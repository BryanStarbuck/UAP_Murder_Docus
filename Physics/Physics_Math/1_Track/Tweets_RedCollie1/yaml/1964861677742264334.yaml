note_tweet:
  text: 'More physics drawn in crops our friendly alien friends!

    The "Faraday disc" or "homopolar motor" works by a right-hand rule (also called
    the "Lorentz force").

    When we try to push current electrons from in-to-out (or vice-versa) through a
    N-S magnetic field, their spin motions become aligned which that field so as to
    create an "induced electromagnet".

    Why does it turn sideways? Because when we apply a sideways force to a fast-spinning
    electron using a plus/minus electrical field, that electron will turn sideways
    by a spiral motion, rather than going straight.

    Hence those current electrons create an induced magnetic field, in the same sense
    as a nearby permanent magnet'
