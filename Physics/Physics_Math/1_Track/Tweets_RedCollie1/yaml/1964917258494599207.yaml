  text: "In a final post today, I will explain the physics behind a potentially new\
    \ way to get non-Newtonian forces for UFO levitation.\nMovie 1 shows how spin\
    \ angular momentum is usually conserved in most physical systems. If you spin\
    \ a \"wheel\" one way, then a \"boat\" spins the other way.\nMovie 2 shows how\
    \ the Lorentz force of electromagnetism seems to be an exception to this general\
    \ rule. A large magnet and small wires spin in opposite directions, when electric\
    \ current is added. Yet the large magnet is MUCH heavier than those small wires!\
    \ Still they spin at approximately the same speed in opposite directions.\nMovie\
    \ 3 shows how that same Lorentz force of electromagnetism can make liquid mercury\
    \ spin in an aluminum bowl, when DC current is added. We can see forward spinning\
    \ motion, but no reverse counter-spinning motion, like for the \"kick\" of a shotgun.\
    \ \nThis may be because the Lorentz force comes about, after an inward or outward\
    \ electrical force curves 90 degrees, due the underlying spin of an electron.\
    \ Any 3rd Law reactive force would therefore point in some non-spinning direction,\
    \ and become undetectable. \nSuch a non-Newtonian force would be a pre-requisite\
    \ in any model of UFO-style propulsion. Still, for the examples shown in movies\
    \ 2 and 3, the conductor only spins in a plane, and does not go upward!\nTo make\
    \ such a non-Newtonian force GO UPWARD, could we use 3-phase power to create a\
    \ \"helical\" magnetic field? \nWhen the induced magnetic field of that mercury\
    \ vortex gets acted upon by a 3-phase magnetic field, the Lorentz force might\
    \ begin to follow an upward 3-D \"helix\", rather than a 2-D \"plane\". \nI will\
    \ test this interesting and plausible hypothesis soon. Others can also test if\
    \ they wish. This exception to Newton's 3rd Law seems wide enough to \"drive a\
    \ truck through\". TO THE STARS! \U0001F6F8"
