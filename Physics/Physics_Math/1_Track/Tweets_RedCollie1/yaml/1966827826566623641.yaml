  text: "Some people are asking about my anti-gravity research, so I will show you\
    \ the current state of progress.\nThe E.T. guys who make \"crop pictures\" show\
    \ us many \"instructional\" diagrams from physics, that try to tell us how UFOs\
    \ fly.\nSlide 1 below shows a conventional \"homopolar motor\" with \"brushes\"\
    . \nSlide 2 shows a crop-drawn \"homopolar motor\" with \"brushes\", or moving\
    \ electrical contacts. \nMovie 3 shows one of my recent lab experiments, where\
    \ I made a \"liquid-metal\" homopolar motor using galinstan. \nIt works fine,\
    \ but can only stay connected to a 12-volt battery for 5 to 10 seconds, because\
    \ the connecting wires get VERY HOT! \nGalinstan has almost no \"electrical resistance\"\
    , so I will have to add an 0.1 ohm resistor, which can take very high currents\
    \ and temperatures, to solve this problem! \nMy plan is to use nichrome wire.\
    \ We will see how it goes?\nSlide 4 shows a crop-drawn \"homopolar motor\" with\
    \ \"brushes\", that rises up into the air, when we add 3-phase magnetism (\"trident\"\
    \ shape).\nThe nearby landscape, and several other related crop pictures, show\
    \ that they are describing \"UFO levitation\".\nOnce I solve the heating-problem\
    \ shown in movie 3, I will test their \"UFO physics\" diagram shown in slide 4.\
    \ \nThe spin of homopolar motor does not follow Newton's 3rd law, since it is\
    \ powered by a \"sideways\" Lorentz force. \nThus if we can make that spin-motion\
    \ move slightly \"upward\", it may generate an upward force, without any cancelling\
    \ downward force.\U0001F6F8"
