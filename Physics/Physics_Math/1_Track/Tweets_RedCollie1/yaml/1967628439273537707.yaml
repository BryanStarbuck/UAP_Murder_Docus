  text: "Eya Enki drew this great \"curved DNA\" crop picture in England 2002, just\
    \ before I went to Cambridge, and gave a seminar on the same subject, with almost\
    \ the same slide. \nI was staying in the home of a female colleague who first\
    \ grew crystals of such curved DNA. It was on the cover of Nature magazine. She\
    \ knows that it was not made using \"rope and boards\".\nIn the landscape nearby,\
    \ we can see three \"letters\" that resemble \"e\", \"y\" and \"a\" for \"eya\"\
    \ Enki. \nThere were carvings of a DNA double helix at his temple in Babylon.\
    \ \nBy finding a special landscape location, showing his first name \"eya\", he\
    \ was being friendly and not domineering. \n\"I am the one called Eya\" he told\
    \ Moses. \"That is the name by which I wish to be remembered from generation to\
    \ generation\". \nIn the last days, we were promised \"signs on the Earth\". Here\
    \ they are. Those with eyes to see, will see.✝️"
