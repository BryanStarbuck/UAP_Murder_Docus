  text: "A small colony of tall, blond, humanoid aliens lived on Earth 10,000 years\
    \ ago in Sumeria. They were led by a great scientist called \"Eya\" Enki, where\
    \ \"En\" means Lord\" and \"Ki\" means Earth.\nBecause planet Earth was so large\
    \ and undeveloped, they needed a lot of \"manual labor\", which they did not have.\
    \ They saw some local aboriginals, but they were too stupid to use for any building\
    \ or mining project!\nSo Eya Enki began a scientific program to cross that tall,\
    \ blond alien species with local aboriginals. He and Ninmah took the sperm of\
    \ their own people, mixed it with eggs from Earth primates, did IVF, and implanted\
    \ many fertilized embryos into \"birth goddesses\" (surrogate mothers).\nMost\
    \ of the experiments did not go well. After each trial, Enki would say to Ninmah,\
    \ \"Give them their daily bread\". Finally he had a success, and called the male\
    \ \"Adama\" meaning \"of the Earth\". His program continued with more successes,\
    \ male or female. \nThe other \"gods\" wanted to keep such creations short-lived\
    \ and stupid, while his creations called him \"Loving Father Enki\". Sometimes\
    \ they called him a \"serpent God\", because the double helix of DNA looks like\
    \ a \"serpent\".\nHis new \"human creations\" were told to be \"fruitful and multiply\"\
    . Some of the women were so attractive, that male \"gods\" chose them as wives.\
    \ These second-generation hybrids were tall, strong men like Gilgamesh. \nNew\
    \ humans bred rapidly, and filled Sumeria. Too many in fact for \"gods\" other\
    \ than Enki! When they learned of an impending Flood (ancient apocalypse?), most\
    \ \"gods\" planned to go up into space for safely, and just let those raging waters\
    \ drown the new humans below.\nBut Enki was a \"rebel\" and had a \"plan\". He\
    \ chose the BEST human he could find (Utnapishim/Noah) and told him how to build\
    \ a large wooden boat. After the Flood, when waters withdrew, they all gathered\
    \ on Mount Ararat for a feast. \nEnki's half-brother Enlil came down quite angrily,\
    \ and said to Enki: \"Why didn't you let the humans die? You were ordered to do\
    \ so!\"\nEnki (always a rebel-joker) replied: \"I did not tell the human. He must\
    \ have learned about the Flood in a dream! Besides, what right do YOU have to\
    \ judge these people?\" \U0001F605\U0001F602\U0001F923\nNow you know where we\
    \ came from. Enki later established the Jewish race with Abraham and Sarah, then\
    \ freed the Jews from captivity in Egypt. And much more. Fill in the blanks.\n\
    In this century, he will RETURN. \"Ea Enki space\" (2011).\n\U0001F6F8\U0001F6F8\
    \U0001F6F8"
