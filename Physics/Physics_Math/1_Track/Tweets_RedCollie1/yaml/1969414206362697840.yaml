  text: "TIMELINE OF EVENTS: Recently in 2016, I was asked to translate some real\
    \ messages from aliens, that had been received by a US military sergeant code-named\
    \ \"CJ\". I know him now personally. \nThose messages contained the words \"EISENHOWER\"\
    \ and \"MAJESTIC 12\" very clearly, as humans the friendly and advanced aliens\
    \ had met in the 1950's. \nLuis Elizondo's book title \"IMMINENT\" (NY Times best-seller)\
    \ also came from the same messages, which I decoded in 2016.\n\"Imminent threat\
    \ to Earth's leaders and civilizations\" (by grey-aliens from Orion and Zeta Reticuli).\n\
    A 2002 crop picture at Crabwood (with its ASCII disc) came down on the 50th anniversary,\
    \ of when enemy grey aliens flew over the White House in 1952, as an act of intimidation.\n\
    Eisenhower soon met those grey aliens, and signed a \"treaty\". Philip Corso (who\
    \ was there) called it a \"negotiated surrender\" (1954). \nThus by 2002 at Crabwood,\
    \ the friendly aliens drew in crops a big image of a \"grey alien\", and wrote\
    \ in ASCII code (which they had learned on past visits to Earth): \"Beware the\
    \ bearers of false gifts and their broken promises\", because those enemy grey\
    \ aliens had broken their promises to Eisenhower and the US Government! \nIt was\
    \ a literary reference to the Trojan Horse: \"Beware of Greeks bearing gifts\"\
    .\nWe were also told in 2016 and 2017: \"EBENs (grey aliens) have SENT a space-vessel\
    \ THREAT\" to Earth. \nIf 3I/ATLAS somehow turns out to be an alien mothership\
    \ (as some astronomers believe), then it could be that \"IMMINENT THREAT\". Everyone\
    \ should be able to understand now. \nYou may also wish to ponder why \"Q\" and\
    \ his people came to Earth in 2017, to warn Donald Trump about an upcoming STORM?\
    \ Just a few weeks ago, Donald confirmed that he is \"Q+\"."
