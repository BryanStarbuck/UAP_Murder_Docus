  text: "CROP-CIRCLE PSIONICS: The apparent precognition of a two-part crop picture\
    \ from 2014 by a lucid dream.\nOne of my wife's close friends told me on August\
    \ 23, 2014, that she had “seen” a new crop-circle in her dreams. She drew it down\
    \ on a sheet of paper, and told me about it excitedly! \nI did not know what to\
    \ think. So I was just very polite, and kept a copy of her “dream image” in my\
    \ files for possible future reference,\nToday on September 23, 2025, while doing\
    \ a search for crop-circle images from 2014, I noticed a REAL crop circle at Ark\
    \ Lane, that had appeared (in two phases) on August 29 then September 3, 2014.\n\
    It is a GOOD MATCH to her prior “dream image”, although not perfect (see below)!\
    \  \nHer “dream image” has the quality of a typical image, that might be counted\
    \ as a success in “remote viewing”. \nWhen dealing with these mysterious “crop\
    \ artists”, we often see indications that they possess psychic abilities beyond\
    \ normal space and time. \nUFOlogists now call such phenomena “psionics”.\U0001F6F8"
