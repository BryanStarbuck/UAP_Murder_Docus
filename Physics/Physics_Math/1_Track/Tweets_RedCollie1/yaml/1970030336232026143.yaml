  text: "PHYSICS QUESTION FOR ANY \"GENIUSES\" OUT THERE!\nSuppose we have a big wire\
    \ coil, with a large empty space in its center, and give it AC power at 50 Hertz.\
    \ \nNext, let us place an aluminum disc (60-80 mm diameter, 6 mm thick) in the\
    \ center of that wire coil on a 5-6 mm pole.\nWhen we turn on the AC power, that\
    \ aluminum disc will RISE UP out of the empty center by Lenz repulsion. Because\
    \ an induced magnetic field, in the aluminum disc, repels a direct AC magnetic\
    \ field from the wire coil below. \nNEXT, let us place three other wire coils\
    \ below that large AC wire coil, and give them 3-phase AC power. Under such circumstances,\
    \ if we place a permanent magnet on the 5 mm pole, it will spin and rise due to\
    \ 3-phase magnetism (in the SAME direction, whether North-up or South-up).\nBut\
    \ how will 3-phase power affect the aluminum disc, which has an induced magnetic\
    \ field due to Lenz repulsion?\nWhen the AC power from that large wire coil is\
    \ turned off, the aluminum disc hardly moves, because it has no induced magnetic\
    \ field, to couple with a 3-phase field below.\nBut what happens when AC power\
    \ is turned on, and the aluminum disc rises by Lenz repulsion? Will it spin in\
    \ the SAME direction (say clockwise) as the 3-phase field, or will it spin in\
    \ an OPPOSITE direction?\nI will show the lab results soon. Meanwhile, let's see\
    \ what the \"physics geniuses\" have to say? \nGo ahead, ask Grok, let's test\
    \ its abilities to do any more than memorize. \U0001F600\U0001F6F8\nExperiment\
    \ is our only true guide, not \"experts\" or \"A.I.\" Not textbooks. That truth\
    \ will soon become clear."
