    Third, many crop pictures are drawn near ancient megalithic sites, of which the
    unknown artists seem to have first-hand knowledge.

    Fourth, a rock was found in New Mexico, carved thousands of years ago, which matches
    precisely a crop circle from England 1996.

    Fifth, three images made of gold, silver and bronze were found by a metal detector
    under a crop circle from Germany 1991, which matched the new crop circle image,
    despite have been buried there for thousand of years.

    Incidentally, many images on the Buga orb match modern crop circles.

    Taken collectively, it would seem that some ancient civilization on Earth may
