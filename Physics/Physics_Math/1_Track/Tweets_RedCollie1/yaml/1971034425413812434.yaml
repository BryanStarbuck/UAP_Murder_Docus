note_tweet:
  text: 'When studying how the Buga orb-sphere flies, we know there is a 5-phase AC
    magnetic field outside, which makes "something" inside a big red ball SPIN. I
    wish we knew exactly what is inside, but we don''t!

    As a step towards solving that problem, I have placed a permanent disc magnet
    in a pool of liquid-metal "galinstan", then added DC power from a small storage
    battery at 12 volts, 50 amps.

    The liquid-metal spins nicely with added DC power, while that permanent magnet
    would spin nicely with 3-phase power, as I have shown in many other experiments.

    It may be that a combination of a permanent magnet and liquid metal is needed
    to make it fly?

    The fast spin of that liquid metal does not follow Newton''s 3rd Law, so if we
    could direct its "Lorentz force" upward, then we would have "anti-gravity".

    I will work more on this important subject soon. 🛸'
