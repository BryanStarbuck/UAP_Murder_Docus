  text: "TEACHING LESSON: HOW TO UNDERSTAND CROP-CIRCLE PHYSICS (as it relates to\
    \ UFOs) \nThere were a series of crop pictures beginning in August 1998, then\
    \ extending through May 1999, which tried to teach us how their UFOs fly through\
    \ space.\nHere I will show just two pics from May 1999, which are incredibly straightforward\
    \ in their interpretation as \"electromagnetic physics\".\nSlide 1 shows how current\
    \ flows outward in a pool of liquid metal (say mercury or gallium), between a\
    \ large central electrode (DC minus), and many small outer electrodes (each DC\
    \ plus). So far, we have not added any N/S magnetism.\nSlide 2 shows the SAME\
    \ THING, except with a large disc magnet (black) placed inside, to provide both\
    \ a DC-minus electrode, and also an N/S magnetic field. Each of those little-curvy-lines\
    \ are \"homopolar brushes\" (as drawn in other crop pics of homopolar motors).\
    \ \nFinally, video 3 shows exactly the SAME THING as slide 2, except in my lab,\
    \ rather than in a field somewhere!\nThese simple interpretations seem indisputable\
    \ for anyone skilled in the art, and they establish that a spinning, liquid-metal\
    \ vortex (with N/S magnetism) is the first necessary step to create UFO levitation.\
    \ I hope everyone understands? \nThe second step involves adding 3-phase magnetism\
    \ to that large, central black disc. I am trying to find the best model design,\
    \ to test that hypothesis efficiently. \U0001F6F8"
