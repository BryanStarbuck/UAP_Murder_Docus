  text: "FOR PEOPLE INTERESTED IN UFO PHYSICS:\nTwo other crop pictures from the same\
    \ series were drawn earlier in August 1998.\nOne on the left shows a \"big black\
    \ magnet\", sitting inside a ring of 6 \"DC electrodes\", with 3 three-phase \"\
    wire coils\" below.\nOne on the right shows a \"big black pool of liquid-metal\"\
    , surrounded by 16 \"DC electrodes\" at the bottom, again with 3 three-phase \"\
    wire coils\" below. \nWe can see the \"large head\" of a \"slanty-eyed alien\"\
    \ just above, telling us how ro do this, with two \"antennae\" on its head! \U0001F605\
    \U0001F602\U0001F923\nNear the top we can see 3 large \"three-phase wire coils\"\
    , with a \"N-S magnet\" that can spin above them.\nThe suggestion is that \"spinning\
    \ a magnet\" with 3-phase power, up and out of a pool of spinning liquid metal\
    \ (turning by the Lorentz force), may create \"anti-gravity\".\nThink of a \"\
    magnetic propellor\" which turns as if space were made of water? \nThe spin of\
    \ that magnet, counter to the spin of liquid-metal by which it is surrounded,\
    \ apparently creates an upward force, while not pushing the spinning, liquid metal\
    \ downward by Newton's 3rd Law. \nQuite an interesting hypothesis! And in good\
    \ agreement with a close-up study of a real UFO by Edwin Fuhr in Canada 1974,\
    \ when he also saw counter-spin (video 3).\U0001F6F8"
