  text: "I was there when a magnificent crop picture, shown in slide 1 at lower left,\
    \ came down on July 7, 2011 under Milk Hill. \nWe first saw it from a distance\
    \ near Honey Street, then soon saw it up close. Each curved-line was incredibly\
    \ sharp and precise, as if cut by a laser. \nOne day later, there was a torrential\
    \ storm of rain and wind. We drove up the side of Milk Hill, and eventually reached\
    \ the top, where 60 mph gales were blowing! We took photos of its new, \"counter-spinning\"\
    \ center, then came down as soon as possible. \nThat crop picture was the fourth\
    \ of a series in June/July 2011, meant to teach us UFO physics.\nLooking again\
    \ at slide 1, lower left, we can see a \"round disc magnet\" within a \"spinning\
    \ vortex of liquid metal\", as I showed in a recent lab video. \nThen in slide\
    \ 1, upper left, that \"round disc magnet\" seems to spin in the opposite direction,\
    \ to help a UFO \"lift up\". What might this mean in terms of physics? \nLet us\
    \ study next video 2 from The Action Lab. There we can see that \"counter-spin\"\
    \ is needed to conserve angular momentum, when there is an increase of \"spin\"\
    .\nHow might this relate to UFOs? As shown in video 3, Edwin Fuhr in Canada 1974\
    \ saw several small UFOs  close-up, hovering just above the ground. The metal\
    \ UFO was spinning one way, while flattened grass below was spinning the other\
    \ way! \nThus real UFO physics seems to require BOTH \"spin\" and \"counter spin\"\
    . \nSo far I have only been showing you \"spin\". Now I will try to include BOTH\
    \ \"spin\" and \"counter-spin\" in the same device, to create anti-gravity levitation\
    \ on a small scale. \U0001F6F8\nI hope everyone understands. I have made the concepts\
    \ as simple as possible. In science, you have to know what you are doing. TO THE\
    \ STARS."
