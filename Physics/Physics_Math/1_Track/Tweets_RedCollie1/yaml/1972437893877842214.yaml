  text: "Four UFO-instructional \"crop blueprints\" from 2011.\nI was there with Janet\
    \ and her Dutch tour group. \nSlide 1: a magnetic flywheel at rest.\nSlide 2:\
    \ a magnetic flywheel spinning anti-clockwise.\nIts \"cloverleaf border\" looks\
    \ like Ed Leedskalnin's magnetic flywheel at Coral Castle! \nA cone-shaped \"\
    wire coil\" at the top allowed Ed to collect all of the electricity he needed,\
    \ off the grid.\nSlide 3: that magnetic flywheel (or a disc magnet) \"rises up\"\
    \ when it spins! The numbers drawn there were 3-2-9-5-3 / 6-1 (mirror). They add\
    \ to 22/7 = pi, meaning \"circular spin\". Very clever, n'est ce pas? \nEd carved\
    \ similar \"numbers\" into rock at Coral Castle.\nSlide 4: Phase 1 showed a \"\
    disc magnet\" with something (liquid metal?) flowing anti-clockwise outside. Phase\
    \ 2 showed that central \"disc magnet\" spinning clockwise, after we add 3-phase\
    \ magnetic fields. \nThis \"trick\" may be needed to make a real UFO fly, without\
    \ Newton's 3rd Law coming into effect (please see a new lab-video post below).\n\
    An upward 3-phase spin (clockwise) opposes a downward Lorentz spin (anti-clockwise).\
    \ \nFour days later, two counter-rotating \"pi\" symbols appeared in crops around\
    \ daylight noon not far away (please see the first comment below).\nI had driven\
    \ past that field at 11:30 AM with my wife and her friend, yet no one was there.\
    \ So we went to get some sandwiches for lunch. \nBy 12:00 it had suddenly appeared\
    \ in broad sunny daylight, and was seen by a periodic tourist-flight out of Yatesbury.\
    \ We rushed over at 1:00 PM to see it. \nTo no avail! The angry farmer had cut\
    \ it out very quickly. Bless him. He has the warm, kind spirit of Keir Starmer.\
    \ \nNow go to the first comment please, to see that 5th crop picture of a series,\
    \ and what they were trying to tell us? SLEEPERS AWAKEN! \U0001F6F8"
