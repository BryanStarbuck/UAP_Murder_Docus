  text: "Part 2 on UFO physics! \nFollowing from the previous post (Part 1), if we\
    \ use a fast-rotating magnetic field to make a permanent magnet spin rapidly and\
    \ \"rise up\" (like in a UFO), we do not see any change of total weight on a scale\
    \ below (movie 1).\nThe reason is shown in movie 2. There we can see that any\
    \ increase of spin angular motion (say by a small spinning magnet) creates an\
    \ equal and opposite spin in the \"boat\" to which it is attached (or to those\
    \ three wire coils placed below in movie 1). \nIf we place those three wire coils\
    \ on a \"Lazy Susan\" (not shown), we can see them turning in a direction opposite\
    \ to that of the fast-spinning magnet.\nHence there no change of total weight\
    \ on a scale, even through the spinning magnet RISES FORCEFULLY, by pushing against\
    \ a vacuum of space. \nThe key to understanding UFO levitation is therefore to\
    \ find some way to keep that fast-spinning magnet from creating action-reaction\
    \ with the rest of the device, through a need for conservation of spin angular\
    \ momentum. \nThat is what I am working on now, using liquid metal which can spin\
    \ by a DC Lorentz force! \nSpin by a Lorentz force does not create action-reaction\
    \ by Newton's 3rd Law, because its vector of spin lies 90 degrees away from the\
    \ vector of input DC voltage or current. \U0001F6F8"
