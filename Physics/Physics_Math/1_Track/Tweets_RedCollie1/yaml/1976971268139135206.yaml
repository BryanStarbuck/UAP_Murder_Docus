  text: "Some of my lab studies on the way to developing \"UFO levitation\"!\nMovie\
    \ 1: liquid gallium will spin in a rotating magnetic field. \nMovie 2: liquid\
    \ galinstan will spin in a stationary magnetic field, if we add lots of DC current.\n\
    Movie 3: some combination of those two spinning forces may be responsible for\
    \ \"UFO levitation\", especially if they spin in opposite directions.\nI will\
    \ test gravity-weight soon to find out. \U0001F6F8\nMovie 4: Edwin Fuhr in Canada\
    \ 1974 saw a UFO spin in two opposite directions, as just shown. It all makes\
    \ a lot of sense, when you consider the various forces in detail."
