note_tweet:
  text: "Just to remind everyone, Carl Sagan's 1974 radio message out into space was\
    \ replied to by the Emerthers in 2001, directly next to Chilbolton Observatory,\
    \ which is one of the largest radio-telescopes in England.\nThe inability of astronomers\
    \ in 2025 to recognize this highly-detailed \"Arecibo reply\" illustrates their\
    \ over-bearing pride and ignorance. Just like they are responding to Avi Loeb!\n\
    Slide 2 showed \"silicon\" as an \"element of life\", meaning A.I., a subject\
    \ not known in 2001. \nIt also showed two evolutionary forms of DNA (called 2'-5'\
    \ or 3'-5'). What else do you need? \nI would sometimes sit near Carl Sagan in\
    \ the Caltech lunchroom. \nOur astronomers cannot be trusted (for the most part).\
    \ Even Drake got this wrong, because he did not know anything about DNA. Pride\
    \ comes before a fall."
