  text: "Here are my latest lab videos on \"UFO levitation\". I was waiting for certain\
    \ parts to arrive, but now can move forward once again!\nThe central dowel in\
    \ these experiments is only 3 mm in diameter, while \"holes\" in the 40, 50, or\
    \ 60 mm disc magnets tested are a much larger 6 to 8 mm.\nSo the rising force\
    \ that we see is not \"mechanical\", but rather due to a \"spinning gyroscopic\"\
    \ force, that presses against the vacuum of space (as shown previously in other\
    \ videos). \nIn the third video posted here, I show how my new lab device matches\
    \ closely an alien-made crop picture, meant to teach us new physics (along with\
    \ many other examples of a similar kind).\nFinally, I explain what I will do next\
    \ to try and complete the \"great puzzle\" of UFO physics! Theory is useless.\
    \ \nIt has to work in the lab, and be easily reproduced by other skilled scientists\
    \ worldwide. To the stars."
