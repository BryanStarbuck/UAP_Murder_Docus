  text: 'Liquid metal acts as a counterbalance to a fast-spinning magnet in UFO levitation.

    There are two possible ways to wire it up with lots of DC current (shown left
    versus right below).

    In one version, the magnet is immersed in liquid metal.

    In the other version, the magnet spins in a central chamber of its own, while
    liquid metal counter-spins outside in another channel.

    I do not know which way will work better?

    Think "Maury Island 1947". Leak of hot liquid metal.

    Experiment must be our last guide to everything (John Locke).'
