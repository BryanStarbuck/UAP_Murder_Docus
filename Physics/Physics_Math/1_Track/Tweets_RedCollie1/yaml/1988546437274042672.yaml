    ship just above the ocean at a slow 120 mph. The whole ship went on red-alert,
    thinking it might be a weapon sent by Iraq?

    Then when it got fairly close, it shot straight up into the sky at 30,000 mph,
    recorded on radar.

    The entire event was sealed as top-secret.

    Over 100 sailors know.'
