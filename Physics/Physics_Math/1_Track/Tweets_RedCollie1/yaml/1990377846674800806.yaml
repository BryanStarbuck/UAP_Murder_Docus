note_tweet:
  text: "Here is our best photo of 3I/ATLAS to date, taken in New   Mexico on November\
    \ 16.\nI cropped and enlarged the image to see details more clearly, and also\
    \ used \"auto smart fix\" to increase the brightness (slide 1).\nWe can see a\
    \ bright orange \"anti-tail\" on the left, and a long blue \"fluffy\" tail on\
    \ the right.\nTo see its anti-tail more clearly, I decreased the brightness of\
    \ a shining spherical center, and also inverted the entire image (slide 2 as the\
    \ first comment). \nNow we can see its anti-tail as a long \"dark\" jet, extending\
    \ from its spherical center, to just beyond its \"orange\" coma, and leaving a\
    \ cloud of \"dark gas\" out where it meets an oncoming solar wind. \nWe can also\
    \ see four or five faint \"jets\" on the right, as Avi Loeb noted previously,\
    \ in addition to its big fluffy tail.\nTo me, this looks more like an \"alien\
    \ spaceship\" than a \"natural comet\", but YOU decide!"
