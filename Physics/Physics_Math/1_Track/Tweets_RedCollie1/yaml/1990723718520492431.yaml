note_tweet:
  text: "3I/ATLAS: photographed by Efrain Rivera in Puerto Rico on November 17, 2025\
    \ (slide 1). \nLook at the \"color map\" (slide 2).\nIts forward \"anti-tail\"\
    \ is dark brown (or reddish) on the left.\nThe rear part of its spherical center\
    \ is green for nickel ions. Probably near the rear thrusters, where it gets very\
    \ hot, so a lot of nickel plating goes into gaseous form. \nFinally we can see\
    \ many diverse tails on the right, which tend to be blue, perhaps for argon or\
    \ xenon ions? \nThis is not a \"comet\". Many independent amateur photographs\
    \  confirm the same things."
