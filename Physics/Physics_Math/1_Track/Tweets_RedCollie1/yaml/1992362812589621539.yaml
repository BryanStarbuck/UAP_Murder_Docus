  text: "We \"discovered\" how to make silicon semiconductors by studying fragments\
    \ of the Roswell UFO crash. Transistors, diodes, MOSFETs, solar cells.\nBell Labs\
    \ patented the transistor just 6 months after that UFO went down, and the military\
    \ collected crash fragments. They was practically no research-trail on the subject\
    \ beforehand.\nIn 2005, the widow of a serviceman who helped to clean up the crash\
    \ site gave a recovered crash fragment to my friend Dr. Roger Leir in Thousand\
    \ Oaks (since passed away).\nI met Roger in 2005 and we discussed the matter at\
    \ length. He sent it to a materials scientist at UCSD for EXAFS testing.\nThe\
    \ results showed 99% silicon, 1% germanium with isotopes much heavier than from\
    \ our solar system. Roger gave a press conference in Las Vegas with the help of\
    \ Robert Bigelow. The US news media REFUSED to report the story. Everything was\
    \ \"debunked\". \nSo don't try to say there is \"no smoking gun evidence\" for\
    \ the Roswell crash. Our entire computer industry came from it! Also Elon's A.I."
