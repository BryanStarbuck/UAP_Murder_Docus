note_tweet:
  text: "I did more experiments today on the UFO anti-gravity drive, and did not take\
    \ any videos (waiting for a new camera to arrive), but found what seems to be\
    \ a highly functional design.\nA disc magnet \"m2\" spins with 3-phase magnetism,\
    \ slightly above a pool of liquid metal galinstan, which spins in the opposite\
    \ sense by a Lorentz force. Thus total spin angular momentum remains close to\
    \ zero! \nWe add three, 3-phase wire coils around the combined device, and place\
    \ another (stationary) magnet \"m1\" below the pool of liquid galinstan.\nMagnet\
    \ \"m1\" provides two functions. Firstly, it makes the galinstan spin with DC\
    \ current (12 volts) by a Lorentz force. Secondly, it lifts magnet \"m2\" slightly\
    \ above the pool of liquid galinstan, so that it can spin and rise freely by 3-phase\
    \ magnetism. \nIf we were to place magnet \"m2\" directly into the liquid metal,\
    \ it would not spin at all (due to high counter-resistance).\nThese details match\
    \ closely three UFO-instructional crop pictures drawn in 1999, 2014 and 2018 respectively\
    \ (shown below) and many others. Cryptic aliens, but I may have figured them out!\
    \ More soon. \U0001F6F8"
