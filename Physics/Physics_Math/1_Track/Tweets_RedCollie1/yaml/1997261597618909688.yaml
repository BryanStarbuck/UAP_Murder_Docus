note_tweet:
  text: "My friend and I spun liquid-metal galinstan with a DC battery and a permanent\
    \ magnet below, to check whether the Lorentz spin of that metallic liquid creates\
    \ a back-reaction \"torque\" by Newton's 3rd Law?\nWe placed the entire device\
    \ on a \"Lazy Susan\" bearing that could spin freely. We looked, and felt carefully\
    \ with our fingers, but there was no apparent torque (see videos 1 and 2). \n\
    We expected this result from previous studies (by others) of a Lorentz force using\
    \ \"brushes\" (see video 3).\nYet the Lorentz force seems to behave totally differently\
    \ from 3-phase magnetism, which causes a central magnet to spin one way, and three\
    \ wire coils to spin the other way!\nNow if we can make 3-phase magnetism act\
    \ in a similar fashion, by combining it with a Lorentz force, then we will have\
    \ discovered \"UFO levitation\". Upward force without downward counter-force.\U0001F6F8"
