  text: "Ten years ago in 2015, a spectacular crop picture appeared in Italy at the\
    \ end of an airport runway, and said in binary ASCII code \"timeo ET ferentes!\"\
    \ meaning \"I fear E.T. bearing (gifts)!\"\nOne week later, a US military man\
    \ met some aliens when he was travelling from Georgia to Colorado, and was given\
    \ a long message in some unknown 4-symbol code. \nIt resembled our binary computer\
    \ code ASCII, but nobody could figure out what all 4 symbols mean? Linda Howe\
    \ asked me to try and decipher it.\nAfter a month, I learned the novel coding\
    \ format. An ALIEN computer code which would work better than ALL of the human\
    \ computer codes we are using today on Earth! \nOne line of that alien message\
    \ read:\n\"Beware of Orion 1350.3 and Z Reticuli 39.170\" (home stars of two grey\
    \ alien races which are unfriendly to humans on Earth).\nMeanwhile the Italian\
    \ crop picture said essentially:\n\"Beware E.T. bearing gifts!\" (2015) or\n\"\
    Beware the bearers of false gifts and their broken promises\" (2002).\nThus we\
    \ got almost the same message from a crop picture in Italy 2015, and an apparently\
    \ unrelated UFO contact with a military man in Georgia, one week later! \nThat\
    \ military man will be featured on a major interview program soon. He will tell\
    \ the whole story. Combat veteran. \nPretty convincing, is it not? Meanwhile another\
    \ part of the alien message read:\n\"imminent threat soon to Earth's leaders and\
    \ civilizations\"\n\"EBENs\" (those grey aliens from Orion or Z Reticuli) \"have\
    \ sent a space-vessel THREAT\"\nNow in late 2025, we seem to see a huge alien\
    \ spacecraft flying through our solar system, and one must wonder: is 3I/ATLAS\
    \ the predicted THREAT?\n\"Evolutionary development needed for combined survival.\
    \ Disclose---Evolve\"\nTHAT is why I am posting about 3I/ATLAS. We were warned\
    \ 10 years ago. \nLuis titled his book \"IMMINENT\" as in the 4-symbol code. The\
    \ US DOD knows, but the people are being deceived. Watch near-future events carefully.\
    \ \U0001F6F8"
