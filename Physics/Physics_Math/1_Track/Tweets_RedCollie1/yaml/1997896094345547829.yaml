  text: "Next to a big radio telescope in Chilbolton (2001).\nNobody saw or heard\
    \ anything. \nI would sit sometimes near Carl Sagan in the Caltech lunchroom.\
    \ \nFrank Drake tried to dismiss these images, because slide 1 shows two different\
    \ types of DNA.\nOne with 10 nucleotides per turn, and the other with 6 nucleotides\
    \ per turn.\nBecause Drake did not know any molecular biology! \nThose are the\
    \ two major forms of DNA by chemical evolution as 3', 5' or 2', 5'.\nWork by Leslie\
    \ Orgel on the origin of life.\nWhen professional astronomers leave their telescopes,\
    \ and pretend to be experts at subjects they do not know, they make fools out\
    \ of themselves.\U0001F921"
