  text: "Let's add a little more \"alien physics\" here!\nA woman in the Czech Republic\
    \ 2018 had an alien friend. She asked him \"how do your UFOs fly?\" Her alien\
    \ friend responded that he would draw a picture in crops, not far from her home,\
    \ in the following summer to explain the physics. \nSure enough, that crop picture\
    \ appeared near Bohdankov on July 7, 2018 (see slide 1). It showed a big wire-coil\
    \ magnet below, along with some conductive fluid (galinstan?) spinning above by\
    \ a Lorentz force. \nI simulated the crop picture (see video 2) using salt water,\
    \ green food dye, and 50 volts of DC power over a magnet. \nThose elements alone\
    \ do not cause a UFO to fly! Yet if we add three, 3-phase wire coils around that\
    \ spinning fluid, it supposedly causes the fluid (or a second magnet) to LIFT\
    \ UP! \nI am building the needed devices, and plan to test soon.\nExpand your\
    \ thinking.\U0001F6F8"
