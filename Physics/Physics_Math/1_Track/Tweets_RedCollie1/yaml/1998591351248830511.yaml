  text: "Here is a part of Linda Howe's interview with US military contactee \"C.J.\"\
    \ in 2015. He was given 20 pages of alien, 4-symbol coded messages, that Linda\
    \ asked me to translate. Those coding formats had never been seen on Earth before.\
    \ \nThe first word of those messages was \"imminent\". It later became the title\
    \ of Luis Elizondo's best-selling UFO book. The US DOD visited \"CJ\" twice.\n\
    A long interview with \"CJ\" from 2025 will be released soon by a major channel.\n\
    Now if you would just listen to this short clip briefly, you should begin to understand!\
    \ \nThe \"good aliens\" are a Council of Five, whom \"Q\" called a \"Council of\
    \ Wizards and Warlocks\". The \"bad aliens\" are grey EBENs from Orion or Z Reticuli.\n\
    One part of the friendly alien message read: \"EBENs have sent a space-vessel\
    \ THREAT\" (toward Earth).\nNow we see 3I/ATLAS flying through our solar system.\
    \ It could be either \"good\" or \"bad\", but all of my instincts say \"bad\"\
    . \nIn December of 1941, a radar operator reported that a big fleet of enemy airplanes\
    \ was headed toward Hawaii, but the authorities at Pearl Harbor did nothing.\n\
    It seems possible that the \"experts\" at NASA are doing a similar thing, for\
    \ which they will be remembered through all of history.  \nTry to show some intelligence,\
    \ my friends. \"3I/ATLAS\" should be considered as a potential threat until proven\
    \ otherwise.\U0001F47D\U0001F47D\U0001F47D"
