  text: "Let me ask you: how did Jeremy Corbell learn about the slow approach of 3I/ATLAS\
    \ toward Earth, back in January 2025, when regular astronomers did not detect\
    \ it until July 2025? \nVideo 1: purported imaging of 3I/ATLAS by a huge, \"secret\"\
    \ space-telescope, one year ago. \nSlide 2: imaging of 3I/ATLAS by a small amateur\
    \ telescope on December 1, 2025.\nVideo 3: a warning by Jeremy Corbell in January\
    \ 2025, that a huge alien spaceship was headed slowly towards Earth (so the U.S.\
    \ government would say, but \"we should not believe them\"). \U0001F921\nI guess\
    \ J.C. could have been told by the aliens themselves, but a leak from the \"secret\"\
    \ space-telescope guys seems more likely."
