  text: "John Burroughs first saw CJ's post on \"Educating Humanity\" (2015), recognized\
    \ the symbols, then told Linda Howe about them.\nThe two coded messages begin\
    \ almost the same:\n\"Exploration of humanity\" (1980)\n\"Continuous protection\
    \ of humanity\" (2015). \nHome base was given as Woodbridge, England in 1980,\
    \ or as Nuremberg, Germany in 2015.\nThis sheds new light on the famous UFO battle\
    \ over Nuremberg in 1561! \nIt may have been something like in a Star Trek movie\
    \ where the Borg go back in time to destroy a town that will become important\
    \ to humanity in the future, while humans from our own future go back in time\
    \ to defend it.\nDrone warfare (woodcuts). \nThese codes together imply that both\
    \ Woodbridge and Nuremberg will be time-travel bases in the distant future, or\
    \ perhaps in an alternative universe. \nDetails of the 1980 code suggest the latter."
