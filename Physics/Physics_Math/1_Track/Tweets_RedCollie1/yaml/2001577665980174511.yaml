  text: "This is the next experiment I will do, based on my best interpretation of\
    \ \"UFO physics\" as drawn in crops 1991-2025. Here I show two \"alien instructive\
    \ diagrams\", but there may have been 40 or 50! \nWe know that the upward force\
    \ of a UFO comes from a 3-phase spinning magnet, pushing (like a gyroscope) against\
    \ the vacuum of space. \nBut that generates an equal and opposite downward force,\
    \ against 3 wire coils which give a rotating magnetic field.\nThe new idea (to\
    \ solve that problem) is that we might add a counter-spinning Lorentz force in\
    \ liquid metal (galinstan), so as to violate Newton's 3rd law of action-reaction\
    \ for two counter-spinning objects. \nNew alien physics: have we understood correctly,\
    \ and will it come true? Hopefully we will learn before Christmas!\n\"To get an\
    \ important answer, you have to work on an important question\" (Fred Sanger).\
