  text: "NOTES ON UFO ANTI-GRAVITY PHYSICS!\nAs shown in  video 1 (Edwin Fuhr, Canada\
    \ 1974), a low-hovering UFO may spin one way for its solid body, while pressing\
    \ down on the ground below in an opposite direction.\nWe have reproduced that\
    \ spin / counter-spin effect as shown in video 2. Thus we are on the \"right track\"\
    .\nThe general physics of spin and counter-spin are shown in video 3 (from \"\
    The Action Lab\"). If we spin a central magnet in a UFO, upward with 3-phase power,\
    \ then the rest of the craft will spin in a reverse sense (and downward) by Newton's\
    \ 3rd law of action-reaction. \nDoes everyone understand?\nSo to get \"anti-gravity\"\
    , we will have to replace (at least partly) that downward, counter-spinning force\
    \ with some other kind of spin, which does not push the entire craft downward.\n\
    That is what we will try next with counter-spinning liquid metal (galinstan) and\
    \ a 6-volt DC battery, placed over another magnet below (the Lorentz force). \n\
    These kinds of physics have been drawn many places, repeatedly, in alien-made\
    \ crop pictures. Earth is a very primitive world. We need \"disclosure\". \U0001F47D\
    \U0001F6F8"
