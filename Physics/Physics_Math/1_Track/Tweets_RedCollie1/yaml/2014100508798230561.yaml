  text: 'I was there when Phase 2 of that crop picture "came down". The night before,
    we had gone with Janet Ossebaard and her Dutch tour group to a nearby pub (and
    her white dog Claudia). I urged them to take turns "watching" Phase 1 all night,
    because they might see of film a new crop circle actually forming!

    They did take turns, watching all night until dawn at 5-5-6 AM, but saw nothing.
    Then after they went home to sleep, Phase 2 came down in early morning daylight!

    I saw Janet about 10 AM and asked, "Did you see the new Phase 2?" She replied,
    "SHIT!"  because they had missed it. Obviously they were being watched, and the
    crop artists did not want to be seen making Phase 2.'
