note_tweet:
  text: "Yahweh had a pretty cool spaceship! The prophet EZEKIEL in Babylon 550 BC:\
    \ \n\"When I was thirty years of age, I was living with Jewish exiles on the Kebar\
    \ River. Then on the fifth day of the fourth month, the sky opened. I saw an immense\
    \ dust storm come from the north, a cloud with lightning flashing! \nThere were\
    \ many wheels, sparkling like diamonds in the sun. It looked like they were wheels\
    \ within wheels, like for a gyroscope. Their rims were immense, circled with eyes.\
    \ \nWhen the living creatures lifted up, the wheels lifted up. When the creatures\
    \ stopped, the wheels stopped. \nOver the heads of those living creatures was\
    \ something like a dome, shimmering like glass. Above the dome, sky-blue like\
    \ a sapphire, a human-like figure towered above. \U0001F6F8\U0001F6F8\U0001F6F8"
