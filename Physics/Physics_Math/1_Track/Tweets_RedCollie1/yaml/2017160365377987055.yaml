  text: "Various crop pictures show what seem to be \"two rings of small magnets\"\
    , one inside and another outside, spinning rapidly in opposite directions, which\
    \ make a UFO \"go up\" (slides 1 and 2).  \nWe can make the inner ring spin and\
    \ rise, using three compact wire coils placed at the center just below, and given\
    \ 3-phase AC power. \nTo make the outer ring spin in an opposite direction, we\
    \ will need another set of wire coils placed further from the center, again given\
    \ 3-phase AC power (slide 3). \nThe number of such outer coils needs to equal\
    \ 6, 9, 12, 15 or 18 (as drawn in crops).  This extra set of coils may make an\
    \ outer set of disc magnets spin in an opposite direction from the inner set (slide\
    \ 4).  \nOne way to do this would be to use a clockwise-rotating, 3-phase magnetic\
    \ field for the inner ring of magnets, but an anti-clockwise-rotating, 3-phase\
    \ magnetic field for the outer ring. \nAnother way would be to use a clockwise-rotating,\
    \ 3-phase magnetic field for BOTH rings of magnets, inner and outer. Yet adjust\
    \ the polarity of magnets in that outer ring very carefully, so that they spin\
    \ AGAINST the clockwise-rotating magnetic field! \nThus we can now see a clear\
    \ path to \"discovering\" UFO levitation physics. I will do more lab experiments,\
    \ once I recover from some medical procedures. \nAD ASTRA ASPERA.\U0001F6F8\n\
    All clear? \U0001F600\nRockets are very \"20th century\". \U0001F680"
