    \ axial flux), even large permanent magnets (of 70 mm diameter or more) will rise\
    \ up strongly when they are spinning, in both N-up and S-up orientations. This\
    \ control rules out any mechanical, or \"dipole\" magnetic effects. \nPlease examine\
    \ the rising, spinning magnet shown in this 2026 video around time 0:48 and following\
    \ (attached below). \nThe upward rising force of that spinning magnet, caused\
    \ by \"pushing against the vacuum of space\" (like for a spinning gyroscope),\
    \ is quite substantial! \nUnfortunately its strong, spinning \"upward\" force\
    \ is cancelled by an equal \"downward\" force (spinning in the opposite direction)\
    \ due to Newton's 3rd Law. So total weight on a gravity scale does not change.\n\
    To get past that problem, and create real UFO or anti-gravity physics, we are\
    \ trying to spin another magnetic flywheel in an opposite direction to the big\
    \ inner magnet, but further away from the center, in the same approximate two-dimensional\
    \ plane (or same height).\nThis new strategy may perhaps cancel the \"downward\"\
    \ force of Newton's 3rd Law, if it acts on a fast-spinning rather than stationary\
    \ object (or set of wire coils) below? \nJust as a fast-spinning \"top\" will\
    \ re-direct any applied force sideways by 90 degrees (as in the Lorentz force\
    \ of electromagnetic physics). \nIf this new idea works, then we will have solved\
    \ the great problem of UFO physics! It has to be done by experiment, since in\
    \ this subject, there are no valid existing theories.\nNo one else on this page\
    \ seems intelligent enough to make helpful suggestions.\nYet if you have any good\
