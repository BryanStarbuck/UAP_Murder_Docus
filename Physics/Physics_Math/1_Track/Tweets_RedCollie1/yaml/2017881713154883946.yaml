note_tweet:
  text: "Please feel free to inform other interested inventors if you wish, this is\
    \ \"open source\" and not \"patented\"? \nWe plan to test various counter-rotating\
    \ flywheels soon, using 12 small outer wire-coils arranged in a large ring to\
    \ make then spin.\nSuch spin by 3-phase power can be either \"with\" or \"against\"\
    \ the spinning direction of a 3-phase applied  magnetic field, depending on how\
    \ we arrange the small rotor magnets. \nMany videos of \"mystery drones\" (seen\
    \ for example over New Jersey in December 2024) show this fast-spinning, \"outer\
    \ flywheel\" effect, with one set of triangular lights (3-phase wire coils?) placed\
    \ on each end.\nUnfortunately, such amateur videos do not show enough details\
    \ to deduce a complete understanding of how they fly. \nThose advanced, mystery\
    \ drones are widely speculated to be of alien origin. Hence these videos may be\
    \ informative concerning UFO propulsion."
