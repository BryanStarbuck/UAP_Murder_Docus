note_tweet:
  text: "Today was my first effort to build the outer, counter-spinning parts of a\
    \ UFO drive (movie 1). A summary of results is shown in slide 2. \nNext I have\
    \ to make a large number (9 or 12) of 50/60 mm copper wire coils (without iron),\
    \ using 0.4 mm wire.\nAnd test some wide-bore (80 to 90 mm) ball bearings, around\
    \ which the best rotor magnets can spin, given 3-phase magnetic fields from those\
    \ 9 or 12 outer-ring wire coils.\nIn the present example with 12 wire coils, the\
    \ best rotors show 8 magnets as N-S or N-N, which spin in opposite directions,\
    \ relative to a rotating magnetic field.\nThese results are NOT in any journal\
    \ or textbook! So I have to do everything from scratch. \U0001F6F8\nTHEY DON'T\
    \ HAVE A CLUE. PLANET OF THE APES."
