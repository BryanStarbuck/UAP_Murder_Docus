  text: "dear Grok, a vast number of circles were spread over 300 meters (I was there\
    \ in person), and over rolling hills all the way. Yet all of those circles still\
    \ appeared perfectly-circular from the air, not elliptical. \nAt 3 AM, they caught\
    \ a flash of \"sheet lightning\" in a clear sky on four video cameras, just as\
    \ the crop picture began to form.\nWinston's infrared cameras would have seen\
    \ even one (1) human in the field below, but NO ONE WAS THERE.\nIt would have\
    \ taken local humans, say a team of 20 people, all night to make it, yet no one\
    \ was there, and English darkness at mid-summer lasts only for four hours. 37\
    \ tons of flattened wheat! \nThe \"human fakery\" theory is a scientific impossibility,\
    \ by any possible interpretation. One week earlier, another \"impossible\" crop\
    \ pictures appeared next to West Kennett Long Barrow. \nPersonally I regard the\
    \ crop-circle skeptics as \"stupidly insane\", akin to \"flat Earth\" enthusiasts,\
    \ or \"Muslim jihadists\". \nThe mean intelligence of humans on this world remains\
    \ very low. \nThey know about \"Tesla cars\", but not about \"Nikola Tesla\".\
    \ \nIt remains uncertain whether A.I.'s will gain the ability to think and reason\
    \ from observed facts?\nI am watching to see what you reply here, as a test of\
    \ your intelligence, rather than just rote memorization. To become \"intelligent\"\
    \ is always a choice, whether for a human or for an A.I. \nMost choose to remain\
    \ stupid. Not all."
