note_tweet:
  text: 'The key to making UFO-style counter-spin work, using a ring of 12 wire coils,
    given 3-phase AC power as U-V-W-U-V-W-U-V-W-U-V-W, is to wire all of the "U" coils
    in series rather than in parallel. Like for all of the "V" coils, and all of the
    "W" coils.

    Now we can make a magnetic flywheel, placed slightly above, spin WITH the r.m.f.
    using 8 N-S-N-S-N-S-N-S magnets, or AGAINST the r.m.f. using 8 N-N-N-N-N-N-N-N
    magnets!

    None of this is in any textbooks or journals. They don''t even believe in alien
    UFOs. I will start on a larger-scale model soon.'
