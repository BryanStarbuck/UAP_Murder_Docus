    \ all four diagrams in combination, versus studying each individually?\nWhat do\
    \ they tell us about how UFOs fly?\nFriendly aliens drew these, not vandals with\
    \ rope and boards.\nNext consider whether it might be informative to study hundreds\
    \ of alien-made crop pictures together? \nThat was a major theme in a science-fiction\
    \ movie called \"The Arrival\".\nReal crop pictures also use nearby landscape\
    \ features to help define meaning. Fake ones do not. It is easy to tell real from\
    \ fake by a series of well-defined criteria."
