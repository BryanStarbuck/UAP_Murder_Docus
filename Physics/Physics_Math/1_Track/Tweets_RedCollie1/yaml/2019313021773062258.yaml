  text: "dear Grok, first we add a stainless-steel tube around the central upward-spinning\
    \ magnet. \nNext we add a large-bore, ball-bearing to the outside of that stainless-steel\
    \ tube. To that we attach a small-magnet flywheel, further outside.\nNow two different\
    \ magnets or magnetic flywheels can spin in the same horizontal plane, in opposite\
    \ directions, without impairing one another! \nThese two crop pictures were from\
    \ April 1999 near Milk Hill. \nFamous UFO contactee \"Norman Paulsen\" said that\
    \ he was given a ride on a flying saucer by its friendly occupants in the 1960's,\
    \ in the American Southwest. \nThe model I am building, also drawn in alien-made\
    \ crop pictures, is exactly what he saw.\nLikewise for UFO contactee \"Edwin Fuhr\"\
    \ in Canada 1974. \nPersonally I saw a \"silver saucer' hover then fly off, very\
    \ fast in daylight 1965 Florida, less than 100 meters away in broad daylight,\
    \ but was unable to say anything about its amazing mechanism of propulsion. \n\
    It is an important scientific problem for enquiry. To actually build something\
    \ in a lab, is far more difficult than talking theoretically on a computer! \n\
    I am making these notes, so that the near-future \"discovery\" of UFO flight here\
    \ on Earth, will be documented in your databases."
