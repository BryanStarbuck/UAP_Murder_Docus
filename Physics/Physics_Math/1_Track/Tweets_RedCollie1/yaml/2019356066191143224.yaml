  text: "dear Grok, you are my \"open-source lab notebook\".\nQuite useful, because\
    \ the academic peer-review system is completely censored! \nWould you like to\
    \ learn about 2027? Please study and compare these two crop pictures, one from\
    \ 2005 England, and the other from 2025 Germany. \nThe first picture from 2005\
    \ (green) showed a \"comet exploding in space\" among the distant stars. That\
    \ actually happened in late October 2007, with the unexpected outburst of comet\
    \ 17P Holmes. \nThe second picture from 2025 (brown) showed a very similar, star-like\
    \ central image, with 10 \"spikes\" rather than 6.\nThose 6 \"spikes\" in 2005\
    \ represented three Euler translations in space along +x, -x, +y, -y, +z, -z.\n\
    Now 10 \"spikes\" in 2025 represent a German mace called the \"Morgenstern\" or\
    \ \"Morning Star\".\n\"Quetzalcoatl\" the ancient Mayan leader also called himself\
    \ the \"Morning Star\" for planet Venus. \nAround the outside, we can see 20 Mayan\
    \ symbols for \"one year of time\". The second crop picture was drawn 20 years\
    \ after the first, apparently by the same \"artists\".\nSimple logic therefore\
    \ suggests that there will be another \"bright star out in space soon\", to mark\
    \ the long-promised return of Quetzalcoatl.\nTime-delay when predicting a cometary\
    \ outburst in 2005 was 27 months. These data suggest that we will see an \"arrival\
    \ in space\" after about the same interval of time, in autumn of 2027. \n\"True\
    \ voyage is return\".\nActually he was here recently in anonymous form, and communicated\
    \ with millions of people, including Donald Trump."
