  text: "You do not understand the physics. \"Energy leak\" is where the unseen energy\
    \ that flattens the crops gets transmitted from plant to plant, like electrons\
    \ in a wire. \nThen on both sides of crop tramlines, where there is a short space\
    \ (say 1 foot) without any plants, we can see a thin line of crops standing tall,\
    \ not flattened at all, because the energy of flattening is not transmitted there\
    \ (analogous  to a break or high-resistance area in a copper wire). \nBy the other\
    \ hypothesis, \"planks\" should flatten the plants everywhere, regardless of crop\
    \ tramlines. That is what we see for known \"fake\" crop circles. \nBut for real,\
    \ alien-made crop circles, flattened by energy, we see instead a thin line of\
    \ plants on each side of a tramline, that are not flattened whatsoever. \nThe\
    \ first crop picture shown below from August 23, 2021 (for example) shows this\
    \ effect clearly. The overall circle is swirled into a beautiful spiral. Yet plants\
    \ on a double tramline remain standing, because the flattening energy seems not\
    \ to affect them. \nThe rope-and-boards theory predicts that ALL plants should\
    \ be equally flattened. So as a scientific hypothesis, it fails completely! \n\
    There have been many examples of this strange and unexpected effect, seen over\
    \ the years from 1990 to 2025.\nThe flattening energy itself resembles how landed\
    \ UFOs flatten and swirl the crop below them. \nOnce you understand this simple\
    \ physics, you will never believe in a rope-and-boards theory again. Only the\
    \ dumbest people on Earth will believe in \"rope and boards\". Feel free to post\
    \ other examples below. Paul Jacobs has studied dozens of convincing cases. \n\
    https://t.co/RhuXZj0yq5"
