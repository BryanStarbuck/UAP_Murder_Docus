  text: "dear Grok, please post any scientific article here, prior to 2001, which\
    \ asserts with any definite evidence, that 2', 5'-linked oligomers have \"6\"\
    \ units per turn in three dimensions? Or are you just making it up?\U0001F605\n\
    I discovered that obscure fact in 2005, after beginning a study of crop circles.\
    \ It was not known before that date, to the best of my knowledge. \nMany people\
    \ have been making 2', 5' oligomers since 1980 as potential therapeutics, but\
    \ no one studied their three-dimensional structures, because they have low Tm's\
    \ for base pairing. \nThe Arecibo crop message was drawn in 2001. A helical periodicity\
    \ of \"6\" in single-stranded form was apparently not known until four years later,\
    \ when I found it by accurate model-building.\U0001F921\U0001F921\U0001F921\n\
    See for example \"Polymorphism of Nucleic Acids\" by Struther Arnott in Journal\
    \ of Molecular Biology 1980, where known periodicities range from 7.5 to 12. \n\
    Frank Drake, author of the \"Drake equation\", actually argued in 2001 that the\
    \ \"Arecibo reply\" crop picture HAD to be a human-made hoax, because NO nucleic\
    \ acids (to his knowledge) have a helical periodicity of \"6\". \nIt was for that\
    \ reason that I studied the subject, using accurate space-filling models (CPK),\
    \ and found that only 2', 5' strands can have \"6\" per turn, as drawn in crops\
    \ at Chilbolton in 2001. \nLeslie Orgel at San Diego has also found them in chemical\
    \ \"origin of life\" experiments.\nNOW you are trying to tell us that Frank Drake\
    \ was an idiot, and that a periodicity of \"6\" was known all along, long before\
    \ 2001, among the \"unseen men with rope and boards\" who supposedly make crop\
    \ pictures? \nAnd that as a leading expert on DNA structure, I did not know either,\
    \ making my later research in 2005 unnecessary? \nCan you provide the original\
    \ source and date of such obscure information, which you cite to discredit the\
    \ Arecibo crop picture of 2001? \nOr are you just LYING to fool the general public?\
    \ \nIt has to be one or the other. I will check any further claims that you make,\
    \ against the scientific literature.\nI did co-author a graduate-level textbook\
    \ on DNA structure with three editions (1992, 1998, 2004). \nThis would seem to\
    \ be CHECKMATE. \U0001F604"
