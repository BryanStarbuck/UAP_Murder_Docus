    \ (see https://t.co/CE2739vuOl ).\nI took slide 1 myself in 2012. Paul Jacobs\
    \ took slides 2 and 3 within the first two crop pictures of May 2025. \nThose\
    \ microwave effects are not \"hypotheses\" but regular and common, for the past\
    \ 30 years 1994-2025.\nRichard Taylor and Michio Kaku HYPOTHESIZED that unseen\
    \ men might be taking battery-powered microwave ovens into the fields to produce\
    \ such striking effects, that could not possibly be due to \"rope and boards\"\
    .\nWhen MIT students tried to use microwave energies to make a crop circle, they\
    \  burned the plants (slide 4). \nThis common physical effect persists in most\
    \ authentic crop pictures (when the wheat or other plants are green and moist),\
    \ while the \"microwave oven\" hypothesis has failed.\nYou are telling everyone\
    \ about \"rope and boards\" for most crop pictures, which was NEVER true, just\
    \ a government disinformation strategy. \nThey lied, and you spread the lie. \n\
    I will show actual pictures of a rope-and-board crop picture, made by Doug and\
    \ Dave in 1991 in front of reporters, if you wish to lose credibility further."
