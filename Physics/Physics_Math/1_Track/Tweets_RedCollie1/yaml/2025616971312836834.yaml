  text: "Our cars have \"alternators\", but how do the fast-spinning parts of UFOs\
    \ generate THEIR energies?\nOne contactee, Norman Paulsen, said that UFOs fly\
    \ by having two magnetic flywheels spin in opposite directions.\nAnd that they\
    \ generate electricity, by tapping onto the \"hubs\" or \"axles\" where those\
    \ two discs spin. \nThis scenario reminds us of a two-disc homopolar generator,\
    \ as invented by Nikola Tesla around 1900 (see movie 1). Paulsen's comments are\
    \ shown in slides 2 and 3. \nAnother way might be to place wire coils around the\
    \ perimeters of those spinning discs, and make AC electricity like Ed Leedskalnin\
    \ did at Coral Castle in the 1940's.\nBoth scenarios have been drawn in alien-made\
    \ crop pictures. Could these be two alternative solutions to the same problem?\
    \ \nWhat do YOU think? Please add any insightful comments below. \nI am still\
    \ working on needed parts in the lab, but getting closer to building a small-scale,\
    \ two spinning-disc levitation device (as health and time permit). \U0001F6F8"
