  text: "Do you \"get\" it yet? THIS is how it is done. \U0001F6F8\n9 wire coils around\
    \ the outside are given 3-phase power in series as U-V-W-U-V-W-U-V-W.\nThat causes\
    \ a ring of 24 small magnets arranged as NN-SS-NN-SS-NN-SS-etc to spin rapidly\
    \ in a direction opposite to the rotating magnetic field, so as to provide counter-spin,\
    \ relative to another magnet which is spinning forward and upward at the center\
    \ of the craft.\nMore lab videos soon! Waiting for parts to arrive. \nMany thanks\
    \ to Normal Paulsen and Thomas Valone."
