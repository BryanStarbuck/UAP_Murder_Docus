  text: "I was just ordering a ceramic, non-magnetic, ball bearing for \"Prototype\
    \ Two\" of my new UFO-physics model. Made of silicon nitride and PTFE. \nThen\
    \ I noticed that it shows a perfect match, to a famous crop picture which appeared\
    \ under Milk Hill in July 2011, in two phases or steps! \nIn its first phase (lower\
    \ left and lower right), that crop picture clearly showed an outer, \"two-lined\
    \ ball bearing\" which enables counter-spin, relative to an inner clockwise spinning\
    \ magnet.\nIts second phase appeared magically during a driving wind and rainstorm,\
    \ when no one could fly. I drove up an old track on the far side of Milk Hill\
    \ to reach the top, then took the first photos as seen below. \nThe next day was\
    \ sunny, and hundreds of Frenchmen came to visit it in their tour busses. Then\
    \ had lunch at the White Horse in Compton Bassett. \n\"Prototype Two\" should\
    \ be amazing!\U0001F973Two weeks to get delivery from Shanghai."
