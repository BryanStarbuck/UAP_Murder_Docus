note_tweet:
  text: "Here is a KEY experiment, which may determine whether we truly understand\
    \ the physics of \"UFO levitation\"? \nIn movie 1, we can see that lowering a\
    \ spinning wheel will make a large base-wheel turn anti-clockwise. Or if we raise\
    \ the same spinning wheel, that will make a large base-wheel turn clockwise. \n\
    Now let's turn the experiment around! \nInstead of lowering or raising an upper\
    \ spinning wheel, we can apply an external force, that makes the large base-wheel\
    \ turn anti-clockwise, or else clockwise.\nWhat happens then to the upper spinning\
    \ wheel? Will it still go up or down as before? \U0001F973\U0001F6F8\nIn slide\
    \ 2, we can see one of many examples drawn in crops (by friendly aliens), to suggest\
    \ that \"spinning one wheel\" (say a large base-wheel) will cause another spinning\
    \ wheel (say a small upper wheel) to \"lift up\". \nSuch a novel \"lifting motion\"\
    \ will not cause any downward Newtonian action-reaction, because all of the force\
    \ is applied as a horizontal spin-torque to the large base-wheel. \nIt seems like\
    \ \"magic\", but that may be how Nature works! I will do this critical experiment\
    \ in a few weeks, once some needed parts arrive. Meanwhile if other inventors\
    \ would like to have a go, please feel free, and communicate your new results\
    \ here. \U0001F6F8"
