  text: "Slide 1 shows a crop picture from July 2005, as a \"comet exploding among\
    \ the stars\". It predicted a real cometary outburst by 17P Holmes in October\
    \ 2007.\nSlide 2 shows a crop picture from July 2025, with 20 Mayan symbols for\
    \ time drawn around the outside, to mark \"20 years\" since the crop picture shown\
    \ in slide 1 was drawn. Might this new crop picture predict a \"sky event\" for\
    \ October 2027? \nSlide 3 shows what the new 2025 crop picture represents, namely\
    \ a \"German mace\" or weapon of war called \"Morning Star\". It was drawn in\
    \ Germany, so that makes perfect sense! \n\"Morning Star\" might also represent\
    \ \"planet Venus\", which was a common name for Quetzalcoatl in Mayan times. It\
    \ was also a prophecy for Jesus in Revelation: \"I am an offspring of David, and\
    \ the bright morning star.\"\nThus we seem to have been promised a \"sky event\"\
    \ in late 2027, which will show us a \"bright new star\" like Venus, or alternatively\
    \ a \"weapon of war\". \nDo you remember how \"Q\" would post \"SKY EVENT\" on\
    \ 4chan? Connect the dots. He comes to conquer. \"GOD versus SATAN. GOD wins.\"\
    \ \nI hope you have learned something concerning \"crop circles\". Two more summer\
    \ seasons to go. \U0001F436"
