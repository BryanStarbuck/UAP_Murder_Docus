  text: "Many UFOs seem to have a central spinning magnet (slide 1), which provides\
    \ upward force for a spacecraft to \"lift up\". How does this work? As shown in\
    \ movie 2 (from the Action Lab), a spinning gyroscope does not really like to\
    \ \"precess\" around its central, vertical axis!\nAs we increase its rates of\
    \ spin and precession, the spinning plane of that gyroscope \"pushes\" against\
    \ an invisible vacuum of space to \"lift up\", much like a propellor that spins\
    \ through water. \nThis \"lifting\" motion alone does not reduce an overall \"\
    weight\" for the object, because it creates an equal and downward force by Newton's\
    \ 3rd Law. \nTo get useful \"lift\" out of a central spinning magnet, we will\
    \ need to bypass Newton's 3rd Law in some way. That is what I was attempting to\
    \ do, in a recent video posted on this page.\nSPIN and COUNTER-SPIN \U0001F6F8\
    \nWe can try to satisfy Newton's 3rd Law by adding another counter-spinning motion,\
    \ that does not apply any force \"downward\". \nPlease look again now at slide\
    \ 1. Inside we can see a \"small round magnet\" which is spinning anti-clockwise\
    \ (lay of the fallen wheat). Outside we can see another \"narrow ring\" which\
    \ is spinning clockwise (lay of the fallen wheat). \nWe can see confirmatory details\
    \ in slide 3, which I took myself on August 8, 2014 near Avebury. The fallen wheat\
    \ is spinning there anti-clockwise. \nNo human made this with \"rope and boards\"\
    \ LOL. \nThat central circle was even surrounded by a tall, thick ring of un-flattened\
    \ wheat, which no one had walked through, when I first arrived there in the morning.\
    \ \nAlien-made. No \"rope and boards\". Instructions from friendly aliens, how\
    \ to make a UFO fly.\U0001F6F8\U0001F47D"
