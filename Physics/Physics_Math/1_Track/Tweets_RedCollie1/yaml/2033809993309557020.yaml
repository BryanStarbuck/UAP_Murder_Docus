note_tweet:
  text: 'Some of the instructions from friendly aliens, on how to build a UFO levitation
    drive, are shown in slides 1 and 2.

    Now for the first time, I have confirmed the use of a large-bore ball bearing
    to generate "outside counter-spin", as shown in slide 2 and movie 3.

    Movie 4 gives a general overview.

    The problem I found was that we have to use a large-bore ball bearing that is
    NOT para-magnetic!

    Thus stainless steel works poorly, but I will test other bearings made from zirconia
    or silicon nitride soon.

    TO THE STARS. 🛸'
