    \ rotating magnetic field (with 8 N-S magnets). \nThe inner ring (or disc magnet)\
    \ spins with that rotating magnetic field, and with another 3-phase field created\
    \ by three wire coils below, wired as U-V-W.\nFurther tests with non-magnetic\
    \ bearings soon.\nSpin and counter-spin. \U0001F6F8"
