  text: "Just as an aside, it should be easy for everyone to see now that the Buga\
    \ orb (slide 1) might also fly by \"spin and counter spin\" UFO physics.\nExcept\
    \ using 5 wire coils and 5-phase AC power, rather than 6 wire coils and 3-phase\
    \ AC power.\nIts schematic diagram was drawn in crops, shown in slide 2. \nThere\
    \ we can see an outer magnetic flywheel with (apparently) 10 N-S-N-S-N-S-N-S-N-S\
    \ magnets, plus a central \"disc magnet on a pole\", that could spin in the opposite\
    \ direction.\nI could build a small model to check these ideas, but do not have\
    \ a 5-phase AC power supply."
