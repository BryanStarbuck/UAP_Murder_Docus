  text: "A Newtonian \"pair\" will always produce action and reaction forces as +Fa\
    \ = - Fr which are equal and oppose one another.\nYet a Newtonian \"triple\" may\
    \ produce two opposing forces of action, which lead to two opposing forces of\
    \ reaction that cancel on another completely!\nFor example, clockwise spin gives\
    \ +Fa1 = - Fr1.\nAnti-clockwise spin gives -Fa2 = +Fr2.\nWhen combined as a \"\
    triple\", and acting on the same force-producing object (say a ring of six wire\
    \ coils), then +Fa1 and -Fa2 may add to zero, while -Fr1 and +Fr2 may also add\
    \ to zero. \nConsider now how a real UFO flies. \U0001F6F8\nIf it creates both\
    \ spin and counter-spin, what will be the forces generated by classical physics?"
