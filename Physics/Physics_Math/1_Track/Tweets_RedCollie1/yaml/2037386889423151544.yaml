  text: "In slides 2 and 3, we can see six wire coils around the outside as a \"ring\"\
    , all spinning clockwise with 3-phase power (slide 4). \nAt the center of slide\
    \ 3, we can also see a \"round disc magnet on a pole\" which is spinning anti-clockwise\
    \ (lay of fallen wheat).  \nSPIN \nFurther out from the center in slide 3, we\
    \ can see another \"thin ring\" which is spinning clockwise (lay of fallen wheat).\
    \  \nCOUNTER-SPIN. \nI was wondering why they drew that \"thin ring\" with such\
    \ a narrow radius from side to side? \nBy watching a video posted above, we can\
    \ see that the \"thin ring\" of 3-phase counter-spin may be made from a series\
    \ of 16 small NN-SS-NN-SS-NN-SS-NN-SS magnets (20 mm each), rather than from a\
    \ series of large N-S-N-S-N-S-N-S magnets (30 mm each).  \nThis helps it to start\
    \ better and spin better with less mass-weight.  \nWhen in rapid spin (see the\
    \ last part of the video posted), it does look almost like a featureless \"thin\
    \ ring\", or like the crop picture drawn near Lyme Regis in July 2025. \U0001F6F8"
