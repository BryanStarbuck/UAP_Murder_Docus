    \ arranged as a ring, just below those 16 small magnets. \nWe can see a triangle\
    \ arrangement of 3 wire coils U-V-W, and a ring arrangement of 6 wire coils U-V-W-U-V-W,\
    \ drawn schematically in crops at the same time (slide 3), along with many other\
    \ \"clues\".  \nSo why does this particular combination of magnetic spin and magnetic\
