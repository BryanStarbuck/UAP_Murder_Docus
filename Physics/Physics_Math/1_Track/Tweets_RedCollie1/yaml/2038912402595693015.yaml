  text: "I looked for any interaction between those outer and inner magnetic discs,\
    \ one spinning anti-clockwise, and the other clockwise respectively: see video\
    \ 1. \nAt low frequencies, the inner disc spins anti-clockwise along with the\
    \ outer, 16-magnet flywheel, because it is attracted weakly to a series of NN-SS\
    \ magnets in the outer flywheel. \nAt high frequencies, the inner disc spins clockwise,\
    \ opposite to the outer flywheel, because a clockwise, 3-phase, U-V-W-U-V-W magnetic\
    \ field becomes more powerful than its weak attraction to the outer flywheel.\n\
    Interestingly enough, when the spin of that inner magnet FLIPS from anti-clockwise\
    \ to clockwise (see halfway through video 1), then the outer flywheel counter-spins\
    \ even faster, to conserve total angular momentum! \nJust like in a teaching video\
    \ from the Action Lab (video 2). \U0001F6F8 LEARN SOME PHYSICS"
