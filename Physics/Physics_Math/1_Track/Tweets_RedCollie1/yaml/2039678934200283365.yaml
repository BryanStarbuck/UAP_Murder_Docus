note_tweet:
  text: "Here is an interesting problem in physics for you!\nOur friend first reduces\
    \ spin angular momentum around his vertical axis to zero, by lowering the spinning\
    \ wheel to horizontal (times 0:12 to 0:20).\nThat makes his body and feet move\
    \ anti-clockwise with velocity v = -2, because v = -2 from the vertical spinning\
    \ wheel has been lost, and spin angular momentum is conserved. \nNext he increases\
    \ spin angular momentum around his vertical axis from zero to v = -2, by raising\
    \ the spinning wheel over his head (times 0:20 to 0:31). \nThat makes his body\
    \ and feet move clockwise with velocity v = +2, because spin angular momentum\
    \ is again conserved. \nSo far, so good. Now let us consider another hypothetical\
    \ (but important) case, where the man is spinning rapidly clockwise with v = +8,\
    \ BEFORE he raises the anti-clockwise spinning wheel with v = -2 over his head.\
    \ \nWill the spin of his body and feet around that vertical axis increase to v\
    \ = +10, or might some other value be observed? \nPlease note that \"energy\"\
    \ E =mv2 is always conserved, whereas \"spin angular momentum\" mvr is only conserved\
    \ in the starting condition of v = 0 for his body and feet, not moving in either\
    \ direction.\nHow might this be relevant to Newton's Third Law? \nHow might this\
    \ be relevant to \"spin\" and \"counter-spin\" as suggested for UFO levitation?\
    \ \nI will try to test these ideas by experiment soon.\U0001F6F8\nPlease write\
    \ your concise answers below."
