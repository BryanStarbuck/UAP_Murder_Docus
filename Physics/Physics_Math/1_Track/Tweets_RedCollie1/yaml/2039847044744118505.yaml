  text: "This problem from classical physics does not seem to be in a textbook anywhere!\
    \ Let us consider the various energies E = mv2 of the spinning objects, which\
    \ MUST remain conserved.\nFirst we give spin-energy of E = mv2 to an upper disc,\
    \ where v = -2 anticlockwise. By Newton's 3rd Law, that will cause an equal and\
    \ opposite spin-energy to be applied to the lower body and hands, of v = +2 clockwise\
    \ (as shown in the movie).\nNext let us start from a different model, where we\
    \ set the body and hands of that man into rapid motion, BEFORE making the upper\
    \ disc spin. He would get very dizzy, but this is just a thought-experiment!\n\
    If we start with the man having clockwise motion v = +8. that would give a baseline\
    \ spin energy proportional to v-squared = 64 in relative units.\nNext we can add\
    \ v = -2 anti-clockwise to the upper disc, using an extra spin-energy proportional\
    \ to v-squared = 4 in relative units. \nThat extra spin-energy should ADD to the\
    \ spin-energy of the already-spinning \"man with body and hands\" below, due to\
    \ Newton's 3rd Law. \nNow that fast-spinning man should have a total energy E\
    \ = mv2 of (64 + 4) = 68 in relative units. \nThus his clockwise velocity should\
    \ increase from v = +8 to just v = +8.25, rather than to v = +10 by a naive model,\
    \ when not considering energies! \nThus the fast-spinning man may experience only\
    \ 1/8 = (0.25 / 2.00) of the velocity-increase expected for a stationary man by\
    \ Newton's 3rd Law. \nAnd since F = ma while a = dv/dt, his clockwise acceleration\
    \ by Newton's 3rd Law may also be reduced to 1/8 of that expected for a stationary\
    \ object. \nI am pretty sure that this 1991 crop picture shows the fast-spin effect\
    \ as described? First we spin rapidly anti-clockwise (the upper circle) by a magnetic\
    \ flywheel placed outside. Then we spin and precess rapidly clockwise (the lower-right\
    \ spiral) using a disc magnet placed in the center. \nThe whole device then \"\
    rises up\" like for the shape of a tetrahedron. Using 3-phase power. \nPlease\
    \ study and consider this new thought-experiment, and its possible relation to\
    \ fast counter-spin, followed by upward spin for UFO flight that bypasses Newton's\
    \ 3rd Law of action-reaction. \U0001F6F8"
