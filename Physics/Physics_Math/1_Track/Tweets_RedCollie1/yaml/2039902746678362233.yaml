  text: "How is spin energy E = mv2 applied to a nearby object, using Newton's 3rd\
    \ Law, when the nearby object is either (a) stationary or (b) in rapid relative\
    \ motion?\nFor m = 1, v = -2, we get E = 4. The nearby object receives E =  4\
    \ in an opposite spin direction, thereby creating v = +2.\nNext let us spin the\
    \ nearby object first, using say v = +8. Its prior spin energy would be E = 64\
    \ for m = 1, v = +8. \nNow when he add an extra E = 4 by Newton's Third Law, the\
    \ total spin energy goes to E = 64 + 4 = 68.\nHence v = +8 will only increase\
    \ to the square root of 68 = 8.25, giving 8.00 > 8.25 instead of 0 > 2 for a stationary\
    \ object, when it receives extra-spin energy by Newton's 3rd Law. \nNaively one\
    \ might expect v = 8 > 10 looking at spin angular momentum alone. But when we\
    \ consider conservation or spin energies, we should see only v = 8 > 8.25,\nIn\
    \ summary, as the prior spin velocity of that nearby object gets larger, then\
    \ we may need practically no-zero effect of Newton's 3rd Law on the nearby, fast-spinning\
    \ object. \nHow do UFOs fly using spin combined with counter-spin? Could this\
    \ be the theoretical explanation?"
