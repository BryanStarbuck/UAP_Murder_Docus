    \ go in opposite directions (say clockwise and anti-clockwise). \nThey do NOT\
    \ show us the exact polarities of permanent magnets on the outer ring, which spins\
    \ over those 6 wire coils. \nYet we find that either 4 N-N-N-N magnets, 8 N-S-N-S-N-S-N-S\
    \ magnets, or 16 N-N-S-S-N-N-S-S-N-N-S-S-N-N-S-S magnets will make it spin \"\
    against\" the rotating magnetic field as required! \n4 N-N-N-N magnets will interact\
    \ more strongly with the central, 70 mm, N/S disc magnet more strongly than the\
    \ other two choices. We will study such interactions in greater detail soon, with\
    \ regard to the possibility that they may generate non-Newtonian forces for UFO\
    \ propulsion. \nThe central bearing (of bore 90 mm) on which the outer ring of\
    \ magnets spins has to be \"non-magnetic\", and made either of zirconium oxide\
    \ or silicon nitride. Stainless steel will not work, unless it is completely devoid\
    \ of para-magnetism. \nI hope everyone understand the four crop pictures drawn\
    \ below. \U0001F920"
