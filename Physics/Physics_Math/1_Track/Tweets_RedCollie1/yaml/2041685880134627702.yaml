note_tweet:
  text: "I was wondering \"how many magnets: to include on the outer flywheel, whether\
    \ 4 N-N-N-N or 8 N-S-N-S-N-S-N-S? Edwin Fuhr's close-up observation of some small\
    \ UFOs in Canada 1974 gives us the answer!\nAs shown in video 1, the small UFO\
    \ he saw had 4 (four) magnets spinning around its lower perimeter.\nAs shown in\
    \ video 2, my current lab model also has 4 magnets N-N-N-N, which spin in exactly\
    \ the same way!\nVideo 3 shows an animation of Fuhr's UFO when it was spinning\
    \ more rapidly and rising up. Now it is hard to count \"how many\".\nVideo 4 shows\
    \ how he saw outer parts of the UFO spinning one way, but grass below spinning\
    \ the other way. I call that \"spin\" and \"counter-spin\". It is also part of\
    \ my new model, and I am studying the physics. \nThe advantage of having 4 magnets\
    \ rather than 8, on the outer flywheel, is that now we have a strong magnetic\
    \ field created inside the \"ring\" of those 4 N-N-N-N magnets, with which the\
    \ central fast-spinning magnet can interact, perhaps in a non-Newtonian sense.\
    \ \U0001F600\U0001F6F8"
