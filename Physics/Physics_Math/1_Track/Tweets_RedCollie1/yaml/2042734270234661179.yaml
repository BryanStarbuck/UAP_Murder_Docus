note_tweet:
  text: "\"Everything\" says that this is how UFOs might really work! See video 1,\
    \ where two flat rings of magnets spin in opposite directions to one another.\
    \ \nSlide 2 recounts what contactee Norman Paulsen saw on a real UFO. Slides 3\
    \ and 4 show two of many relevant crop-picture messages about UFO physics.\nTwo\
    \ magnetic rings (or flywheels) spin in opposite directions to one another. The\
    \ central ring wants to \"lift up\" by 3-phase power, while it attracts the outer\
    \ ring to \"pull it up\" (along with the rest of the UFO).\nI can see clearly\
    \ how it MIGHT work, but have not (yet) looked for any anti-gravity effects. And\
    \ we cannot calculate the forces anyway, due to such rapid, counter-spinning motions.\
    \ \nNorman Paulsen said that this particular \"magnetic and gyroscopic\" device\
    \ \"creates its own gravity\" (see the first comment below). Could he be right?\
    \ \nA good model anyway for further research.\U0001F6F8"
