  text: "I was just watching the interview with Bob Lazar, on Chris Ramsay's channel\
    \ \"Area 52\". Chris previously interviewed my friends Peter Khoury and Jeremy\
    \ Weeks (\"CJ\").\nWe learned over the past few years how to read and write 4-symbol\
    \ alien computer code. Another friend  \"Rodney Graphics\" has explained in several\
    \ videos how to write their code, and its advantages over our own.\nI have also\
    \ been working personally in my private lab on \"UFO physics\", and have not yet\
    \ gotten any important anti-gravity effects, but have been using information from\
    \ many dozens of instructive, alien-made crop pictures, along with accounts from\
    \ reliable contactees, to build complex devices that had never been seen before,\
    \ and which seem to be an important step towards achieving UFO physics. \U0001F6F8\
    \nI have also done preliminary experiments on how to achieve \"compact nuclear\
    \ fusion\", say for household use, and understand the novel physics there, but\
    \ have not had time to go further yet. \nThe aliens do not put oil or gas in their\
    \ ships. They use compact fusion. One reaction for example was shown to be S-32\
    \ + H-1 + D-2 (three times) to get K-41. \nGiven all of that verified and exciting\
    \ information (I have not even mentioned \"time travel\", or the \"alien drones\"\
    \ flying over military bases worldwide), do you think possibly that all of this\
    \ could be REAL?\nAnd that you are being encouraged to think you are still living\
    \ in the scientific world of 1950? \U0001F921"
