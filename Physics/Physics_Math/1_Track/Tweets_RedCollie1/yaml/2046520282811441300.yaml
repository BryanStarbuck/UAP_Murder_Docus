  text: "Two crop pictures from 2012 (slides 1 and 2) now seem to be well understood\
    \ in terms of UFO physics. Their detailed interpretations are shown in slides\
    \ 3 and 4. \nOn the left-hand side of slides 3 and 4, we can see a South \"S\"\
    \ disc magnet (blue), held in place by four outer North \"N\" magnets (red), arranged\
    \ in the form of a \"ring\". Four green, dashed lines show that static, magnetic\
    \ attraction. \nTwo sets of smaller circles (black), drawn above or below the\
    \ big \"S\" magnet (blue), describe how it is held in place by an attractive force\
    \ towards the horizontal plane of those four \"N\" magnets (red), from both above\
    \ and below.\nNext as shown on the right-hand side of slides 3 and 4, we can see\
    \ that both the outer ring of 4 \"N\" magnets (red), and also the central \"S\"\
    \ disc magnet (blue), have been made to spin rapidly in opposite directions! \n\
    Technically this requires 6 + 3 wire coils, given 3-phase power from two different\
    \ supplies.  \nNOW the big, central disc magnet \"S\" (blue) goes up-and-down\
    \ rapidly in a periodic fashion. Those four \"N\" magnets outside (red) still\
    \ attract the moving \"S\" magnet towards their central plane, whether from above\
    \ or below (small black circles). \nThere is nothing new here (so far). I have\
    \ shown ALL of those experimental effects in my recent lab videos. There may still\
    \ be something new and important however! \nAs shown in slide 4, two green, dashed\
    \ lines show how the central disc magnet \"S\" goes UP in a relative sense, for\
    \ BOTH of its \"up\" and \"down\" oscillations on a vertical pole. \nIf this device\
    \ were following Newton's laws of motion, then the \"up\" magnet (blue) would\
    \ lie higher than a starting, no-spin disc magnet \"S\" on the left. While the\
    \ \"down\" magnet (blue) would lie lower than a starting, no-spin disc magnet\
    \ \"S\" on the left.\nYet that is NOT what the E.T. crop artist drew! Instead\
    \ he drew BOTH \"up\" and \"down\" spinning magnets on the right, as higher than\
    \ a no-spin \"S\" magnet on the left!\nHe seems to have been hinting at upward,\
    \ pulsed anti-gravity levitation for both sets of magnets (red and blue), NOT\
    \ following Newton's laws. \nSo if we study that \"up-and-down\", spin and counter-spin\
    \ effect in our new device, we may have a good chance of discovering \"UFO levitation\"\
    \ physics. I will try to do that soon.\U0001F6F8\n\"The simple is great\" (Lao\
    \ Tzu)."
