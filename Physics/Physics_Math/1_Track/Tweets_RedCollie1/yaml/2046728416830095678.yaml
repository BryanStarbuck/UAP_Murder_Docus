  text: "If we spin one magnet rapidly by itself, not much happens. But if we spin\
    \ two concentric sets of magnets in opposite directions (as shown in slide 1),\
    \ then we can create \"vortices\" which make a central magnet either go down or\
    \ rise up (slide 2, also movies 3 and 4).\nThink of it like \"twisting a bedsheet\"\
    . You can twist one end, and not much happens. But if you twist both ends in opposite\
    \ directions, you get a region of strongly-twisted cloth between them! \nWhen\
    \ we do the same thing in spacetime, we can create upward or downward vortices\
    \ (movies 3 and 4) that may explain UFO flight? I am studying this interesting\
    \ problem now. \U0001F6F8"
