status_notes: >
  Day 2 simulation (scipy/numpy Legendre expansion, L_MAX=21) POSITIVE.
  Validation: full sphere F_z = 0 (exact). Main test: hemisphere F_z = 9.50 mN
  upward at R=10cm, V=10kV. Force scales exactly as V^2, independent of R.
  Geometry factor C = 10.73 (higher than naive estimate C~1). Lift voltage
  = 227.2 kV in vacuum (E_apex = 6.82 MV/m, below field emission limit ~100 MV/m).
  Gibbs ringing in E_r at theta~10° due to L_MAX=21 truncation — force integral
  still valid. Day 3 priorities: BEM for exact E_r profile, cone geometry sweep,
  convergence check at L_MAX=51/101. Attempt status: ACTIVE, positive progress.
