status_notes: >
  Day 2: Legendre (L_MAX=21) gave F_z = 9.50 mN at 10kV (lower bound).
  Day 3: Three key findings:
  (1) Legendre series DIVERGES logarithmically due to square-root singularity at rim.
      Day 2 result is a lower bound; true F_z is higher. BEM needed for accurate value.
  (2) Cone geometry alpha=30 deg gives C_eff = 33.56 m, 3.1x hemisphere, V_lift = 128 kV.
      Geometry optimization has high leverage; finer sweep and FEM validation needed.
  (3) Isolated conductor F_z = 0. The mechanism is an EXTERNAL FORCE between hemisphere
      and ground plane. Free-flight propulsion not possible. Near-surface hover viable (H<5R).
  STATUS: Secondary — near-surface hover application preserved. Primary thrust moved to
  Attempt 3 (BUGA three-phase rotating field, Approach 3.3) for free-flight mechanism.
  BEM validation of cone result is Day 5+ priority.
