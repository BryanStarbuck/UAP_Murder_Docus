  - ANSWERED Day 3: Cone alpha=30 deg maximizes C (3.1x hemisphere). V_lift = 128 kV.
  - ANSWERED Day 3: Force scales as V^2 (R-independent for fixed shape). ✓
  - ANSWERED Day 3: Isolated conductor F_z = 0 — external ground plane required. ✗ free flight
  - OPEN: BEM/FEM validation of the cone result (Legendre series diverges at rim singularity)
  - OPEN: Fine cone sweep 20-40 degrees to find true optimal angle
  - OPEN: Force vs. height above ground — quantify usable altitude envelope
  - OPEN: Multi-element flat array force additivity and optimal element spacing
  - OPEN: Can a different physics mechanism (BUGA, Podkletnov analog) produce free-flight thrust?

