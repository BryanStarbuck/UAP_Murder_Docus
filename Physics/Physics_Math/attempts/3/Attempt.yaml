summary: >
  Three-phase rotating electromagnetic field produced by three coil assemblies
  at 120-degree azimuthal intervals, coupled to a large toroidal ferrite element
  at the base and a hemispherical electrode at the top. Based on the European
  BUGA ORB-SPHERE device (multi-year documented construction, anomalous scale
  readings: 0.12 kg and 0.058 kg across construction stages).
  Physical mechanism: rotating B-field carries electromagnetic angular momentum;
  asymmetric coupling to the ferrite toroid may produce a net axial force.
  The Podkletnov gravitomagnetic analog at room temperature (ferrite replaces
  rotating superconductor). Does NOT require an external ground plane —
  the mechanism is field-intrinsic and thus viable for free-flight propulsion
  if a nonzero time-averaged axial force is confirmed.

physics_basis:
  primary_mechanism: Three-phase rotating B-field + toroidal ferrite Kelvin force
  time_varying: true
  frequency_range_Hz: 10 to 10000
  field_geometry: Rotating azimuthal field (three coils at 0, 120, 240 degrees)
  key_equations:
    - "B(r,t) = sum_{k=0}^{2} B_k(r) * cos(2*pi*f*t - 2*pi*k/3)  [three-phase superposition]"
    - "L_EM = eps_0 * integral (r x (E x B)) dV  [EM angular momentum density]"
    - "F_Kelvin = mu_0 * chi_m * integral (H · grad)H dV  [Kelvin body force on ferrite]"
    - "T_avg = (1/T) * integral_0^T (d/dt)(L_EM) dt  [time-averaged torque]"
    - "S_z = (1/mu_0) * (E x B)_z  [axial Poynting flux for linear momentum]"
  force_direction: Axial (vertical, z-direction), sign to be determined by simulation
  unique_claim: >
    Asymmetric coupling between rotating EM field and toroidal ferrite produces
    a net time-averaged axial force. The asymmetry arises from the toroid
    geometry (field lines preferentially enter through the top face near the coils
    and exit through the outer equatorial surface). This geometry may create
    a net vertical component in the Kelvin force integral.
  podkletnov_analog: >
    Podkletnov (1992): rotating YBCO superconductor above toroidal solenoid
    showed ~0.3% weight reduction for objects above the disc. Attributed to
    gravitomagnetic coupling. Here: ferrite toroid (mu_r~2000) replaces
    superconducting disc; rotating three-phase EM field replaces mechanical
    rotation. Room temperature operation. If the Podkletnov effect is real
    and depends only on field rotation geometry, the ferrite analog should
    show a detectable fraction of the 0.3% effect.

