  coil_turns: 100
  coil_current_A: 1.0
  frequency_Hz: 60
  toroid_inner_radius_cm: 3.0
  toroid_outer_radius_cm: 8.0
  toroid_height_cm: 2.0
  toroid_material: ferrite
  toroid_mu_r: 2000
  electrode_radius_cm: 2.0
  electrode_voltage_kV: 0.0  # Day 4: pure magnetic; electrode added later if needed
  total_device_mass_kg_estimate: 2.0  # estimated from BUGA scale readings

empirical_targets:
  buga_scale_reading_1: "0.12 kg (advanced construction stage with toroid)"
  buga_scale_reading_2: "0.058 kg (different build stage, dark disc assemblies)"
  mass_difference_g: 62
  mass_reduction_percent: 52
  note: >
    The two scale readings may represent: (a) different components at different
    construction stages, or (b) before/during active EM operation measurements.
    If (b), the 52% mass reduction would be extraordinary. Simulation must
    test whether ANY detectable force can be produced to bound the effect.

simulation_plan:
  software: scipy_numpy_biot_savart
  day_4_tasks:
    4A: >
      Biot-Savart rotating B-field map: three coils at 0/120/240 degrees,
      each driven by I(t) = I_0 * cos(omega*t - phi_k). Compute B(r,t)
      at all spatial points. Verify field rotates in azimuth. Compute
      time-averaged |B|^2 as function of z (height above device). Check
      for axial asymmetry between above and below the coil plane.
    4B: >
      Kelvin force on toroidal ferrite: integrate F = mu_0 * chi_m * (M·grad)H
      over the toroid volume using the rotating field from 4A. Compute
      <F_z> (time-averaged z-component). Is it zero by symmetry or nonzero?
    4C: >
      EM angular momentum flux: compute S_z(z) = (E x B)_z / mu_0 integrated
      over a horizontal plane at height z. If <S_z> ≠ 0 above vs. below the
      device, the device is radiating net z-directed EM momentum.

open_questions:
  - OPEN: Does the three-phase rotating field produce a nonzero time-averaged
          axial Kelvin force on the toroidal ferrite?
  - OPEN: What is the frequency dependence of the Kelvin force?
          (Expected: F_Kelvin ~ omega^2 in some regimes)
  - OPEN: Is there net EM angular momentum flux in the axial direction?
  - OPEN: How does the force scale with toroid permeability mu_r?
  - OPEN: Can the BUGA scale measurement difference (62 g) be explained by
          the Kelvin force mechanism at practical field strengths?
  - OPEN: What coil current / frequency combination would produce measurable
          force (>1 mN) at the BUGA device scale?

