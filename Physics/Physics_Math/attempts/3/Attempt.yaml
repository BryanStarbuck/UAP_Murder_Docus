empirical_targets:
  buga_scale_reading_1: "0.12 kg (advanced construction stage with toroid)"
  buga_scale_reading_2: "0.058 kg (different build stage, dark disc assemblies)"
  mass_difference_g: 62
  mass_reduction_percent: 52
  note: >
    The two scale readings may represent: (a) different components at different
    construction stages, or (b) before/during active EM operation measurements.
    If (b), the 52% mass reduction would be extraordinary. Simulation must
    test whether ANY detectable force can be produced to bound the effect.

simulation_plan:
  software: scipy_numpy_biot_savart
  day_4_tasks:
    4A: >
      Biot-Savart rotating B-field map: three coils at 0/120/240 degrees,
      each driven by I(t) = I_0 * cos(omega*t - phi_k). Compute B(r,t)
      at all spatial points. Verify field rotates in azimuth. Compute
      time-averaged |B|^2 as function of z (height above device). Check
      for axial asymmetry between above and below the coil plane.
    4B: >
      Kelvin force on toroidal ferrite: integrate F = mu_0 * chi_m * (M·grad)H
      over the toroid volume using the rotating field from 4A. Compute
      <F_z> (time-averaged z-component). Is it zero by symmetry or nonzero?
    4C: >
      EM angular momentum flux: compute S_z(z) = (E x B)_z / mu_0 integrated
      over a horizontal plane at height z. If <S_z> ≠ 0 above vs. below the
      device, the device is radiating net z-directed EM momentum.

open_questions:
  - ANSWERED Day 4: Kelvin force on toroid IS nonzero: F_z = 1.91 N at 1A (UPWARD).
    Force exceeds lift threshold at I = 1.6 A. BUT: force is INTERNAL — net external = 0.
  - ANSWERED Day 4: EM momentum force at 60 Hz: ~2.4e-8 N (NEGLIGIBLE).
    Critical frequency for 1 mN via EM momentum: f* ≈ 3.4 GHz.
  - ANSWERED Day 4: BUGA scale readings (0.12 kg vs 0.058 kg) = different
    construction stages. Mass difference (62 g) = toroid mass (~68 g for soft iron).
    NOT anomalous mass reduction. Section 4.1 empirical claim downgraded.
  - ANSWERED Day 4: Kelvin force scales as I² (confirmed). Soft iron optimal
    over ferrite (higher B_sat, operates below saturation at practical currents).
  - OPEN: Can the spinning rotor convert internal Kelvin force to external thrust?
          Mechanism: rotor absorbs angular momentum → releases via asymmetric coupling.
          If conversion efficiency > 1%: F_external > 76 mN at I = 2 A (measurable).
  - OPEN: What angular velocity does the rotor reach at steady state?
          Synchronous torque: tau = m_rotor × B × sin(delta). Day 5.
  - OPEN: Gyrostatic lift hypothesis — does rotor precession in Earth gravity
          produce net vertical force? At what omega_rotor? Day 5.
  - OPEN: Frequency sweep for EM momentum: at what f does F_EM reach 1 mN?
  - OPEN: Optimal coil-to-toroid gap for maximizing Kelvin force per watt.

