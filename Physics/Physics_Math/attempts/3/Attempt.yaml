status_notes: >
  Day 4: Three simulations completed. Three-phase rotating field confirmed.
  CRITICAL FINDING: Kelvin force at 1A = 1.91 N (exceeds lift threshold at 1.6A),
  BUT is an INTERNAL force (net external = 0). The BUGA scale readings are explained
  by toroid mass addition between construction stages — NOT anomalous mass reduction.
  EM momentum at 60 Hz is negligible (~2.4e-8 N).
  PIVOT: The spinning rotor angular momentum mechanism is the remaining candidate
  for external thrust. Day 5 will investigate rotor dynamics (synchronous torque,
  steady-state angular velocity, gyrostatic lift hypothesis).
  The internal Kelvin force magnitude (1.9 N at 1A) is large enough that even
  1% coupling efficiency would produce measurable (76 mN) external thrust.
