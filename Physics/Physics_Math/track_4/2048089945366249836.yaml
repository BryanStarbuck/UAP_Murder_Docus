text: |
  Two technical records from the same Cold War period, U.S. side and Soviet side,
  documenting vehicles with similar characteristics.

  The Los Alamos National Laboratory figures in Corbell's release document the disc
  morphology observationally: flat top with central post, flat skirt, hatched striated
  body, measured at 39x and 40x magnification.

  The Černohajev manuscripts detail those elements at the engineering level. Crew cabin
  and reactor. The skirt is the solenoid array generating neutrino-magnetic flux. The
  striations are eight radial titanium stringers. 30 meter diameter, mass calculated,
  materials specified.

  Public for researchers since November 2024 at cernohajev.omeka.net with additional
  detail and the complete translations at engineeringinfinitybook.com

