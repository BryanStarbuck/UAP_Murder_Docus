text: |
  US scientist cluster (2023–early 2026) + one extremely obscure X diagram that matches the exact physics they specialized in.

  Recent deaths/disappearances of US experts in nuclear weapons, fusion/plasma physics, advanced propulsion materials, and dual-use asteroid sensors:

  Los Alamos: Anthony Chavez (former employee, vanished May 2025 while walking); Melissa Casias (top-secret clearance admin, vanished June 26 2025 — phones factory reset, walked into forest without keys/wallet).

  Aerojet Rocketdyne / NASA-linked: Monica Jacinto Reza (co-inventor of Mondaloy nickel superalloy for next-gen US rocket engines; vanished June 22 2025 on familiar hike — 30 ft behind companions).

  MIT Plasma Science & Fusion Center: Nuno Loureiro (director, theoretical plasma physicist; shot multiple times at home Dec 15 2025, died next day).

  AFRL / Space Command: Retired Maj. Gen. William "Neil" McCasland (ex-AFRL commander overseeing propulsion R&D; vanished Feb 27 2026 from Albuquerque home — left phone/glasses/wearables, took revolver/wallet/boots).

  JPL / Caltech: Carl Grillmair (NEOWISE / NEO Surveyor astrophysicist; shot on porch Feb 16 2026); Michael David Hicks (DART asteroid deflection / comet physics; died July 2023, no public cause); Frank Maiwald (advanced sensors / microwave systems; died July 2024, no cause).

  Authorities say "no coordinated pattern." The domains are hyper-specific: plasma control, high-temperature rocket materials, nuclear/thorium-adjacent power, and dual-use sensors.

  On Jan 25 2026 (right in the middle of the cluster), a verified account @TMBSPACESHIPS — "Retired 38 year Active Duty USAF PhD Engineer. AFIT/AETC/AFMC — UT/OU" with family who worked in those programs since the mid-1960s — posted a diagram labeled "BROWN-CAHILL METHOD for the REDUCTION of KINETIC PERMITTIVITY of FREE SPACE" claiming to be the open-source technology that will get us to Mars in minutes.

  The diagram integrates: incandescently heated thorium-zirconium coated antenna for hot-electron production; plasma with two velocity domains (slow ions + fast electrons in self-contained laminar 2D sheets); diaphragm drive coils + low-frequency ion modulation for kinetic ion transport; magnetoacoustic longitudinal waves bouncing between fuselage skin and outer plasma envelope; helium lubricant, ion seed gas, and high-K dielectric fuselage coating.

  The author states the US has had real-world "Spaceworthy" antigravity vehicles since the mid-1960s and is writing a 3-volume Antigravity Vehicle Technology Handbook.

  This is not in any textbook or public patent. It is a complete synthesis of the exact subsystems the missing/killed experts worked on (plasma physics, advanced propulsion materials, nuclear power, AFRL oversight, dual-use sensors).

  The account has continued posting related schematics (Feb 2026): muon-catalyzed fusion, electro-acoustic waves, magnetic stochastics, 2DOF lattice fields, helium ionization to He+(+5/+6), and photos of modern-looking disc/triangle craft claimed to be operational (manned + unmanned + slave configurations).
