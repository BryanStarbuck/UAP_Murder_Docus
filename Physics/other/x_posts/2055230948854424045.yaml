context: |
  Dr. Horace Drew's 3D interpretation of the Barbury Castle crop circle (June 1, 2008).
  He frames the 2D crop pattern as a flattened projection of a 3D propulsion geometry —
  a spheroidal ("apple or cherry") core wrapped by counter-rotating helical paths
  whose ratios encode pi (3.141592654). This is a new propulsion-geometry thesis
  distinct from his prior magnet-in-flywheel work — a wrapped helical sphere
  rather than a magnet inside a flywheel.
