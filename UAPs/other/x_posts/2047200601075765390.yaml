  Subject is Joshua LeBlanc, age 29, from New Iberia, Louisiana. NASA engineer at Huntsville, AL.
  Team Lead for Space Nuclear Propulsion (SNP) I&C Maturation and DRACO nuclear thermal propulsion engine (DARPA).
  Vanished July 22, 2025 — left phone and wallet at home. Tesla found burned in Walker County, AL same day.
  FBI investigating as part of broader cluster of 12+ nuclear/space scientists dying or disappearing.
  House Oversight Chair James Comer flagged "sinister" pattern.
