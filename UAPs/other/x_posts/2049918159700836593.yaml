text: |
  An Indian psychic showed up at a secretive research foundation in Maine and on his first night fell into an unexpected trance. Someone grabbed a tape recorder. What came through called itself "The Nine." There are thousands of pages of transcripts. The tapes still exist.

  "He just unexpectedly falls into a trance. They're like, what's going on here? Someone grabs a tape recorder."

  "He starts speaking. We are the Nine. We're coming through to you now."

  "There are thousands of pages, literally, of transcripts of what they recorded with him."

  "It's a lot of philosophical, new age sort of stuff. But that's how the story goes of how The Nine first appears."

  "New episode out now for members. Public release tomorrow."
