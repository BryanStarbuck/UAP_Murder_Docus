  🚨BREAKING: Body of MISSING SCIENTIST Found!

  Melissa Casias, a 53-year-old administrative assistant at Los Alamos National Laboratory, disappeared on June 26, 2025, after everyday errands like dropping lunch to her daughter. She was last seen on surveillance near her Ranchos de Taos home, leaving behind her locked house, car, wallet, and factory-reset phones.

  Her remains and a handgun were discovered on May 28, in Carson National Forest's McGaffney Ridge area, confirmed by authorities on May 30.

  The cause of death is undetermined as the investigation continues.
