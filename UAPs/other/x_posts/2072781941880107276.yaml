  🚨CONGRESSMAN ON UFO WHISTLEBLOWER'S DEATH "He was in the legacy program, had firsthand experience with craft."

  Matthew Sullivan died two weeks before he was set to speak privately with members of Congress about UFOs. Both David Grusch and Jake Barber reportedly knew him personally, and sources say Sullivan had firsthand experience with craft through a legacy program. Grusch allegedly submitted the case to the Office of Inspector General, who called it warranted and credible, but a letter meant to alert the FBI was never received during the Biden administration and had to be resubmitted. Whether the FBI is now investigating remains unconfirmed.

  "Both Grusch and Jake Barber knew Matthew Sullivan, who was found dead two weeks before he was supposed to testify before Congress."
  "He was in the legacy program, had firsthand experience with craft."
  "They said that it's warranted and credible that it should be investigated."
  "We found out that it had never been received."
  "They've indicated that they won't talk about an active investigation, which is kind of the tell that they are actively investigating."

  Episode with Rep. Eric Burlison out now.
